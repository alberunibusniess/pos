<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>দোকানের কপি বানান</title>
<style>
:root{--pri:#0f766e;--bg:#f1f5f9;--line:#dfe6ee;--text:#0f172a;--muted:#5b6b7f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:24px 16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;
 box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18)}
label{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:10px;
 background:#f8fafc;border:1px solid var(--line);font:inherit;color:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,118,110,.2)}
textarea{min-height:76px;resize:vertical}
button{width:100%;min-height:54px;margin-top:20px;border:0;border-radius:12px;
 background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
button:hover{filter:brightness(1.06)}
.note{background:#fff8e6;border:1px solid #f5d98a;border-radius:12px;padding:14px;
 margin-top:20px;font-size:.9rem}
.ok{background:#e9f9f0;border-color:#9ae0bd}
code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
  <h1>দোকানের কপি বানান</h1>
  <p class="sub">নাম লিখে বোতাম চাপুন — ওই দোকানের নিজের ফাইলটা নেমে আসবে।</p>
  <div class="card">
    <label>দোকানের নাম (বাংলা) *</label>
    <input id="name" placeholder="যেমন: বিসমিল্লাহ জেনারেল স্টোর">
    <label>দোকানের নাম (English)</label>
    <input id="name_en" placeholder="Bismillah General Store">
    <label>ফোন</label>
    <input id="phone" placeholder="01XXXXXXXXX" inputmode="tel">
    <label>ঠিকানা</label>
    <textarea id="address" placeholder="বাজার রোড, সাভার, ঢাকা"></textarea>
    <label>কার নামে দেওয়া হলো (আপনার হিসাবের জন্য)</label>
    <input id="issued" placeholder="যেমন: করিম ভাই · ০১৭১১…">
    <button id="go">⬇ এই দোকানের ফাইল নামান</button>
  </div>
  <div class="note" id="note">
    <strong>মনে রাখবেন:</strong> ফাইলের ভিতরে দোকানের নাম বসানো থাকে আর সেটিংস থেকে
    বদলানো যায় না। কেউ কপি করে অন্য দোকানে চালালে তার মেমোতে এই নামই ছাপা হবে।
  </div>
</div>
<script>
const HEAD = "<!doctype html>\n<html lang=\"bn\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#0f766e\">\n<title>POS<\/title>\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"apple-touch-icon\" href=\"icon-192.png\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"description\" content=\"Offline shop billing\">\n<style>\n/* ===================================================================\n   One design, two themes, two screen shapes.\n\n   Everything is driven by the tokens on :root, so a colour or a text\n   size changes in one place.  Sizes are in rem against a root font the\n   shopkeeper can set, which is how the whole interface grows without\n   any layout being rebuilt.\n   =================================================================== */\n:root{\n  --pri:#0f766e; --pri-d:#0b5f58; --pri-l:#14b8a6;\n  --acc:#7c3aed; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;\n  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --surface3:#e9eef4;\n  --line:#dfe6ee; --text:#0f172a; --muted:#5b6b7f; --faint:#94a3b8;\n  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);\n  --shadow-lg:0 2px 6px rgba(15,23,42,.08),0 24px 48px -24px rgba(15,23,42,.3);\n  --r:14px; --r-sm:10px; --r-lg:22px;\n  --pad:18px; --gap:14px;\n  --tap:48px;                     /* never smaller: shop fingers, fast hands */\n  --fs:16px;\n  color-scheme:light;\n}\nhtml[data-theme=\"dark\"]{\n  --bg:#0b1117; --surface:#141c25; --surface2:#1b242f; --surface3:#26323f;\n  --line:#2b3745; --text:#e8eef5; --muted:#9aabbd; --faint:#64748b;\n  --pri:#14b8a6; --pri-d:#0d9488; --pri-l:#2dd4bf;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);\n  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -24px rgba(0,0,0,.8);\n  color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:border-box}\nhtml{font-size:var(--fs);-webkit-text-size-adjust:100%}\nbody{\n  margin:0;background:var(--bg);color:var(--text);\n  font-family:\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,-apple-system,\n              \"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  font-size:1rem;line-height:1.5;\n  -webkit-font-smoothing:antialiased;\n  overscroll-behavior-y:none;\n}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;border:0;background:none}\nh1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25}\na{color:var(--pri);text-decoration:none}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}\n::-webkit-scrollbar-track{background:transparent}\n\n/* ------------------------------------------------------------ shell */\n#app{display:flex;min-height:100dvh}\n#rail{\n  width:248px;flex:0 0 248px;background:var(--surface);\n  border-right:1px solid var(--line);display:flex;flex-direction:column;\n  position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:30;\n}\n.brand{padding:22px 20px 16px;display:flex;gap:12px;align-items:center}\n.brand-mark{\n  width:42px;height:42px;border-radius:12px;flex:0 0 42px;\n  background:linear-gradient(135deg,var(--pri-l),var(--pri-d));\n  display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;\n  box-shadow:var(--shadow);\n}\n.brand-name{font-weight:700;font-size:1.02rem;line-height:1.2;\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.brand-sub{font-size:.76rem;color:var(--faint);margin-top:2px}\n#nav{padding:6px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}\n.navbtn{\n  display:flex;align-items:center;gap:12px;width:100%;\n  min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);\n  color:var(--muted);font-size:.97rem;font-weight:600;text-align:left;\n  transition:background .12s,color .12s;\n}\n.navbtn:hover{background:var(--surface2);color:var(--text)}\n.navbtn.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}\n.navbtn .ic{width:22px;flex:0 0 22px;display:grid;place-items:center;font-size:1.05rem}\n.navbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.navbtn .pip{\n  min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);\n  color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;\n}\n.rail-foot{padding:12px 16px 18px;border-top:1px solid var(--line);\n  font-size:.74rem;color:var(--faint);line-height:1.5}\n\n#main{flex:1;min-width:0;display:flex;flex-direction:column}\n#top{\n  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);\n  backdrop-filter:saturate(180%) blur(12px);\n  -webkit-backdrop-filter:saturate(180%) blur(12px);\n  border-bottom:1px solid var(--line);\n  padding:12px var(--pad);display:flex;flex-wrap:wrap;gap:10px;align-items:center;\n}\n#top h1{font-size:1.5rem;flex:1;min-width:140px}\n.topbar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n#page{padding:var(--pad);flex:1;max-width:1600px;width:100%;margin:0 auto}\n\n/* ------------------------------------------------------------ pieces */\n.card{background:var(--surface);border:1px solid var(--line);\n  border-radius:var(--r);box-shadow:var(--shadow)}\n.card-pad{padding:var(--pad)}\n.grid{display:grid;gap:var(--gap)}\n.row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}\n.spread{display:flex;gap:var(--gap);align-items:center;justify-content:space-between}\n.stack{display:flex;flex-direction:column;gap:var(--gap)}\n.muted{color:var(--muted)}.faint{color:var(--faint)}\n.small{font-size:.86rem}.tiny{font-size:.76rem}\n.right{text-align:right}.center{text-align:center}\n.nowrap{white-space:nowrap}\n.grow{flex:1;min-width:0}\n.hide{display:none !important}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:8px;\n  min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);\n  font-weight:700;font-size:.95rem;background:var(--surface2);\n  border:1px solid var(--line);color:var(--text);\n  transition:filter .12s,transform .06s,background .12s;\n}\n.btn:hover{filter:brightness(.97)}\n.btn:active{transform:translateY(1px)}\n.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}\n.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}\n.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}\n.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.btn-ghost{background:transparent}\n.btn-lg{min-height:58px;font-size:1.06rem;padding:0 24px}\n.btn-sm{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:8px}\n.btn-icon{width:var(--tap);padding:0;flex:0 0 var(--tap)}\n.btn[disabled]{opacity:.45;pointer-events:none}\n\n.field{display:flex;flex-direction:column;gap:6px;min-width:0}\n.field > label{font-size:.82rem;color:var(--muted);font-weight:600}\n.inp{\n  width:100%;min-height:var(--tap);padding:10px 14px;border-radius:var(--r-sm);\n  background:var(--surface2);border:1px solid var(--line);color:var(--text);\n  outline:none;transition:border-color .12s,box-shadow .12s;\n}\n.inp:focus{border-color:var(--pri);\n  box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}\ntextarea.inp{min-height:84px;resize:vertical}\nselect.inp{appearance:none;\n  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),\n                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);\n  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;\n  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}\n\n.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;\n  border-radius:17px;background:var(--surface2);border:1px solid var(--line);\n  font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}\n.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}\n.chip-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);\n  border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}\n.chip-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);\n  border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}\n.chip-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);\n  border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}\n\n.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);\n  border-radius:var(--r-sm);padding:3px;gap:3px;overflow-x:auto;max-width:100%}\n.seg button{min-height:38px;padding:0 14px;border-radius:8px;font-weight:600;\n  font-size:.88rem;color:var(--muted);white-space:nowrap}\n.seg button.on{background:var(--pri);color:#fff}\n\ntable.tbl{width:100%;border-collapse:collapse;font-size:.92rem}\ntable.tbl th{\n  text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;\n  color:var(--faint);font-weight:700;padding:10px 12px;\n  border-bottom:1px solid var(--line);white-space:nowrap;\n  position:sticky;top:0;background:var(--surface);z-index:1;\n}\ntable.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}\ntable.tbl tr:last-child td{border-bottom:0}\ntable.tbl tbody tr:hover{background:var(--surface2)}\n.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}\n\n.tile{padding:16px 18px;border-radius:var(--r);background:var(--surface);\n  border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}\n.tile .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;\n  color:var(--faint);font-weight:700}\n.tile .v{font-size:1.9rem;font-weight:800;margin-top:6px;line-height:1.1;\n  overflow-wrap:anywhere}\n.tile .s{font-size:.8rem;color:var(--muted);margin-top:4px}\n\n.bar{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}\n.bar > i{display:block;height:100%;background:var(--pri);border-radius:4px;\n  transition:width .35s ease}\n\n.empty{padding:48px 20px;text-align:center;color:var(--faint)}\n.empty .big{font-size:2.4rem;margin-bottom:10px;opacity:.55}\n\n/* --------------------------------------------------------- dialogs */\n.veil{position:fixed;inset:0;background:rgba(6,12,20,.55);z-index:60;\n  display:flex;align-items:center;justify-content:center;padding:16px;\n  backdrop-filter:blur(3px);animation:fade .14s ease}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.modal{background:var(--surface);border-radius:var(--r-lg);width:min(680px,100%);\n  max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);\n  animation:pop .16s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}\n@keyframes pop{from{transform:translateY(12px) scale(.99);opacity:0}}\n.modal > header{padding:18px var(--pad) 12px;display:flex;gap:12px;align-items:center;\n  border-bottom:1px solid var(--line)}\n.modal > header h3{font-size:1.15rem;flex:1}\n.modal > .body{padding:var(--pad);overflow-y:auto;flex:1}\n.modal > footer{padding:14px var(--pad);border-top:1px solid var(--line);\n  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}\n.modal > footer .btn{flex:1;min-width:120px}\n\n#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));\n  transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;\n  gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}\n.toast{padding:12px 18px;border-radius:var(--r-sm);background:var(--text);\n  color:var(--bg);font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);\n  animation:rise .18s ease;max-width:100%;text-align:center}\n@keyframes rise{from{transform:translateY(10px);opacity:0}}\n.toast.ok{background:var(--ok);color:#fff}\n.toast.bad{background:var(--bad);color:#fff}\n.toast.warn{background:var(--warn);color:#fff}\n\n/* --------------------------------------------------------- till */\n.till{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--gap);align-items:start}\n.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));\n  gap:10px}\n.ptile{padding:12px;border-radius:var(--r-sm);background:var(--surface);\n  border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;\n  gap:6px;min-height:104px;transition:transform .07s,border-color .12s,box-shadow .12s}\n.ptile:hover{border-color:var(--pri);box-shadow:var(--shadow)}\n.ptile:active{transform:scale(.98)}\n.ptile .pn{font-weight:700;font-size:.9rem;line-height:1.25;\n  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.ptile .pp{font-weight:800;color:var(--pri);font-size:1.05rem;margin-top:auto}\n.ptile .ps{font-size:.72rem;color:var(--faint)}\n.ptile.out{opacity:.62}\n.ptile .thumb{width:100%;height:74px;border-radius:8px;object-fit:cover;\n  background:var(--surface3)}\n.cartline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;\n  padding:10px 0;border-bottom:1px solid var(--line)}\n.qtybox{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);\n  border-radius:8px;overflow:hidden;background:var(--surface2)}\n.qtybox button{width:36px;height:36px;font-weight:800;font-size:1.05rem;color:var(--muted)}\n.qtybox button:hover{background:var(--surface3);color:var(--text)}\n.qtybox .q{min-width:48px;text-align:center;font-weight:700;font-size:.92rem}\n.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}\n.totals .big{font-size:1.5rem;font-weight:800}\n\n/* --------------------------------------------------------- receipt */\n.slip{background:#fff;color:#000;font-family:\"Courier New\",ui-monospace,monospace;\n  font-size:12px;line-height:1.45;padding:10px;white-space:pre-wrap;\n  width:100%;max-width:340px;margin:0 auto;border-radius:6px}\n\n/* --------------------------------------------------------- phone */\n#tabbar{display:none}\n@media (max-width:900px){\n  :root{--pad:14px;--gap:12px}\n  #rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);\n    transition:transform .2s ease;box-shadow:var(--shadow-lg)}\n  body.drawer #rail{transform:none}\n  body.drawer::after{content:\"\";position:fixed;inset:0;background:rgba(6,12,20,.5);\n    z-index:25}\n  #top h1{font-size:1.2rem}\n  #page{padding-bottom:calc(76px + env(safe-area-inset-bottom))}\n  .till{grid-template-columns:1fr}\n  .tile .v{font-size:1.55rem}\n  #tabbar{\n    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;\n    left:0;right:0;bottom:0;z-index:40;background:var(--surface);\n    border-top:1px solid var(--line);\n    padding-bottom:env(safe-area-inset-bottom);\n  }\n  #tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;\n    padding:9px 2px 7px;font-size:.66rem;font-weight:700;color:var(--muted)}\n  #tabbar button .ic{font-size:1.24rem}\n  #tabbar button.on{color:var(--pri)}\n  .modal{width:100%;max-height:96dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;\n    margin-top:auto;animation:sheet .2s ease}\n  .veil{align-items:flex-end;padding:0}\n  @keyframes sheet{from{transform:translateY(24px)}}\n  .modal > footer .btn{min-width:0}\n}\n@media (min-width:901px){ .only-phone{display:none !important} }\n\n@media print{\n  body{background:#fff}\n  #rail,#top,#tabbar,.veil,#toast,.noprint{display:none !important}\n  #page{padding:0;max-width:none}\n  .slip{max-width:none;font-size:12px;padding:0}\n}\n\n/* ===================================================================\n   PREMIUM LAYER\n   Depth, gradient and type refinements applied on top of the base.\n   Everything still reads from the same tokens, so a theme switch\n   carries through the whole thing.\n   =================================================================== */\n:root{\n  --r:16px; --r-sm:12px; --r-lg:26px;\n  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -16px rgba(15,23,42,.28);\n  --shadow-lg:0 4px 10px rgba(15,23,4 nd handed to the print dialog; the same text is drawn onto a\n   canvas for the WhatsApp copy.\n   ================================================================= */\n(function (root) {\n  \"use strict\";\n  const A = root.App, el = A.el, T = root.T;\n\n  function width() { return parseInt(A.eng.setting(\"paper\", \"32\"), 10) || 32; }\n  function bn() { return A.eng.setting(\"receipt_bn_digits\", \"0\") === \"1\"; }\n\n  function pad(s, n) { s = String(s); return s.length >= n ? s.slice(0, n)\n    : s + new Array(n - s.length + 1).join(\" \"); }\n  function padL(s, n) { s = String(s); return s.length >= n ? s.slice(-n)\n    : new Array(n - s.length + 1).join(\" \") + s; }\n  function centre(s, w) {\n    s = String(s).slice(0, w);\n    const left = Math.max(Math.floor((w - s.length) / 2), 0);\n    return new Array(left + 1).join(\" \") + s;\n  }\n  function rule(ch, w) { return new Array(w + 1).join(ch); }\n  function two(left, right, w) {\n    right = String(right);\n    left = String(left).slice(0, Math.max(w - right.length - 1, 1));\n    return left + new Array(Math.max(w - left.length - right.length, 1) + 1).join(\" \") + right;\n  }\n  function wrap(text, w) {\n    const out = [];\n    String(text).split(/\\s+/).forEach(function (word) {\n      if (!out.length) { out.push(word); return; }\n      if ((out[out.length - 1] + \" \" + word).length <= w) out[out.length - 1] += \" \" + word;\n      else out.push(word);\n    });\n    return out;\n  }\n\n  /** The plain-text slip.  Currency is ASCII: a thermal head prints ৳ as\n   *  a black box. */\n  A.receiptText = function (sale, items) {\n    const w = width(), sym = A.symAscii(), e = A.eng;\n    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)\n      .toLocaleString(\"en-US\", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };\n    const L = [];\n    L.push(centre(A.shopName().toUpperCase(), w));\n    const phone = e.setting(\"business_phone\", root.SHOP.phone);\n    const addr = e.setting(\"business_address\", root.SHOP.address);\n    if (addr) wrap(addr, w).forEach(function (x) { L.push(centre(x, w)); });\n    if (phone) L.push(centre(phone, w));\n    L.push(rule(\"=\", w));\n    L.push(two(\"Invoice\", sale.invoice_no, w));\n    L.push(two(\"Date\", String(sale.created_at).slice(0, 16).replace(\"T\", \" \"), w));\n    if (sale.customer_name && sale.customer_name !== T(\"Walk-in\")) {\n      L.push(two(\"Customer\", sale.customer_name, w));\n    }\n    if (sale.customer_phone) L.push(two(\"Phone\", sale.customer_phone, w));\n    L.push(rule(\"-\", w));\n    L.push(pad(\"ITEM\", w - 12) + padL(\"AMOUNT\", 12));\n    L.push(rule(\"-\", w));\n    (items || []).forEach(function (it) {\n      wrap(it.name, w).forEach(function (x) { L.push(x); });\n      const qty = (Math.round(it.qty * 1000) / 1000) + \" \" + (it.unit || \"\");\n      L.push(two(\"  \" + qty + \" x \" + n(it.price), n(it.line_total), w));\n    });\n    L.push(rule(\"-\", w));\n    L.push(two(\"Subtotal\", n(sale.subtotal), w));\n    if (Number(sale.discount_amt)) L.push(two(\"Discount\", \"-\" + n(sale.discount_amt), w));\n    if (Number(sale.tax_amt)) L.push(two(\"Tax (\" + sale.tax_percent + \"%)\", n(sale.tax_amt), w));\n    if (Number(sale.delivery_charge)) L.push(two(\"Delivery\", n(sale.delivery_charge), w));\n    L.push(rule(\"=\", w));\n    L.push(two(\"TOTAL\", sym + n(sale.grand_total), w));\n    if (Number(sale.paid_cash)) L.push(two(\"Cash\", n(sale.paid_cash), w));\n    if (Number(sale.paid_mobile)) {\n      L.push(two(sale.mobile_method || \"Mobile\", n(sale.paid_mobile), w));\n      if (sale.trx_id) L.push(two(\"TrxID\", sale.trx_id, w));\n    }\n    if (Number(sale.change_due)) L.push(two(\"Change\", n(sale.change_due), w));\n    if (Number(sale.due)) L.push(two(\"DUE\", n(sale.due), w));\n    L.push(rule(\"-\", w));\n    const foot = A.eng.setting(\"receipt_footer\", root.isBn()\n      ? \"ধন্যবাদ, আবার আসবেন\" : \"Thank you, please come again\");\n    if (foot) wrap(foot, w).forEach(function (x) { L.push(centre(x, w)); });\n    L.push(\"\");\n    let text = L.join(\"\\n\");\n    if (bn()) {\n      text = root.bnDigits(text);\n      // The invoice number, TrxID and phone are identifiers — someone has\n      // to type them back in or match them against a statement, and in\n      // Bengali digits they are useless for that.\n      [sale.invoice_no, sale.trx_id, sale.customer_phone].forEach(function (id) {\n        if (!id) return;\n        text = text.split(root.bnDigits(String(id))).join(String(id));\n      });\n    }\n    return text;\n  };\n\n  /** Print through the browser.  A hidden iframe keeps the app's own\n   *  screen out of the print, and closes itself afterwards. */\n  function printText(text) {\n    const frame = document.createElement(\"iframe\");\n    frame.style.cssText = \"position:fixed;right:0;bottom:0;width:0;height:0;border:0\";\n    document.body.appendChild(frame);\n    const w = width();\n    const doc = frame.contentWindow.document;\n    doc.open();\n    doc.write('<!doctype html><html><head><meta charset=\"utf-8\"><style>'\n      + '@page{size:' + (w > 40 ? \"80mm\" : \"58mm\") + ' auto;margin:2mm}'\n      + 'body{margin:0;font-family:\"Courier New\",monospace;'\n      + 'font-size:' + (w > 40 ? \"11px\" : \"12px\") + ';line-height:1.35;white-space:pre}'\n      + '<\/style><\/head><body><\/body><\/html>');\n    doc.close();\n    doc.body.textContent = text;\n    setTimeout(function () {\n      try { frame.contentWindow.focus(); frame.contentWindow.print(); }\n      catch (e) { A.toast(root.isBn() ? \"প্রিন্ট করা গেল না\" : \"Could not print\", \"bad\"); }\n      setTimeout(function () { frame.remove(); }, 1200);\n    }, 120);\n  }\n\n  A.printReceipt = function (sale, items) { printText(A.receiptText(sale, items)); };\n  A.printDayClose = function (pos, counted) {\n    const w = width(), sym = A.symAscii();\n    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)\n      . x + i * lh);\n    });\n    return c;\n  }\n\n  A.shareReceipt = function (sale, items) {\n    const text = A.receiptText(sale, items);\n    const canvas = toCanvas(text);\n    canvas.toBlob(function (blob) {\n      const file = blob ? new File([blob], sale.invoice_no + \".png\",\n        { type: \"image/png\" }) : null;\n      const caption = A.shopName() + \" · \" + sale.invoice_no + \" · \"\n        + A.money(sale.grand_total);\n      // Phones can hand the picture straight to WhatsApp; a desktop\n      // browser usually cannot, so it falls back to wa.me with the words\n      // and the picture saved beside it.\n      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {\n        navigator.share({ files: [file], text: caption }).catch(function () {});\n        return;\n      }\n      if (blob) A.download(blob, sale.invoice_no + \".png\");\n      const phone = sale.customer_phone;\n      if (phone) {\n        const url = A.eng.waLink(phone, caption + \"\\n\\n\"\n          + (root.isBn() ? \"মেমোর ছবি সংযুক্ত করুন\" : \"attach the saved memo picture\"));\n        window.open(url, \"_blank\", \"noopener\");\n      }\n      A.toast(root.isBn() ? \"মেমোর ছবি নেমেছে — WhatsApp-এ সংযুক্ত করুন\"\n                          : \"Memo image saved — attach it in WhatsApp\", \"ok\");\n    }, \"image/png\");\n  };\n\n  /** Shown the moment a sale is saved. */\n  A.saleDone = function (sale, items) {\n    const m = A.modal({ title: T(\"Sale completed\") });\n    m.body.appendChild(el(\"div\", { class: \"center\", style: { marginBottom: \"12px\" } }, [\n      el(\"div\", { style: { fontSize: \"2.6rem\", color: \"var(--ok)\" }, text: \"✓\" }),\n      el(\"div\", { style: { fontSize: \"1.8rem\", fontWeight: \"800\" },\n        text: A.money(sale.grand_total) }),\n      el(\"div\", { class: \"muted small\", text: sale.invoice_no }),\n      Number(sale.change_due) ? el(\"div\", { class: \"chip chip-ok\",\n        style: { marginTop: \"8px\" },\n        text: T(\" const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"')
