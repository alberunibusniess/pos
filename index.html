<script>
/* =================================================================
   The memo — on paper and as a picture.

   A thermal printer has no Bengali font, so anything Bengali has to
   reach it as dots, not letters.  The browser cannot send ESC/POS
   bytes, so the slip is laid out as plain text at the paper's column
   count and handed to the print dialog; the same text is drawn onto a
   canvas for the WhatsApp copy.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  function width() { return parseInt(A.eng.setting("paper", "32"), 10) || 32; }
  function bn() { return A.eng.setting("receipt_bn_digits", "0") === "1"; }

  function pad(s, n) { s = String(s); return s.length >= n ? s.slice(0, n)
    : s + new Array(n - s.length + 1).join(" "); }
  function padL(s, n) { s = String(s); return s.length >= n ? s.slice(-n)
    : new Array(n - s.length + 1).join(" ") + s; }
  function centre(s, w) {
    s = String(s).slice(0, w);
    const left = Math.max(Math.floor((w - s.length) / 2), 0);
    return new Array(left + 1).join(" ") + s;
  }
  function rule(ch, w) { return new Array(w + 1).join(ch); }
  function two(left, right, w) {
    right = String(right);
    left = String(left).slice(0, Math.max(w - right.length - 1, 1));
    return left + new Array(Math.max(w - left.length - right.length, 1) + 1).join(" ") + right;
  }
  function wrap(text, w) {
    const out = [];
    String(text).split(/\s+/).forEach(function (word) {
      if (!out.length) { out.push(word); return; }
      if ((out[out.length - 1] + " " + word).length <= w) out[out.length - 1] += " " + word;
      else out.push(word);
    });
    return out;
  }

  /** The plain-text slip.  Currency is ASCII: a thermal head prints ৳ as
   *  a black box. */
  A.receiptText = function (sale, items) {
    const w = width(), sym = A.symAscii(), e = A.eng;
    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)
      .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    const L = [];
    L.push(centre(A.shopName().toUpperCase(), w));
    const phone = e.setting("business_phone", root.SHOP.phone);
    const addr = e.setting("business_address", root.SHOP.address);
    if (addr) wrap(addr, w).forEach(function (x) { L.push(centre(x, w)); });
    if (phone) L.push(centre(phone, w));
    L.push(rule("=", w));
    L.push(two("Invoice", sale.invoice_no, w));
    L.push(two("Date", String(sale.created_at).slice(0, 16).replace("T", " "), w));
    if (sale.customer_name && sale.customer_name !== T("Walk-in")) {
      L.push(two("Customer", sale.customer_name, w));
    }
    if (sale.customer_phone) L.push(two("Phone", sale.customer_phone, w));
    L.push(rule("-", w));
    L.push(pad("ITEM", w - 12) + padL("AMOUNT", 12));
    L.push(rule("-", w));
    (items || []).forEach(function (it) {
      wrap(it.name, w).forEach(function (x) { L.push(x); });
      const qty = (Math.round(it.qty * 1000) / 1000) + " " + (it.unit || "");
      L.push(two("  " + qty + " x " + n(it.price), n(it.line_total), w));
    });
    /* The total is what the customer looks for, so nothing shares a line
       with it: rules above and below, and the workings only printed when
       there actually are any.  Subtotal on its own, equal to the total,
       is noise on a memo. */
    const adjusted = Number(sale.discount_amt) || Number(sale.tax_amt)
                   || Number(sale.delivery_charge);
    if (adjusted) {
      L.push(rule("-", w));
      L.push(two("Subtotal", n(sale.subtotal), w));
      if (Number(sale.discount_amt)) L.push(two("Discount", "-" + n(sale.discount_amt), w));
      if (Number(sale.tax_amt)) L.push(two("Tax (" + sale.tax_percent + "%)", n(sale.tax_amt), w));
      if (Number(sale.delivery_charge)) L.push(two("Delivery", n(sale.delivery_charge), w));
    }
    L.push(rule("=", w));
    L.push(two("TOTAL", sym + " " + n(sale.grand_total), w));
    L.push(rule("=", w));

    const paidLines = [];
    if (Number(sale.paid_cash)) paidLines.push(two("  Cash", n(sale.paid_cash), w));
    if (Number(sale.paid_mobile)) {
      paidLines.push(two("  " + (sale.mobile_method || "Mobile"), n(sale.paid_mobile), w));
      if (sale.trx_id) paidLines.push(two("  TrxID", sale.trx_id, w));
    }
    if (paidLines.length) {
      L.push("Paid by");
      paidLines.forEach(function (x) { L.push(x); });
    }
    if (Number(sale.change_due)) L.push(two("Change returned", n(sale.change_due), w));
    if (Number(sale.due)) {
      L.push(rule("-", w));
      L.push(two("DUE", sym + " " + n(sale.due), w));
    }
    L.push(rule("-", w));
    const foot = A.eng.setting("receipt_footer", root.isBn()
      ? "ধন্যবাদ, আবার আসবেন" : "Thank you, please come again");
    if (foot) wrap(foot, w).forEach(function (x) { L.push(centre(x, w)); });
    L.push("");
    let text = L.join("\n");
    if (bn()) {
      text = root.bnDigits(text);
      // The invoice number, TrxID and phone are identifiers — someone has
      // to type them back in or match them against a statement, and in
      // Bengali digits they are useless for that.
      [sale.invoice_no, sale.trx_id, sale.customer_phone].forEach(function (id) {
        if (!id) return;
        text = text.split(root.bnDigits(String(id))).join(String(id));
      });
    }
    return text;
  };

  /** Print through the browser.  A hidden iframe keeps the app's own
   *  screen out of the print, and closes itself afterwards. */
  function printText(text) {
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    const w = width();
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'
      + '@page{size:' + (w > 40 ? "80mm" : "58mm") + ' auto;margin:2mm}'
      + 'body{margin:0;font-family:"Courier New",monospace;'
      + 'font-size:' + (w > 40 ? "11px" : "12px") + ';line-height:1.35;white-space:pre}'
      + '</style></head><body></body></html>');
    doc.close();
    doc.body.textContent = text;
    setTimeout(function () {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch (e) { A.toast(root.isBn() ? "প্রিন্ট করা গেল না" : "Could not print", "bad"); }
      setTimeout(function () { frame.remove(); }, 1200);
    }, 120);
  }

  A.printReceipt = function (sale, items) { printText(A.receiptText(sale, items)); };
  A.printDayClose = function (pos, counted) {
    const w = width(), sym = A.symAscii();
    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)
      .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    const t = A.eng.totalsForDay(pos.day);
    const L = [centre(A.shopName().toUpperCase(), w), centre("DAY CLOSING", w), rule("=", w),
      two("Date", pos.day, w), two("Time", new Date().toTimeString().slice(0, 5), w),
      rule("-", w), two("Orders", String(t.orders), w),
      two("Total sales", n(t.revenue), w), rule("-", w),
      two("Opening cash", n(pos.opening), w), two("Cash sales", n(pos.cash_sales), w),
      two("Cash refunds", "-" + n(pos.cash_refunds), w),
      two("Cash expenses", "-" + n(pos.cash_expenses), w),
      two("To suppliers", "-" + n(pos.supplier_cash), w),
      two("Credit collected", n(pos.due_collected), w),
      two("Mobile banking", n(pos.agent_cash), w), rule("=", w),
      two("EXPECTED", sym + n(pos.expected), w), two("COUNTED", sym + n(counted), w),
      two("DIFFERENCE", n(counted - pos.expected), w), rule("-", w), "",
      "Signature: ______________", "", ""];
    printText(L.join("\n"));
  };

  /** The same slip as a PNG, for WhatsApp.  Bengali survives here because
   *  the phone's own font draws it and the customer receives pixels. */
  function toCanvas(text) {
    const lines = text.split("\n");
    const scale = 2;                       // crisp on a phone screen
    const cw = 7.2 * scale, lh = 17 * pad0(scale), padPx = 14 * scale;
    function pad0(s) { return s; }
    const w = Math.round(width() * cw + padPx * 2);
    const h = Math.round(lines.length * lh + padPx * 2);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#000000";
    g.font = (12 * scale) + 'px "Courier New",monospace';
    g.textBaseline = "top";
    lines.forEach(function (line, i) {
      g.fillText(line, padPx, padPx + i * lh);
    });
    return c;
  }

  A.shareReceipt = function (sale, items) {
    const text = A.receiptText(sale, items);
    const canvas = toCanvas(text);
    canvas.toBlob(function (blob) {
      const file = blob ? new File([blob], sale.invoice_no + ".png",
        { type: "image/png" }) : null;
      const caption = A.shopName() + " · " + sale.invoice_no + " · "
        + A.money(sale.grand_total);
      // Phones can hand the picture straight to WhatsApp; a desktop
      // browser usually cannot, so it falls back to wa.me with the words
      // and the picture saved beside it.
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], text: caption }).catch(function () {});
        return;
      }
      if (blob) A.download(blob, sale.invoice_no + ".png");
      const phone = sale.customer_phone;
      if (phone) {
        const url = A.eng.waLink(phone, caption + "\n\n"
          + (root.isBn() ? "মেমোর ছবি সংযুক্ত করুন" : "attach the saved memo picture"));
        window.open(url, "_blank", "noopener");
      }
      A.toast(root.isBn() ? "মেমোর ছবি নেমেছে — WhatsApp-এ সংযুক্ত করুন"
                          : "Memo image saved — attach it in WhatsApp", "ok");
    }, "image/png");
  };

  /** Shown the moment a sale is saved. */
  A.saleDone = function (sale, items) {
    const m = A.modal({ title: T("Sale completed") });
    m.body.appendChild(el("div", { class: "center", style: { marginBottom: "12px" } }, [
      el("div", { style: { fontSize: "2.6rem", color: "var(--ok)" }, text: "✓" }),
      el("div", { style: { fontSize: "1.8rem", fontWeight: "800" },
        text: A.money(sale.grand_total) }),
      el("div", { class: "muted small", text: sale.invoice_no }),
      Number(sale.change_due) ? el("div", { class: "chip chip-ok",
        style: { marginTop: "8px" },
        text: T("Change") + " " + A.money(sale.change_due) }) : null,
      Number(sale.due) ? el("div", { class: "chip chip-warn", style: { marginTop: "8px" },
        text: T("Due") + " " + A.money(sale.due) }) : null,
    ]));
    m.body.appendChild(el("div", { class: "slip", text: A.receiptText(sale, items) }));
    m.footer.appendChild(el("button", { class: "btn", text: "🖨 " + T("Print receipt"),
      onclick: function () { A.printReceipt(sale, items); } }));
    m.footer.appendChild(el("button", { class: "btn",
      text: "📄 " + (root.isBn() ? "A4 মেমো" : "A4 memo"),
      onclick: function () { A.showInvoice && A.showInvoice(sale, items); } }));
    m.footer.appendChild(el("button", { class: "btn btn-ok", text: "🟢 " + T("Send on WhatsApp"),
      onclick: function () { A.shareReceipt(sale, items); } }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Next sale") + " ▸",
      onclick: function () { m.close(); } }));
    if (A.eng.setting("auto_print", "0") === "1") {
      setTimeout(function () {
        if (A.eng.setting("memo_style", "slip") === "a4" && A.printInvoice) {
          A.printInvoice(sale, items);
        } else A.printReceipt(sale, items);
      }, 200);
    }
  };
})(window);
</script>
<script>
/* =================================================================
   A4 মেমো — the paper memo a shop hands over or files away.

   The thermal slip is for the counter: narrow, fast, disposable.  This
   is the other memo a Bangladeshi shop needs — the one on a full sheet
   with the shop's name at the top, a proper item table and a signature
   line, for a wholesale customer, a company account or the shop's own
   file copy.  It prints from any ordinary printer.

   Both are built from the same sale, so a bill can be printed either
   way, or both, without being re-entered.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  const bn = function () { return root.isBn(); };
  const L = function (b, e) { return bn() ? b : e; };

  /** Money for paper: grouped, no decimals when they are all zeros —
   *  a shop memo says 3,000 Tk, not 3,000.00. */
  function money(v, opts) {
    const n = Math.round((Number(v) || 0) * 100) / 100;
    const whole = Math.abs(n % 1) < 0.005;
    const txt = n.toLocaleString("en-US", {
      minimumFractionDigits: whole ? 0 : 2,
      maximumFractionDigits: 2,
    });
    if (!(opts && opts.sym)) return bn() ? root.bnDigits(txt) : txt;
    // "৫,০৫০ Tk" reads like two languages arguing; on a Bengali memo the
    // word is টাকা.
    return bn() ? root.bnDigits(txt) + " টাকা" : txt + " " + A.symAscii();
  }

  function dateLine(s) {
    return A.dateText(s) + (A.timeText(s) ? ", " + A.timeText(s) : "");
  }

  /* --------------------------------------------------------- build */
  A.invoiceNode = function (sale, items) {
    const e = A.eng;
    const shop = A.shopName();
    const phone = e.setting("business_phone", root.SHOP.phone);
    const addr = e.setting("business_address", root.SHOP.address);
    const due = Number(sale.due) || 0;
    const paid = Number(sale.paid_cash) + Number(sale.paid_mobile);
    const status = due > 0.005
      ? (paid > 0.005 ? L("আংশিক", "PARTIAL") : L("বাকি", "DUE"))
      : L("পরিশোধিত", "PAID");
    const statusTone = due > 0.005 ? (paid > 0.005 ? "warn" : "bad") : "ok";
    const isReturn = sale.kind === "return";

    const sheet = el("div", { class: "inv" });

    /* ---- masthead ---- */
    sheet.appendChild(el("div", { class: "inv-top" }, [
      el("div", { class: "inv-brand" }, [
        el("div", { class: "inv-mark", text: (shop || "?").trim().charAt(0) }),
        el("div", {}, [
          el("div", { class: "inv-shop", text: shop }),
          addr ? el("div", { class: "inv-meta", text: addr }) : null,
          phone ? el("div", { class: "inv-meta",
            text: L("মোবাইল: ", "Phone: ") + phone }) : null,
        ]),
      ]),
      el("div", { class: "inv-stamp " + statusTone }, [
        el("div", { class: "inv-stamp-t", text: status }),
        paid > 0.005 ? el("div", { class: "inv-stamp-s",
          text: L("মাধ্যম: ", "via ") + (sale.payment_method || "Cash") }) : null,
      ]),
    ]));
    sheet.appendChild(el("div", { class: "inv-rule" }));

    sheet.appendChild(el("h2", { class: "inv-title",
      text: isReturn ? L("ফেরত মেমো", "RETURN MEMO") : L("ক্যাশ মেমো", "CASH MEMO") }));

    /* ---- who and which ---- */
    const walkIn = !sale.customer_name || sale.customer_name === T("Walk-in")
                || sale.customer_name === "Walk-in";
    sheet.appendChild(el("div", { class: "inv-parties" }, [
      el("div", {}, [
        el("div", { class: "inv-lbl", text: L("যাকে দেওয়া হলো", "BILL TO") }),
        el("div", { class: "inv-cust",
          text: walkIn ? L("সাধারণ কাস্টমার", "Walk-in customer") : sale.customer_name }),
        sale.customer_phone
          ? el("div", { class: "inv-meta", text: sale.customer_phone }) : null,
        (function () {
          const c = sale.customer_id ? e.customer(sale.customer_id) : null;
          return c && c.address ? el("div", { class: "inv-meta", text: c.address }) : null;
        })(),
      ]),
      el("div", { class: "right" }, [
        el("div", { class: "inv-lbl", text: L("মেমোর বিবরণ", "MEMO DETAILS") }),
        el("div", { class: "inv-no", text: sale.invoice_no }),
        el("div", { class: "inv-meta", text: dateLine(sale.created_at) }),
        el("div", { class: "inv-meta",
          text: L("অবস্থা: ", "Status: ") + status }),
      ]),
    ]));

    /* ---- the goods ---- */
    const tb = el("tbody");
    (items || []).forEach(function (it, i) {
      tb.appendChild(el("tr", {}, [
        el("td", { class: "sl", text: bn() ? root.bnDigits(String(i + 1)) : String(i + 1) }),
        el("td", {}, [
          el("div", { class: "inv-item", text: it.name }),
          it.unit ? el("div", { class: "inv-meta", text: it.unit }) : null,
        ]),
        el("td", { class: "right", text: A.qty(it.qty) }),
        el("td", { class: "right", text: money(it.price) }),
        el("td", { class: "right strong", text: money(it.line_total) }),
      ]));
    });
    sheet.appendChild(el("table", { class: "inv-tbl" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { class: "sl", text: L("ক্রম", "SL") }),
        el("th", { text: L("পণ্যের বিবরণ", "Item description") }),
        el("th", { class: "right", text: L("পরিমাণ", "Qty") }),
        el("th", { class: "right", text: L("দর", "Rate") }),
        el("th", { class: "right", text: L("টাকা", "Amount") }),
      ])]),
      tb,
    ]));

    /* ---- the arithmetic ---- */
    const rows = [];
    const add = function (label, value, cls) {
      rows.push(el("div", { class: "inv-sum-r " + (cls || "") }, [
        el("span", { text: label }),
        el("span", { class: "num", text: value }),
      ]));
    };
    add(L("উপমোট", "Subtotal"), money(sale.subtotal));
    if (Number(sale.discount_amt)) add(L("ছাড়", "Discount"), "− " + money(sale.discount_amt));
    if (Number(sale.tax_amt)) {
      add(L("ট্যাক্স", "VAT") + " (" + (bn() ? root.bnDigits(String(sale.tax_percent))
        : sale.tax_percent) + "%)", money(sale.tax_amt));
    }
    if (Number(sale.delivery_charge)) {
      add(L("ডেলিভারি", "Delivery"), money(sale.delivery_charge));
    }
    rows.push(el("div", { class: "inv-sum-r total" }, [
      el("span", { text: L("সর্বমোট", "Total") }),
      el("span", { class: "num", text: money(sale.grand_total, { sym: true }) }),
    ]));
    if (Number(sale.paid_cash)) add(L("ক্যাশ", "Cash"), money(sale.paid_cash), "pay");
    if (Number(sale.paid_mobile)) {
      add(sale.mobile_method || L("মোবাইল", "Mobile"), money(sale.paid_mobile), "pay");
    }
    if (Number(sale.change_due)) add(L("ফেরত", "Change"), money(sale.change_due), "pay");
    if (due > 0.005) {
      rows.push(el("div", { class: "inv-sum-r due" }, [
        el("span", { text: L("বাকি রইল", "Balance due") }),
        el("span", { class: "num", text: money(due, { sym: true }) }),
      ]));
    }

    sheet.appendChild(el("div", { class: "inv-foot" }, [
      el("div", { class: "inv-words" }, [
        sale.trx_id ? el("div", { class: "inv-meta",
          text: "TrxID: " + sale.trx_id }) : null,
        sale.note ? el("div", { class: "inv-meta", text: sale.note }) : null,
      ]),
      el("div", { class: "inv-sum" }, rows),
    ]));

    sheet.appendChild(el("div", { class: "inv-sign" }, [
      el("div", { class: "inv-sign-b" }, [
        el("div", { class: "inv-line" }),
        el("div", { class: "inv-meta", text: L("কাস্টমারের স্বাক্ষর", "Customer signature") }),
      ]),
      el("div", { class: "inv-sign-b right" }, [
        el("div", { class: "inv-line" }),
        el("div", { class: "inv-meta", text: L("দোকানের পক্ষে", "For " + shop) }),
      ]),
    ]));

    const foot = e.setting("receipt_footer", L("ধন্যবাদ, আবার আসবেন",
      "Thank you, please come again"));
    sheet.appendChild(el("div", { class: "inv-note" }, [
      el("div", { text: foot }),
      el("div", { class: "inv-meta", text: L(
        "সব টাকার অঙ্ক বাংলাদেশি টাকায়। এটি কম্পিউটারে তৈরি মেমো।",
        "All amounts in Bangladeshi Taka. This is a computer-generated memo.") }),
    ]));

    return sheet;
  };

  /* --------------------------------------------------------- print */
  const SHEET_CSS = [
    '@page{size:A4;margin:12mm}',
    '*{box-sizing:border-box}',
    'body{margin:0;color:#101a17;background:#fff;',
    'font-family:"POS Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,',
    '-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:10.5pt;line-height:1.5}',
    '.inv{width:100%}',
    '.inv-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}',
    '.inv-brand{display:flex;gap:12px;align-items:flex-start;min-width:0}',
    '.inv-mark{width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:flex;',
    'align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20pt;',
    'background:var(--ink)}',
    '.inv-shop{font-size:17pt;font-weight:800;line-height:1.2;letter-spacing:-.01em}',
    '.inv-meta{font-size:8.6pt;color:#5d6b67;line-height:1.45}',
    '.inv-stamp{border:2px solid var(--stamp);border-radius:8px;padding:6px 16px;',
    'text-align:center;flex:0 0 auto}',
    '.inv-stamp-t{color:var(--stamp);font-weight:800;font-size:13pt}',
    '.inv-stamp-s{color:var(--stamp);font-size:8pt;margin-top:2px}',
    '.inv-rule{height:3px;background:var(--ink);margin:12px 0 0;border-radius:2px}',
    '.inv-title{text-align:center;color:var(--ink);font-size:14pt;',
    'margin:16px 0 18px;font-weight:800}',
    '.inv-parties{display:flex;gap:20px;justify-content:space-between;margin-bottom:18px}',
    '.inv-lbl{font-size:8.4pt;font-weight:800;color:var(--ink);',
    'margin-bottom:4px}',
    '.inv-cust{font-size:12pt;font-weight:800}',
    '.inv-no{font-size:12pt;font-weight:800}',
    '.right{text-align:right}',
    '.inv-tbl{width:100%;border-collapse:collapse}',
    '.inv-tbl th{font-size:8.4pt;font-weight:700;color:#5d6b67;text-align:left;',
    'padding:8px 10px;border-bottom:1.5px solid #cfd9d6}',
    '.inv-tbl th.right,.inv-tbl td.right{text-align:right}',
    '.inv-tbl td{padding:9px 10px;border-bottom:1px solid #e6ecea;vertical-align:top}',
    '.inv-tbl .sl{width:34px;color:#5d6b67}',
    '.inv-item{font-weight:700}',
    '.strong{font-weight:800}',
    '.inv-foot{display:flex;gap:24px;justify-content:space-between;margin-top:14px}',
    '.inv-words{flex:1;min-width:0;padding-top:6px}',
    '.inv-sum{flex:0 0 58%;max-width:300px}',
    '.inv-sum-r{display:flex;justify-content:space-between;gap:16px;padding:5px 0;',
    'font-size:10pt}',
    '.inv-sum-r .num{font-variant-numeric:tabular-nums;white-space:nowrap}',
    '.inv-sum-r.total{border-top:1.5px solid #cfd9d6;margin-top:6px;padding-top:9px;',
    'font-size:13pt;font-weight:800;color:var(--ink)}',
    '.inv-sum-r.pay{color:#5d6b67;font-size:9.4pt}',
    '.inv-sum-r.due{border-top:1px solid #e6ecea;margin-top:4px;padding-top:8px;',
    'font-weight:800;color:#b3261e}',
    '.inv-sign{display:flex;gap:40px;justify-content:space-between;margin-top:46px}',
    '.inv-sign-b{flex:0 0 42%}',
    '.inv-line{border-top:1px solid #9aa7a3;margin-bottom:5px}',
    '.inv-note{margin-top:28px;padding-top:10px;border-top:1px solid #e6ecea;',
    'text-align:center}',
  ].join("");

  function tones() {
    const css = getComputedStyle(document.documentElement);
    const ink = (css.getPropertyValue("--pri-d") || "#0b5f58").trim() || "#0b5f58";
    return { ink: ink };
  }

  A.printInvoice = function (sale, items) {
    const due = Number(sale.due) || 0;
    const paid = Number(sale.paid_cash) + Number(sale.paid_mobile);
    const stamp = due > 0.005 ? (paid > 0.005 ? "#b06a00" : "#b3261e") : "#12795f";
    const t = tones();
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html lang="' + (bn() ? "bn" : "en") + '"><head>'
      + '<meta charset="utf-8"><title>' + (sale.invoice_no || "memo") + '</title>'
      + "<style>:root{--ink:" + t.ink + ";--stamp:" + stamp + "}" + SHEET_CSS
      + "</style></head><body></body></html>");
    doc.close();
    // the embedded font lives in this document, so carry it across
    A.$$('style', document.head).forEach(function (s) {
      if (s.textContent.indexOf("@font-face") < 0) return;
      const copy = doc.createElement("style");
      copy.textContent = s.textContent;
      doc.head.appendChild(copy);
    });
    doc.body.appendChild(A.invoiceNode(sale, items));
    setTimeout(function () {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch (err) { A.toast(L("প্রিন্ট করা গেল না", "Could not print"), "bad"); }
      setTimeout(function () { frame.remove(); }, 1500);
    }, 260);
  };

  /** Show it on screen first — on a phone there is usually no printer,
   *  and the shopkeeper wants to check it before sending. */
  A.showInvoice = function (sale, items) {
    const m = A.modal({ title: L("A4 মেমো", "A4 memo"), noFocus: true });
    m.veil.querySelector(".modal").classList.add("wide");
    const paper = el("div", { class: "invpaper" }, [A.invoiceNode(sale, items)]);
    m.body.appendChild(paper);
    m.footer.appendChild(el("button", { class: "btn", text: T("Close"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: "🖨 " + T("Print"),
      onclick: function () { A.printInvoice(sale, items); } }));
  };
})(window);
</script>
<script>
/* =================================================================
   A real .xlsx, written by hand.

   CSV would have been easier, but Excel keeps mangling Bengali in CSV
   and the owner has to click through an import wizard.  A .xlsx opens
   with one double-click and keeps the text exactly as typed.

   The file is a ZIP.  Compression is skipped entirely (ZIP "stored"
   mode is perfectly valid), which removes the need for a deflate
   implementation and keeps this to a page of code.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App;

  const CRC = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const utf8 = (s) => new TextEncoder().encode(s);

  function zip(files) {
    const chunks = [], central = [];
    let offset = 0;
    files.forEach(function (f) {
      const name = utf8(f.name), data = utf8(f.body), sum = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);  // UTF-8 names
      local.setUint16(8, 0, true);                                      // stored
      local.setUint32(14, sum, true);
      local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
      local.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(local.buffer), name, data);

      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true);
      cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true);
      cen.setUint32(16, sum, true);
      cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true);
      cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), name);
      offset += 30 + name.length + data.length;
    });
    let censize = 0;
    central.forEach(function (c) { censize += c.length; });
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, censize, true); end.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]),
      { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    // Excel rejects raw control characters outright.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");

  function colName(i) {
    let s = "";
    i += 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s;
                    i = Math.floor((i - 1) / 26); }
    return s;
  }

  function sheetXml(rows) {
    let out = '<?xml version="1.0" encoding="UTF-8"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetData>';
    rows.forEach(function (row, r) {
      out += '<row r="' + (r + 1) + '">';
      (row || []).forEach(function (cell, c) {
        const ref = colName(c) + (r + 1);
        const isNum = typeof cell === "number" && isFinite(cell);
        if (cell === null || cell === undefined || cell === "") return;
        out += isNum
          ? '<c r="' + ref + '"><v>' + cell + '</v></c>'
          : '<c r="' + ref + '" t="inlineStr" s="' + (r === 0 ? 1 : 0) + '">'
            + '<is><t xml:space="preserve">' + esc(cell) + '</t></is></c>';
      });
      out += '</row>';
    });
    return out + '</sheetData></worksheet>';
  }

  /** rows[0] is treated as the header and comes out bold. */
  A.xlsx = function (sheetName, rows, fileName) {
    const safe = String(sheetName || "Sheet1").replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31);
    const blob = zip([
      { name: "[Content_Types].xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + '</Types>' },
      { name: "_rels/.rels", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>' },
      { name: "xl/workbook.xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
        + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
        + '<sheets><sheet name="' + esc(safe) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: "xl/_rels/workbook.xml.rels", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
        + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
        + '</Relationships>' },
      { name: "xl/styles.xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
        + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
        + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
        + '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'
        + '<borders count="1"><border/></borders>'
        + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
        + '<cellXfs count="2"><xf xfId="0"/><xf fontId="1" applyFont="1" xfId="0"/></cellXfs>'
        + '</styleSheet>' },
      { name: "xl/worksheets/sheet1.xml", body: sheetXml(rows) },
    ]);
    A.download(blob, (fileName || "export") + "-"
      + root.POSEngine.helpers.dayKey() + ".xlsx");
  };

  A.download = function (blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  };

  // ------------------------------------------------------------ backup
  A.saveBackup = function () {
    const dump = A.store.exportAll();
    dump.shop_name = A.shopName();
    const blob = new Blob([JSON.stringify(dump)], { type: "application/json" });
    A.download(blob, "pos-backup-" + root.POSEngine.helpers.dayKey() + ".json");
    A.eng.setSetting("last_backup", root.POSEngine.helpers.stamp());
    A.toast(root.isBn() ? "ব্যাকআপ ফাইল নেমে গেছে" : "Backup file downloaded", "ok");
  };

  A.restoreBackup = function () {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json";
    input.onchange = function () {
      const f = input.files && input.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (e) { return A.toast(root.isBn() ? "ফাইলটা পড়া গেল না" : "Could not read that file", "bad"); }
        A.confirm(root.isBn() ? "ব্যাকআপ ফেরাবেন?" : "Restore this backup?",
          root.isBn()
            ? "এখনকার সব হিসাব মুছে গিয়ে ব্যাকআপের হিসাব বসবে।\n\nব্যাকআপ নেওয়া হয়েছিল: "
              + String(data.saved_at || "").slice(0, 10)
            : "Everything now will be replaced by the backup.", { danger: true })
          .then(function (yes) {
            if (!yes) return;
            try {
              A.store.importAll(data).then(function () {
                A.toast(root.isBn() ? "ফেরানো হয়েছে" : "Restored", "ok");
                setTimeout(function () { location.reload(); }, 700);
              });
            } catch (e) {
              A.toast((root.isBn() ? "ফেরানো গেল না: " : "Restore failed: ") + e.message, "bad");
            }
          });
      };
      reader.readAsText(f);
    };
    input.click();
  };
})(window);
</script>
<script>
/* =================================================================
   Boot: open this shop's book, then draw.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el;

  function fatal(msg) {
    document.body.innerHTML = "";
    document.body.appendChild(el("div", { class: "empty",
      style: { paddingTop: "22vh" } }, [
      el("div", { class: "big", text: "⚠" }),
      el("h2", { style: { marginBottom: "8px" }, text: "চালু করা গেল না" }),
      el("div", { class: "muted", text: msg }),
    ]));
  }

  function start() {
    const S = root.POSStore;
    const store = new S.Store(S.activeShopId());
    store.open().then(function () {
      A.store = store;
      A.eng = new root.POSEngine(store);

      // First run: settings the shop expects to already be there.
      if (!store.tables.settings.units) {
        A.eng.setSetting("units", "pcs,kg,litre,packet,bosta,hali,dozen,gram");
      }
      if (!store.tables.settings.business_name && !root.SHOP.locked) {
        A.eng.setSetting("business_name", root.SHOP.name);
      }
      const shops = S.readShops();
      const me = shops.find(function (s) { return s.id === store.shopId; });
      if (me && me.name !== A.shopName()) {
        me.name = A.shopName(); S.writeShops(shops);
      }

      root.setLang(A.eng.setting("lang", "bn"));
      A.applyTheme();
      document.title = A.shopName() + " · POS";

      if (store._failed) {
        A.toast(root.isBn()
          ? "এই ব্রাউজারে হিসাব জমা রাখা যাচ্ছে না — প্রাইভেট উইন্ডো হলে বন্ধ করে সাধারণ উইন্ডোতে খুলুন"
          : "This browser will not store data — try a normal window", "bad");
      }

      A.go("dashboard");

      // Save everything still queued before the tab goes away.
      window.addEventListener("pagehide", function () { store.flush(); });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") store.flush();
      });
    }).catch(function (err) { fatal(err.message); });
  }


  // ---------------------------------------------------------- install
  /* Chrome hands over a one-shot prompt object; iOS Safari hands over
     nothing at all, so that one gets written instructions instead. */
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    A.installEvent = e;
    if (A.refreshInstallBtn) A.refreshInstallBtn();
  });
  window.addEventListener("appinstalled", function () {
    A.installEvent = null;
    A.toast(root.isBn() ? "অ্যাপ ইনস্টল হয়েছে" : "App installed", "ok");
    if (A.refreshInstallBtn) A.refreshInstallBtn();
  });

  // Register the offline cache, but only when served over http(s):
  // opened straight off the disk as a file:// page there is no scope for
  // a worker, and the attempt throws a confusing console error.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else { start(); }
})(window);
</script>
<div id="app">
  <aside id="rail"></aside>
  <div id="main">
    <header id="top">
      <button class="btn btn-ghost btn-icon only-phone" id="menubtn" aria-label="menu"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="top-title">POS</h1>
      <div class="topbar-tools" id="top-tools"></div>
    </header>
    <main id="page"></main>
  </div>
</div>
<nav id="tabbar"></nav>
<div id="toast"></div>
<script>
document.getElementById("menubtn").addEventListener("click", function () {
  document.body.classList.toggle("drawer");
});
document.addEventListener("click", function (e) {
  // Tapping the dimmed area closes the drawer on a phone.
  if (document.body.classList.contains("drawer") &&
      !e.target.closest("#rail") && !e.target.closest("#menubtn") &&
      !e.target.closest("#tabbar")) {
    document.body.classList.remove("drawer");
  }
});
</script>
</body>
</html>
