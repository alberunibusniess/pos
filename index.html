        if (after) after(row); else A.refresh();
      } }));
  }

  /** Buying stock in — the mirror of a sale.  Stock goes up, the cost
   *  price is refreshed, and anything unpaid becomes a debt to that
   *  supplier. */
  function purchaseDialog() {
    const m = A.modal({ title: T("Buy stock") });
    const lines = [];
    const sup = A.field(T("Name"), { type: "select", value: "",
      options: [{ value: "", label: "— " + T("None") + " —" }]
        .concat(A.eng.suppliers().map(function (s) {
          return { value: String(s.id), label: s.name }; })) });
    const list = el("div", { class: "stack", style: { gap: "6px", margin: "12px 0" } });
    const pick = A.field(T("Products"), { type: "select", value: "",
      options: [{ value: "", label: "— " + T("Add") + " —" }]
        .concat(A.eng.products().map(function (p) {
          return { value: String(p.id), label: p.name }; })) });
    pick.input.addEventListener("change", function () {
      const p = A.eng.product(parseInt(pick.input.value, 10));
      if (!p) return;
      lines.push({ product_id: p.id, name: p.name, unit: p.unit, qty: 1,
                   cost: Number(p.cost_price) || 0 });
      pick.input.value = ""; drawLines();
    });
    const totalBox = el("div", { class: "spread", style: { marginTop: "8px" } });
    const paid = A.field(T("Paid"), { type: "number", inputmode: "decimal", value: "", min: 0 });
    const how = A.field(T("Paid by"), { type: "select", value: "Cash",
      options: ["Cash", "bKash", "Nagad", "Rocket", "Bank"] });
    paid.input.addEventListener("input", drawTotal);

    function total() {
      return lines.reduce(function (s, l) { return s + l.qty * l.cost; }, 0);
    }
    function drawTotal() {
      A.clear(totalBox);
      const t = total(), p = paid.num(0);
      totalBox.appendChild(el("span", { class: "muted", text: T("Total") }));
      totalBox.appendChild(el("strong", { text: A.money(t) }));
      if (t - p > 0.005) {
        totalBox.appendChild(el("span", { class: "chip chip-warn",
          text: T("Due") + " " + A.money(t - p) }));
      }
    }
    function drawLines() {
      A.clear(list);
      lines.forEach(function (l, i) {
        const q = A.field("", { type: "number", inputmode: "decimal", value: l.qty, min: 0 });
        const c = A.field("", { type: "number", inputmode: "decimal", value: l.cost, min: 0 });
        q.input.addEventListener("input", function () { l.qty = q.num(0); drawTotal(); });
        c.input.addEventListener("input", function () { l.cost = c.num(0); drawTotal(); });
        list.appendChild(el("div", { class: "row", style: { gap: "6px" } }, [
          el("div", { class: "grow small", text: l.name }),
          el("div", { style: { width: "84px" } }, [q]),
          el("div", { style: { width: "104px" } }, [c]),
          el("button", { class: "btn btn-sm", text: "✕", onclick: function () {
            lines.splice(i, 1); drawLines(); } }),
        ]));
      });
      drawTotal();
    }
    m.body.appendChild(sup);
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [pick]));
    m.body.appendChild(list);
    m.body.appendChild(el("div", { class: "row" },
      [el("div", { class: "grow" }, [paid]), el("div", { class: "grow" }, [how])]));
    m.body.appendChild(totalBox);
    drawLines();
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        if (!lines.length) return A.toast(T("Nothing here yet"), "warn");
        const id = parseInt(sup.input.value, 10) || null;
        const s = id ? A.eng.supplier(id) : null;
        A.eng.createPurchase({ supplier_id: id, supplier_name: s ? s.name : "",
          paid: paid.num(0), method: how.val(), user_id: A.user ? A.user.id : null },
          lines);
        m.close(); A.toast(T("Saved"), "ok"); A.refresh();
      } }));
  }
  A.buyStock = purchaseDialog;

  A.register("suppliers", function (page) {
    const bar = el("div", { class: "card card-pad toolbar" });
    bar.appendChild(el("div", { class: "grow" }, [
      el("div", { class: "tiny faint", text: T("Payable to suppliers") }),
      el("strong", { style: { fontSize: "1.3rem",
        color: A.eng.totalPayable() > 0 ? "var(--bad)" : "var(--ok)" },
        text: A.money(A.eng.totalPayable()) })]));
    bar.appendChild(el("button", { class: "btn btn-sm btn-acc", text: "🚚 " + T("Buy stock"),
      onclick: purchaseDialog }));
    bar.appendChild(el("button", { class: "btn btn-sm btn-pri", text: "＋ " + T("New supplier"),
      onclick: function () { supplierEditor(null); } }));
    page.appendChild(bar);

    const rows = A.eng.suppliers();
    const card = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
    if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
      el("div", { class: "big", text: "🚚" }), el("div", { text: T("Nothing here yet") })]));
    else {
      const tbl = el("table", { class: "tbl" });
      tbl.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { text: T("Name") }), el("th", { text: T("Phone") }),
        el("th", { class: "right", text: T("Owed") }),
        el("th", { class: "right", text: T("Actions") })])]));
      const body = el("tbody");
      rows.forEach(function (s) {
        const owes = Number(s.payable) > 0;
        body.appendChild(el("tr", {}, [
          el("td", { style: { fontWeight: "700" }, text: s.name }),
          el("td", { class: "muted nowrap", text: s.phone || "" }),
          el("td", { class: "right" }, [owes
            ? el("span", { class: "chip chip-bad", text: A.money(s.payable) })
            : el("span", { class: "faint", text: "—" })]),
          el("td", { class: "right nowrap" }, [
            owes ? el("button", { class: "btn btn-sm", text: T("Pay supplier"),
              onclick: function () {
                payDialog({ title: T("Pay supplier") + " · " + s.name, balance: s.payable,
                  onPay: function (n, how, note) {
                    return A.eng.paySupplier(s.id, n, how, note, A.user ? A.user.id : null);
                  } });
              } }) : null,
            el("button", { class: "btn btn-sm", text: "✎", style: { marginLeft: "6px" },
              onclick: function () { supplierEditor(s); } }),
          ]),
        ]));
      });
      tbl.appendChild(body);
      card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
    }
    page.appendChild(card);

    const today = root.POSEngine.helpers.dayKey();
    const d = new Date(); d.setDate(d.getDate() - 30);
    const recent = A.eng.purchasesBetween(root.POSEngine.helpers.dayKey(d), today);
    if (recent.length) {
      const c2 = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
      c2.appendChild(el("div", { class: "card-pad",
        style: { borderBottom: "1px solid var(--line)" } },
        [el("h3", { style: { fontSize: "1rem" }, text: T("Purchase history") })]));
      const tbl = el("table", { class: "tbl" });
      tbl.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { text: T("Date") }), el("th", { text: T("Name") }),
        el("th", { class: "right", text: T("Total") }),
        el("th", { class: "right", text: T("Paid") }),
        el("th", { class: "right", text: T("Due") })])]));
      const body = el("tbody");
      recent.slice(0, 40).forEach(function (p) {
        body.appendChild(el("tr", {}, [
          el("td", { class: "nowrap", text: A.dateText(p.bought_on) }),
          el("td", { text: p.supplier_name || "—" }),
          el("td", { class: "right", text: A.money(p.subtotal) }),
          el("td", { class: "right muted", text: A.money(p.paid) }),
          el("td", { class: "right", text: p.due > 0 ? A.money(p.due) : "—" }),
        ]));
      });
      tbl.appendChild(body);
      c2.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      page.appendChild(c2);
    }
  });
})(window);
</script>
<script>
/* =================================================================
   বাকি — the credit book, on a screen of its own.

   This is the screen a shopkeeper opens most, so it is built around
   one question asked one way: type a number, see the person, see what
   they owe, take the money or send the reminder.  Everything else on
   the page is secondary to that box.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  function ageChip(days) {
    if (!days) return null;
    const cls = days >= 60 ? "chip-bad" : days >= 30 ? "chip-warn" : "chip-ok";
    const n = root.isBn() ? root.bnDigits(String(days)) : String(days);
    return el("span", { class: "chip " + cls,
      text: n + " " + (root.isBn() ? "দিন" : "days") });
  }

  function reminderFor(p) {
    return A.eng.reminderText(p.row, root.isBn() ? "bn" : "en");
  }

  function waPhone(c) { return c.whatsapp || c.phone || ""; }

  /* ------------------------------------------------------ action row */
  function actions(p, opts) {
    opts = opts || {};
    const c = p.row;
    const text = reminderFor(p);
    const wa = waPhone(c);
    const size = opts.small ? " btn-sm" : "";
    const box = el("div", { class: "row", style: { gap: "8px" } });

    box.appendChild(el("button", {
      class: "btn btn-pri" + size,
      onclick: function (e) { e.stopPropagation(); A.settleDue(c); },
    }, [A.icon("plus"),
        el("span", { text: root.isBn() ? "টাকা জমা নিন" : "Take payment" })]));

    if (wa) {
      box.appendChild(el("a", {
        class: "btn btn-ok" + size, href: A.eng.waLink(wa, text),
        target: "_blank", rel: "noopener",
        onclick: function (e) { e.stopPropagation(); },
      }, [A.icon("whatsapp", { fill: true }), el("span", { text: "WhatsApp" })]));
    }
    if (c.phone) {
      box.appendChild(el("a", {
        class: "btn" + size, href: A.eng.smsLink(c.phone, text),
        onclick: function (e) { e.stopPropagation(); },
      }, [A.icon("sms"), el("span", { text: "SMS" })]));
      box.appendChild(el("a", {
        class: "btn" + size, href: "tel:" + String(c.phone).replace(/[^\d+]/g, ""),
        onclick: function (e) { e.stopPropagation(); },
      }, [A.icon("phone"), el("span", { text: root.isBn() ? "কল" : "Call" })]));
    }
    if (!wa && !c.phone) {
      box.appendChild(el("span", { class: "chip chip-warn",
        text: root.isBn() ? "নম্বর নেই" : "no number" }));
    }
    return box;
  }

  /* ------------------------------------------------- one person, full */
  function personCard(p) {
    const c = p.row;
    const card = el("div", { class: "card duecard" });

    card.appendChild(el("div", { class: "duecard-head" }, [
      el("div", { class: "avatar", text: (c.name || "?").trim().charAt(0) }),
      el("div", { class: "grow" }, [
        el("div", { class: "duecard-name", text: c.name || "—" }),
        el("div", { class: "small muted", text: [c.phone, c.address]
          .filter(Boolean).join(" · ") || (root.isBn() ? "নম্বর দেওয়া নেই" : "no phone") }),
      ]),
      el("div", { class: "right" }, [
        el("div", { class: "tiny faint up", text: T("Due") }),
        el("div", { class: "duecard-amt", text: A.money(p.due) }),
        p.days ? el("div", { style: { marginTop: "4px" } }, [ageChip(p.days)]) : null,
      ]),
    ]));

    card.appendChild(el("div", { class: "duecard-body" }, [
      el("div", { class: "row minirow" }, [
        el("div", { class: "mini" }, [
          el("div", { class: "tiny faint up", text: root.isBn() ? "মোট বাকিতে নিয়েছে" : "Charged" }),
          el("div", { class: "mini-v", text: A.money(p.charged) }),
        ]),
        el("div", { class: "mini" }, [
          el("div", { class: "tiny faint up", text: root.isBn() ? "মোট শোধ করেছে" : "Paid" }),
          el("div", { class: "mini-v", text: A.money(p.paid) }),
        ]),
        el("div", { class: "mini" }, [
          el("div", { class: "tiny faint up", text: root.isBn() ? "শেষ বাকি" : "Last credit" }),
          el("div", { class: "mini-v small",
            text: p.last_sale ? A.dateText(p.last_sale) : "—" }),
        ]),
        el("div", { class: "mini" }, [
          el("div", { class: "tiny faint up", text: root.isBn() ? "শেষ জমা" : "Last payment" }),
          el("div", { class: "mini-v small",
            text: p.last_paid ? A.dateText(p.last_paid) : "—" }),
        ]),
      ]),
      el("div", { style: { marginTop: "14px" } }, [actions(p)]),
    ]));

    /* ---- the ledger: every credit and every payment, oldest first ---- */
    const led = p.ledger.slice().reverse();
    if (led.length) {
      card.appendChild(el("div", { class: "duecard-led" }, [
        el("div", { class: "spread", style: { marginBottom: "8px" } }, [
          el("strong", { class: "small", text: root.isBn() ? "খাতা" : "Ledger" }),
          el("button", { class: "btn btn-sm", text: "⬇ " + T("Excel"),
            onclick: function () {
              A.xlsx((c.name || "customer") + " — " + T("Due"),
                [[T("Date"), root.isBn() ? "কী" : "Entry", root.isBn() ? "বিবরণ" : "Detail",
                  root.isBn() ? "বাকি নিল" : "Credit", root.isBn() ? "জমা দিল" : "Paid",
                  root.isBn() ? "অবশিষ্ট" : "Balance"]]
                .concat(p.ledger.map(function (e) {
                  return [e.day, e.kind === "sale" ? "Credit" : "Payment",
                          e.label + (e.note ? " · " + e.note : ""),
                          e.kind === "sale" ? e.amount : "",
                          e.kind === "payment" ? e.amount : "", e.balance];
                })), "due-" + (c.phone || c.id));
            } }),
        ]),
        el("div", { class: "scroll-x" }, [
          el("table", { class: "tbl" }, [
            el("thead", {}, [el("tr", {}, [
              el("th", { text: T("Date") }),
              el("th", { text: root.isBn() ? "বিবরণ" : "Detail" }),
              el("th", { class: "right", text: root.isBn() ? "বাকি" : "Credit" }),
              el("th", { class: "right", text: root.isBn() ? "জমা" : "Paid" }),
              el("th", { class: "right", text: root.isBn() ? "অবশিষ্ট" : "Balance" }),
            ])]),
            el("tbody", {}, led.map(function (e) {
              return el("tr", {}, [
                el("td", { class: "nowrap small", text: A.dateText(e.day) }),
                el("td", {}, [
                  el("span", { class: "chip " + (e.kind === "sale" ? "chip-warn" : "chip-ok"),
                    text: e.kind === "sale"
                      ? (root.isBn() ? "বাকিতে বিক্রি" : "Credit sale")
                      : (root.isBn() ? "টাকা জমা" : "Payment") }),
                  el("span", { class: "tiny faint",
                    style: { marginInlineStart: "8px" },
                    text: e.label + (e.note ? " · " + e.note : "") }),
                ]),
                el("td", { class: "right nowrap",
                  text: e.kind === "sale" ? A.money(e.amount) : "" }),
                el("td", { class: "right nowrap ok-t",
                  text: e.kind === "payment" ? A.money(e.amount) : "" }),
                el("td", { class: "right nowrap strong", text: A.money(e.balance) }),
              ]);
            })),
          ]),
        ]),
      ]));
    }
    return card;
  }

  /* ------------------------------------------------------ list row */
  function listRow(p, onOpen) {
    const c = p.row;
    return el("button", { class: "duerow", onclick: function () { onOpen(p); } }, [
      el("span", { class: "avatar sm", text: (c.name || "?").trim().charAt(0) }),
      el("span", { class: "grow" }, [
        el("span", { class: "duerow-name", text: c.name || "—" }),
        el("span", { class: "tiny faint", text: c.phone || "" }),
      ]),
      p.days ? el("span", { class: "only-wide" }, [ageChip(p.days)]) : null,
      el("span", { class: "duerow-amt", text: A.money(p.due) }),
      el("span", { class: "duerow-go" }, [A.icon("right")]),
    ]);
  }

  /* ========================================================= screen */
  A.register("dues", function (page) {
    const e = A.eng;
    let query = A.params.q || "";
    let sort = "amount";
    let open = null;               // the person whose full card is showing

    const sum = e.dueSummary();

    /* ---- the search box: the point of the screen ---- */
    const hero = el("div", { class: "card searchhero first" });
    const box = A.field("", {
      placeholder: root.isBn()
        ? "নম্বর বা নাম লিখুন — কত বাকি দেখুন"
        : "Type a number or name",
      wide: true, value: query, inputmode: "tel",
    });
    box.input.classList.add("bigsearch");
    box.input.addEventListener("input", function () {
      query = box.val(); open = null; draw();
    });
    hero.appendChild(el("span", { class: "hero-ico" }, [A.icon("search")]));
    hero.appendChild(box);
    const clearBtn = el("button", {
      class: "btn btn-ghost btn-icon", title: T("Close"),
      onclick: function () { query = ""; box.input.value = ""; open = null;
                             draw(); box.input.focus(); },
    }, [A.icon("close")]);
    hero.appendChild(clearBtn);
    page.appendChild(hero);

    /* ---- head tiles ---- */
    page.appendChild(el("div", { class: "grid tiles4" }, [
      el("div", { class: "tile tile-hero" }, [
        el("div", { class: "k", text: root.isBn() ? "মোট বাকি" : "Total outstanding" }),
        el("div", { class: "v", text: A.money(sum.total) }),
        el("div", { class: "s", text: (root.isBn()
          ? (root.bnDigits(String(sum.people)) + " জনের কাছে")
          : (sum.people + " people")) }),
      ]),
      el("div", { class: "tile" }, [
        el("div", { class: "k", text: root.isBn() ? "এ মাসে আদায়" : "Collected this month" }),
        el("div", { class: "v ok-t", text: A.money(sum.collected_month) }),
      ]),
      el("div", { class: "tile" }, [
        el("div", { class: "k", text: root.isBn() ? "৩০+ দিনের পুরাতন" : "Older than 30 days" }),
        el("div", { class: "v bad-t", text: A.money(sum.old30) }),
        el("div", { class: "s", text: root.isBn()
          ? (root.bnDigits(String(sum.people30)) + " জন")
          : (sum.people30 + " people") }),
      ]),
      el("div", { class: "tile" }, [
        el("div", { class: "k", text: root.isBn() ? "সবচেয়ে বেশি" : "Largest" }),
        el("div", { class: "v", style: { fontSize: "1.25rem" },
          text: sum.biggest ? (sum.biggest.row.name || "—") : "—" }),
        el("div", { class: "s", text: sum.biggest ? A.money(sum.biggest.due) : "" }),
      ]),
    ]));

    const body = el("div", { class: "stack", style: { marginTop: "var(--gap)" } });
    page.appendChild(body);

    function draw() {
      A.clear(body);
      clearBtn.classList.toggle("hide", !query);

      /* a person is open — show only them, with a way back */
      if (open) {
        body.appendChild(el("button", { class: "btn btn-sm",
          onclick: function () { open = null; draw(); } },
          [A.icon("back"),
           el("span", { text: root.isBn() ? "সবার তালিকা" : "All" })]));
        body.appendChild(personCard(e.dueProfile(open.row.id)));
        return;
      }

      const matches = query ? e.dueCustomers({ search: query, sort: sort }) : null;

      /* searching */
      if (matches) {
        if (!matches.length) {
          /* maybe they exist but owe nothing — say so, don't just blank */
          const any = e.customers(query);
          body.appendChild(el("div", { class: "card card-pad empty" }, [
            el("div", { class: "big", text: any.length ? "✓" : "🔍" }),
            el("div", { text: any.length
              ? (any[0].name + " — " + (root.isBn() ? "কোনো বাকি নেই" : "no due"))
              : (root.isBn() ? "এই নামে বা নম্বরে কাউকে পাওয়া যায়নি"
                             : "No one found") }),
            any.length ? el("div", { class: "row center",
              style: { justifyContent: "center", marginTop: "12px" } }, [
              el("button", { class: "btn btn-sm",
                text: root.isBn() ? "কাস্টমারের পাতায় দেখুন" : "Open in customers",
                onclick: function () { A.go("customers"); } }),
            ]) : null,
          ]));
          return;
        }
        if (matches.length === 1) { body.appendChild(personCard(matches[0])); return; }
        body.appendChild(el("div", { class: "small muted",
          text: (root.isBn() ? root.bnDigits(String(matches.length)) + " জন পাওয়া গেছে"
                             : matches.length + " found") }));
        const list = el("div", { class: "card duelist" });
        matches.forEach(function (p) {
          list.appendChild(listRow(p, function (x) { open = x; draw(); }));
        });
        body.appendChild(list);
        return;
      }

      /* not searching — the whole book */
      const all = e.dueCustomers({ sort: sort });
      const bar = el("div", { class: "spread" }, [
        el("div", { class: "seg" }, [
          ["amount", root.isBn() ? "টাকা বেশি" : "Biggest"],
          ["old", root.isBn() ? "পুরাতন আগে" : "Oldest"],
          ["name", root.isBn() ? "নাম" : "Name"],
        ].map(function (s) {
          return el("button", { class: sort === s[0] ? "on" : "", text: s[1],
            onclick: function () { sort = s[0]; draw(); } });
        })),
        el("button", { class: "btn btn-sm", text: "⬇ " + T("Excel"),
          onclick: function () {
            A.xlsx(root.isBn() ? "বাকির তালিকা" : "Due list",
              [[T("Name"), T("Phone"), root.isBn() ? "বাকি" : "Due",
                root.isBn() ? "কত দিনের" : "Days old",
                root.isBn() ? "শেষ জমা" : "Last payment"]]
              .concat(all.map(function (p) {
                return [p.row.name, p.row.phone, p.due, p.days, p.last_paid];
              })), "due-list");
          } }),
      ]);
      body.appendChild(bar);

      if (!all.length) {
        body.appendChild(el("div", { class: "card card-pad empty" }, [
          el("div", { class: "big", text: "✓" }),
          el("div", { text: root.isBn() ? "কারও কাছে বাকি নেই" : "Nobody owes anything" }),
        ]));
        return;
      }
      const list = el("div", { class: "card duelist" });
      all.forEach(function (p) {
        list.appendChild(listRow(p, function (x) { open = x; draw(); }));
      });
      body.appendChild(list);
    }

    draw();
    setTimeout(function () {
      if (window.innerWidth > 900 && !query) box.input.focus();
    }, 80);
  });
})(window);
</script>
<script>
/* =================================================================
   Reports — daily, monthly, yearly, and every one of them downloadable.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const dayKey = root.POSEngine.helpers.dayKey;

  function monthKey(s) { return String(s).slice(0, 7); }
  function yearKey(s) { return String(s).slice(0, 4); }

  /** The month in the language the rest of the page is in — an English
   *  month beside a Bengali year reads like a bug, because it is one. */
  function monthName(d) {
    const bn = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন",
                "জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
    if (!root.isBn()) {
      return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }
    return bn[d.getMonth()] + " " + root.bnDigits(String(d.getFullYear()));
  }

  function rangeFor(mode, anchor, custom) {
    if (mode === "custom") {
      const from = (custom && custom.from) || dayKey(new Date());
      const to = (custom && custom.to) || dayKey(new Date());
      const a = from <= to ? from : to, b = from <= to ? to : from;
      return { start: a, end: b, label: A.dateText(a) + " – " + A.dateText(b) };
    }
    const d = anchor ? new Date(anchor) : new Date();
    if (mode === "daily") {
      const start = new Date(d.getFullYear(), d.getMonth(), 1);
      return { start: dayKey(start), end: dayKey(new Date(d.getFullYear(), d.getMonth() + 1, 0)),
               label: monthName(d) };
    }
    if (mode === "monthly") {
      return { start: d.getFullYear() + "-01-01", end: d.getFullYear() + "-12-31",
               label: root.isBn() ? root.bnDigits(String(d.getFullYear()))
                                  : String(d.getFullYear()) };
    }
    return { start: "1970-01-01", end: "2999-12-31",
             label: root.isBn() ? "সব বছর" : "All years" };
  }

  function bucket(mode, sales) {
    const by = {};
    sales.forEach(function (s) {
      const key = mode === "daily" ? String(s.created_at).slice(0, 10)
                : mode === "monthly" ? monthKey(s.created_at) : yearKey(s.created_at);
      const b = by[key] || (by[key] = { key: key, orders: 0, revenue: 0, discount: 0,
        tax: 0, cash: 0, mobile: 0, due: 0, cogs: 0 });
      if (s.kind !== "return") b.orders += 1;
      b.revenue += Number(s.grand_total) || 0;
      b.discount += Number(s.discount_amt) || 0;
      b.tax += Number(s.tax_amt) || 0;
      b.cash += (Number(s.paid_cash) || 0) - (Number(s.change_due) || 0);
      b.mobile += Number(s.paid_mobile) || 0;
      b.due += Number(s.due) || 0;
      const sign = s.kind === "return" ? -1 : 1;
      A.eng.saleItems(s.id).forEach(function (it) {
        b.cogs += sign * (Number(it.qty) || 0) * (Number(it.cost) || 0);
      });
    });
    return Object.keys(by).sort().reverse().map(function (k) {
      const b = by[k];
      b.profit = Math.round((b.revenue - b.tax - b.cogs) * 100) / 100;
      return b;
    });
  }

  A.register("reports", function (page) {
    let mode = "daily";
    let anchor = new Date();

    const custom = { from: dayKey(new Date()), to: dayKey(new Date()) };
    const head = el("div", { class: "card card-pad repbar" });
    const seg = el("div", { class: "seg" });
    const label = el("strong", { class: "lbl" });
    const body = el("div", { style: { marginTop: "var(--gap)" } });
    page.appendChild(head);

    const MODES = [["daily", root.isBn() ? "দৈনিক" : "Daily"],
                   ["monthly", root.isBn() ? "মাসিক" : "Monthly"],
                   ["yearly", root.isBn() ? "বার্ষিক" : "Yearly"],
                   ["custom", root.isBn() ? "তারিখ ধরে" : "Pick dates"]];
    MODES.forEach(function (m) {
      seg.appendChild(el("button", { class: mode === m[0] ? "on" : "", text: m[1],
        onclick: function () { mode = m[0]; anchor = new Date(); draw(); } }));
    });
    head.appendChild(seg);
    const stepper = el("div", { class: "stepper" }, [
      el("button", { class: "btn btn-sm btn-icon", text: "‹",
        title: root.isBn() ? "আগের" : "Previous", onclick: function () {
          if (mode === "daily") anchor.setMonth(anchor.getMonth() - 1);
          else anchor.setFullYear(anchor.getFullYear() - 1);
          draw();
        } }),
      label,
      el("button", { class: "btn btn-sm btn-icon", text: "›",
        title: root.isBn() ? "পরের" : "Next", onclick: function () {
          if (mode === "daily") anchor.setMonth(anchor.getMonth() + 1);
          else anchor.setFullYear(anchor.getFullYear() + 1);
          draw();
        } }),
    ]);
    head.appendChild(stepper);

    /* Two dates and four shortcuts — most of the time the shopkeeper
       wants "this month" or "last 7 days", not a calendar. */
    const fromF = A.field(root.isBn() ? "থেকে" : "From",
      { type: "date", value: custom.from, key: "rep-from" });
    const toF = A.field(root.isBn() ? "পর্যন্ত" : "To",
      { type: "date", value: custom.to, key: "rep-to" });
    fromF.input.addEventListener("change", function () {
      custom.from = fromF.input.value || custom.from; draw(); });
    toF.input.addEventListener("change", function () {
      custom.to = toF.input.value || custom.to; draw(); });

    function shortcut(labelText, days, whole) {
      return el("button", { class: "btn btn-sm", text: labelText, onclick: function () {
        const now = new Date();
        if (whole === "month") {
          custom.from = dayKey(new Date(now.getFullYear(), now.getMonth(), 1));
          custom.to = dayKey(now);
        } else if (whole === "lastmonth") {
          custom.from = dayKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
          custom.to = dayKey(new Date(now.getFullYear(), now.getMonth(), 0));
        } else {
          const back = new Date(now); back.setDate(back.getDate() - (days - 1));
          custom.from = dayKey(back); custom.to = dayKey(now);
        }
        fromF.input.value = custom.from; toF.input.value = custom.to;
        draw();
      } });
    }
    const picker = el("div", { class: "datepick" }, [
      el("div", { class: "row", style: { gap: "10px" } }, [fromF, toF]),
      el("div", { class: "row", style: { gap: "6px", marginTop: "10px" } }, [
        shortcut(root.isBn() ? "আজ" : "Today", 1),
        shortcut(root.isBn() ? "৭ দিন" : "7 days", 7),
        shortcut(root.isBn() ? "এ মাসে" : "This month", 0, "month"),
        shortcut(root.isBn() ? "গত মাস" : "Last month", 0, "lastmonth"),
      ]),
    ]);

    const dl = el("button", { class: "btn btn-sm btn-pri", text: "⇩ " + T("Excel") });
    head.appendChild(dl);
    page.appendChild(picker);
    page.appendChild(body);

    function draw() {
      A.$$(".seg button", head).forEach(function (b, i) {
        b.className = MODES[i] && MODES[i][0] === mode ? "on" : "";
      });
      const pick = mode === "custom";
      picker.classList.toggle("hide", !pick);
      stepper.classList.toggle("hide", pick);
      const r = rangeFor(mode, anchor, custom);
      label.textContent = (mode === "yearly" || mode === "custom") ? r.label
        : (root.isBn() ? root.bnDigits(r.label) : r.label);
      const sales = A.eng.salesBetween(r.start, r.end);
      const rows = bucket(mode === "custom" ? "daily" : mode, sales);

      A.clear(body);
      const totals = rows.reduce(function (t, b) {
        ["orders", "revenue", "discount", "tax", "cash", "mobile", "due", "cogs", "profit"]
          .forEach(function (f) { t[f] = (t[f] || 0) + b[f]; });
        return t;
      }, {});

      body.appendChild(el("div", { class: "grid",
        style: { gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))",
                 marginBottom: "var(--gap)" } }, [
        el("div", { class: "tile" }, [el("div", { class: "k", text: T("Revenue") }),
          el("div", { class: "v", text: A.money(totals.revenue || 0) })]),
        el("div", { class: "tile" }, [el("div", { class: "k", text: T("Orders today") }),
          el("div", { class: "v", text: A.qty(totals.orders || 0) })]),
        el("div", { class: "tile" }, [el("div", { class: "k", text: T("Gross profit") }),
          el("div", { class: "v", style: { color: "var(--ok)" },
            text: A.money(totals.profit || 0) })]),
        el("div", { class: "tile" }, [el("div", { class: "k", text: T("Due") }),
          el("div", { class: "v", style: { color: "var(--warn)" },
            text: A.money(totals.due || 0) })]),
      ]));

      const card = el("div", { class: "card" });
      if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "📈" }), el("div", { text: T("Nothing here yet") })]));
      else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { class: "right", text: T("Orders today") }),
          el("th", { class: "right", text: T("Revenue") }),
          el("th", { class: "right", text: T("Discount") }),
          el("th", { class: "right", text: T("Cash") }),
          el("th", { class: "right", text: T("Mobile / bKash") }),
          el("th", { class: "right", text: T("Due") }),
          el("th", { class: "right", text: T("Profit") })])]));
        const tb = el("tbody");
        rows.forEach(function (b) {
          tb.appendChild(el("tr", {}, [
            el("td", { class: "nowrap", style: { fontWeight: "700" },
              text: (mode === "daily" || mode === "custom") ? A.dateText(b.key)
                : (root.isBn() ? root.bnDigits(b.key) : b.key) }),
            el("td", { class: "right", text: A.qty(b.orders) }),
            el("td", { class: "right", text: A.money(b.revenue) }),
            el("td", { class: "right muted", text: A.money(b.discount) }),
            el("td", { class: "right", text: A.money(b.cash) }),
            el("td", { class: "right", text: A.money(b.mobile) }),
            el("td", { class: "right", style: { color: b.due > 0 ? "var(--warn)" : null },
              text: A.money(b.due) }),
            el("td", { class: "right", style: { fontWeight: "700",
              color: b.profit >= 0 ? "var(--ok)" : "var(--bad)" }, text: A.money(b.profit) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }
      body.appendChild(card);

      dl.onclick = function () {
        const header = ["Period", "Orders", "Revenue", "Discount", "Tax",
                        "Cash", "Mobile", "Due", "Cost of goods", "Profit"];
        const data = rows.map(function (b) {
          return [b.key, b.orders, r2(b.revenue), r2(b.discount), r2(b.tax),
                  r2(b.cash), r2(b.mobile), r2(b.due), r2(b.cogs), r2(b.profit)];
        });
        data.push([]);
        data.push(["TOTAL", totals.orders || 0, r2(totals.revenue), r2(totals.discount),
          r2(totals.tax), r2(totals.cash), r2(totals.mobile), r2(totals.due),
          r2(totals.cogs), r2(totals.profit)]);
        A.xlsx(T(mode.charAt(0).toUpperCase() + mode.slice(1)) + " " + r.label,
          [header].concat(data), "report-" + mode);
      };
      function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

      // --- the individual bills, so a shopkeeper can find one ---
      const list = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
      list.appendChild(el("div", { class: "card-pad spread",
        style: { borderBottom: "1px solid var(--line)" } }, [
        el("h3", { style: { fontSize: "1rem" }, text: T("Invoice") }),
        el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"), onclick: function () {
          const out = [["Invoice", "Date", "Time", "Customer", "Phone", "Kind",
            "Subtotal", "Discount", "Tax", "Delivery", "Total", "Cash", "Mobile",
            "Method", "TrxID", "Change", "Due", "Status"]];
          sales.forEach(function (s) {
            out.push([s.invoice_no, String(s.created_at).slice(0, 10),
              String(s.created_at).slice(11, 16), s.customer_name, s.customer_phone,
              s.kind, s.subtotal, s.discount_amt, s.tax_amt, s.delivery_charge,
              s.grand_total, s.paid_cash, s.paid_mobile, s.payment_method,
              s.trx_id || "", s.change_due, s.due, s.status]);
          });
          A.xlsx(T("Invoice"), out, "bills-" + mode);
        } }),
      ]));
      const tbl2 = el("table", { class: "tbl" });
      tbl2.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { text: T("Invoice") }), el("th", { text: T("Date") }),
        el("th", { text: T("Name") }), el("th", { text: T("Method") }),
        el("th", { class: "right", text: T("Total") }),
        el("th", { class: "right", text: "" })])]));
      const tb2 = el("tbody");
      sales.slice(0, 120).forEach(function (s) {
        tb2.appendChild(el("tr", {}, [
          el("td", { class: "nowrap", style: { fontWeight: "700" } }, [
            el("span", { text: s.invoice_no }),
            s.kind === "return" ? el("span", { class: "chip chip-warn",
              style: { marginLeft: "6px" }, text: T("Return") }) : null]),
          el("td", { class: "nowrap tiny muted",
            text: A.dateText(s.created_at) + " " + A.timeText(s.created_at) }),
          el("td", { text: s.customer_name || T("Walk-in") }),
          el("td", { class: "tiny muted", text: T(s.payment_method || "Cash") }),
          el("td", { class: "right", style: { fontWeight: "700" },
            text: A.money(s.grand_total) }),
          el("td", { class: "right nowrap" }, [
            el("button", { class: "btn btn-sm", text: "👁",
              onclick: function () { A.showSale(s); } })]),
        ]));
      });
      tbl2.appendChild(tb2);
      list.appendChild(el("div", { class: "scroll-x" }, [tbl2]));
      body.appendChild(list);
    }
    draw();
  });

  /** One bill, reopened — reprint it, send it, or cancel it. */
  A.showSale = function (s) {
    const items = A.eng.saleItems(s.id);
    const m = A.modal({ title: s.invoice_no });
    m.body.appendChild(el("div", { class: "slip",
      text: A.receiptText(s, items) }));
    m.footer.appendChild(el("button", { class: "btn", text: "🖨 " + T("Print"),
      onclick: function () { A.printReceipt(s, items); } }));
    m.footer.appendChild(el("button", { class: "btn",
      text: "📄 " + (root.isBn() ? "A4 মেমো" : "A4 memo"),
      onclick: function () { A.showInvoice && A.showInvoice(s, items); } }));
    if (s.customer_phone) {
      m.footer.appendChild(el("button", { class: "btn btn-ok",
        text: "🟢 WhatsApp", onclick: function () { A.shareReceipt(s, items); } }));
    }
    if (s.status === "completed") {
      m.footer.appendChild(el("button", { class: "btn btn-bad", text: T("Void"),
        onclick: function () {
          A.confirm(T("Void") + " " + s.invoice_no, root.isBn()
            ? "মাল স্টকে ফিরে যাবে, বাকি থাকলে সেটাও বাদ যাবে।"
            : "Stock goes back and any due is removed.", { danger: true })
            .then(function (y) {
              if (!y) return;
              A.eng.voidSale(s.id); m.close();
              A.toast(T("Void") + " ✓", "ok"); A.refresh();
            });
        } }));
    }
  };
})(window);
</script>
<script>
/* =================================================================
   Profit, expenses, the day close, and the staff list.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const H = root.POSEngine.helpers;

  function ranges() {
    const d = new Date();
    const today = H.dayKey();
    return {
      today: { start: today, end: today, label: T("Today") },
      month: { start: H.dayKey(new Date(d.getFullYear(), d.getMonth(), 1)),
               end: today, label: T("This month") },
      d30: { start: H.dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 29)),
             end: today, label: T("Last 30 days") },
      year: { start: d.getFullYear() + "-01-01", end: today, label: T("This year") },
    };
  }

  A.register("money", function (page) {
    let tab = (A.params && A.params.tab) || "profit";
    let rangeKey = "month";

    const tabs = el("div", { class: "seg", style: { marginBottom: "var(--gap)" } });
    [["profit", "Profit"], ["expenses", "Expenses"], ["close", "Day close"],
     ["staff", "Staff"]].forEach(function (t) {
      tabs.appendChild(el("button", { class: tab === t[0] ? "on" : "", text: T(t[1]),
        onclick: function () { tab = t[0]; draw(); } }));
    });
    page.appendChild(tabs);
    const body = el("div");
    page.appendChild(body);

    function rangePicker(onPick) {
      const r = ranges();
      const seg = el("div", { class: "seg", style: { marginBottom: "var(--gap)" } });
      Object.keys(r).forEach(function (k) {
        seg.appendChild(el("button", { class: rangeKey === k ? "on" : "", text: r[k].label,
          onclick: function () { rangeKey = k; onPick(); } }));
      });
      return seg;
    }

    function drawProfit() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const p = A.eng.profitBetween(r.start, r.end);
      const line = function (k, v, tone, big) {
        return el("div", { class: "spread", style: { padding: "10px 0",
          borderBottom: "1px solid var(--line)" } }, [
          el("span", { class: big ? "" : "muted",
            style: big ? { fontWeight: "800", fontSize: "1.05rem" } : null, text: T(k) }),
          el("strong", { style: { fontSize: big ? "1.35rem" : "1rem",
            color: tone ? "var(--" + tone + ")" : null }, text: v }),
        ]);
      };
      body.appendChild(el("div", { class: "card card-pad" }, [
        el("h3", { style: { fontSize: "1.05rem", marginBottom: "6px" },
          text: root.isBn() ? "আসলে কত থাকল" : "What is actually left" }),
        el("div", { class: "small muted", style: { marginBottom: "10px" },
          text: root.isBn() ? "বিক্রয়, বাদ পণ্যের খরচ, বাদ দোকানের খরচ"
                            : "Sales, minus what the goods cost, minus shop expenses" }),
        line("Revenue", A.money(p.revenue)),
        line("Cost of goods", "−" + A.money(p.cogs)),
        line("Gross profit", A.money(p.gross), "ok"),
        line("Expenses", "−" + A.money(p.expenses)),
        line("Net profit", A.money(p.net), p.net >= 0 ? "ok" : "bad", true),
      ]));
      if (p.lines_without_cost) {
        body.appendChild(el("div", { class: "card card-pad small",
          style: { marginTop: "var(--gap)", borderColor: "var(--warn)" },
          text: root.isBn()
            ? p.lines_without_cost + " টি লাইনে ক্রয়মূল্য নেই, তাই লাভের হিসাব ওইটুকু বেশি দেখাচ্ছে। পণ্যে ক্রয়মূল্য বসালে ঠিক হয়ে যাবে।"
            : p.lines_without_cost + " lines have no cost price, so profit reads high." }));
      }
      const byCat = A.eng.expenseByCategory(r.start, r.end);
      if (byCat.length) {
        body.appendChild(el("div", { class: "card card-pad", style: { marginTop: "var(--gap)" } },
          [el("h3", { style: { fontSize: "1rem", marginBottom: "10px" }, text: T("Expenses") })]
          .concat(byCat.map(function (c) {
            return el("div", { class: "spread small", style: { padding: "6px 0" } }, [
              el("span", { class: "muted", text: T(c.category) }),
              el("span", { text: A.money(c.total) })]);
          }))));
      }
      body.appendChild(el("button", { class: "btn btn-sm", style: { marginTop: "var(--gap)" },
        text: "⇩ " + T("Excel"), onclick: function () {
          A.xlsx(T("Profit"), [["Item", "Amount"],
            ["Revenue", p.revenue], ["Cost of goods", p.cogs], ["Gross profit", p.gross],
            ["Expenses", p.expenses], ["Net profit", p.net]], "profit");
        } }));
    }

    function drawExpenses() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const rows = A.eng.expensesBetween(r.start, r.end);
      const total = A.eng.expenseTotal(r.start, r.end);
      body.appendChild(el("div", { class: "card card-pad spread",
        style: { marginBottom: "var(--gap)" } }, [
        el("div", {}, [el("div", { class: "tiny faint", text: T("Expenses") }),
          el("strong", { style: { fontSize: "1.4rem" }, text: A.money(total) })]),
        el("div", { class: "row", style: { gap: "8px" } }, [
          el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"), onclick: function () {
            A.xlsx(T("Expenses"), [["Date", "Category", "Method", "Note", "Amount"]]
              .concat(rows.map(function (e) {
                return [e.spent_on, e.category, e.method, e.note, e.amount]; })), "expenses");
          } }),
          el("button", { class: "btn btn-sm btn-pri", text: "＋ " + T("Add expense"),
            onclick: addExpense }),
        ]),
      ]));
      const card = el("div", { class: "card" });
      if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "🧾" }), el("div", { text: T("Nothing here yet") })]));
      else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { text: T("Category") }),
          el("th", { text: T("Method") }), el("th", { class: "right", text: T("Amount") })])]));
        const tb = el("tbody");
        rows.forEach(function (e) {
          tb.appendChild(el("tr", {}, [
            el("td", { class: "nowrap", text: A.dateText(e.spent_on) }),
            el("td", {}, [el("div", { text: T(e.category) }),
              e.note ? el("div", { class: "tiny faint", text: e.note }) : null]),
            el("td", {}, [el("span", { class: "chip", text: T(e.method || "Cash") })]),
            el("td", { class: "right", style: { fontWeight: "700" }, text: A.money(e.amount) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }
      body.appendChild(card);
    }

    function addExpense() {
      const m = A.modal({ title: T("Add expense") });
      const cats = ["Shop rent", "Electricity", "Transport", "Salary", "Supplies",
                    "Repairs", "Other"];
      const cat = A.field(T("Category"), { type: "select", value: cats[0],
        options: cats.map(function (c) { return { value: c, label: T(c) }; }) });
      const amt = A.field(T("Amount"), { type: "number", inputmode: "decimal", min: 0 });
      const how = A.field(T("Paid by"), { type: "select", value: "Cash",
        options: ["Cash", "bKash", "Nagad", "Rocket", "Bank"] });
      const when = A.field(T("Date"), { type: "date", value: H.dayKey() });
      const note = A.field(T("Note"), { type: "textarea" });
      m.body.appendChild(cat);
      m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
        [el("div", { class: "grow" }, [amt]), el("div", { class: "grow" }, [how])]));
      m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [when]));
      m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [note]));
      m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
      m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
        onclick: function () {
          if (amt.num(0) <= 0) return A.toast(T("Enter an amount"), "warn");
          A.eng.addExpense(cat.val(), amt.num(0), note.val(), when.val(),
            A.user ? A.user.id : null, how.val());
          m.close(); A.toast(T("Saved"), "ok"); draw();
        } }));
    }

    function drawClose() {
      const today = H.dayKey();
      const carried = A.eng.openingCashFor(today);
      const opening = A.field(T("Opening cash"), { type: "number", inputmode: "decimal",
        value: carried || 0, min: 0,
        hint: root.isBn() ? "গতকাল যা গোনা হয়েছিল" : "what was counted last night" });
      const counted = A.field(T("Counted"), { type: "number", inputmode: "decimal", min: 0 });
      const rows = el("div");
      const diff = el("div", { class: "center", style: { fontSize: "1.15rem",
        fontWeight: "800", padding: "10px 0" } });

      function pos() { return A.eng.cashPosition(today, opening.num(0)); }
      function paint() {
        const p = pos();
        A.clear(rows);
        [["Opening cash", p.opening, 1], ["Cash sales", p.cash_sales, 1],
         ["Cash refunds", p.cash_refunds, -1], ["Cash expenses", p.cash_expenses, -1],
         ["Paid to suppliers", p.supplier_cash, -1],
         ["Old credit collected", p.due_collected, 1],
         ["Mobile banking cash", p.agent_cash, 1]].forEach(function (r) {
          rows.appendChild(el("div", { class: "spread", style: { padding: "8px 0",
            borderBottom: "1px solid var(--line)" } }, [
            el("span", { class: "muted", text: T(r[0]) }),
            el("span", { text: (r[2] < 0 && r[1] ? "−" : "") + A.money(Math.abs(r[1])) }),
          ]));
        });
        rows.appendChild(el("div", { class: "spread", style: { padding: "12px 0" } }, [
          el("strong", { style: { fontSize: "1.05rem" }, text: T("Should be in the drawer") }),
          el("strong", { style: { fontSize: "1.45rem", color: "var(--pri)" },
            text: A.money(p.expected) }),
        ]));
        const c = counted.input.value;
        if (!c) { diff.textContent = ""; return; }
        const d = Math.round((counted.num(0) - p.expected) * 100) / 100;
        if (Math.abs(d) < 0.005) {
          diff.textContent = "✓ " + T("Drawer matches exactly");
          diff.style.color = "var(--ok)";
        } else if (d > 0) {
          diff.textContent = T("Extra in drawer") + ": " + A.money(d);
          diff.style.color = "var(--warn)";
        } else {
          diff.textContent = T("Short by") + ": " + A.money(Math.abs(d));
          diff.style.color = "var(--bad)";
        }
      }
      opening.input.addEventListener("input", paint);
      counted.input.addEventListener("input", paint);

      body.appendChild(el("div", { class: "card card-pad" }, [
        el("h3", { style: { fontSize: "1.05rem", marginBottom: "10px" }, text: T("Day close") }),
        rows,
        el("div", { class: "row", style: { marginTop: "6px" } },
          [el("div", { class: "grow" }, [opening]), el("div", { class: "grow" }, [counted])]),
        diff,
        el("div", { class: "row", style: { marginTop: "8px" } }, [
          el("button", { class: "btn grow", text: "🖨 " + T("Print"), onclick: function () {
            A.printDayClose(pos(), counted.num(0));
          } }),
          el("button", { class: "btn btn-pri grow", text: "✓ " + T("Close the day"),
            onclick: function () {
              if (!counted.input.value) return A.toast(T("Counted") + ": " + T("Required"), "warn");
              const p = pos();
              const d = Math.round((counted.num(0) - p.expected) * 100) / 100;
              A.confirm(T("Close the day"), T("Difference") + ": " + A.money(d))
                .then(function (y) {
                  if (!y) return;
                  A.eng.saveDayClose(p, counted.num(0),
                    Math.abs(d) < 0.005 ? "" : (d > 0 ? "Extra" : "Short"),
                    A.user ? A.user.id : null);
                  A.toast(T("Saved"), "ok"); draw();
                });
            } }),
        ]),
      ]));
      paint();

      const past = A.eng.dayCloses(30);
      if (past.length) {
        const card = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { class: "right", text: T("Should be in the drawer") }),
          el("th", { class: "right", text: T("Counted") }),
          el("th", { class: "right", text: T("Difference") })])]));
        const tb = el("tbody");
        past.forEach(function (c) {
          tb.appendChild(el("tr", {}, [
            el("td", { class: "nowrap", text: A.dateText(c.closed_on) }),
            el("td", { class: "right muted", text: A.money(c.expected_cash) }),
            el("td", { class: "right", text: A.money(c.counted_cash) }),
            el("td", { class: "right", style: { fontWeight: "700",
              color: Math.abs(c.difference) < 0.005 ? "var(--ok)"
                   : c.difference > 0 ? "var(--warn)" : "var(--bad)" },
              text: A.money(c.difference) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
        body.appendChild(card);
      }
    }

    function drawStaff() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const rows = A.eng.salesByUser(r.start, r.end);
      const card = el("div", { class: "card" });
      if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "👤" }), el("div", { text: T("Nothing here yet") })]));
      else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Name") }), el("th", { class: "right", text: T("Orders today") }),
          el("th", { class: "right", text: T("Total") }),
          el("th", { class: "right", text: T("Discount") })])]));
        const tb = el("tbody");
        rows.forEach(function (u) {
          tb.appendChild(el("tr", {}, [
            el("td", { style: { fontWeight: "700" }, text: u.name }),
            el("td", { class: "right", text: A.qty(u.orders) }),
            el("td", { class: "right", text: A.money(u.total) }),
            el("td", { class: "right muted", text: A.money(u.discount) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }
      body.appendChild(card);
    }

    function draw() {
      A.$$(".seg button", tabs).forEach(function (b, i) {
        b.className = ["profit", "expenses", "close", "staff"][i] === tab ? "on" : "";
      });
      A.clear(body);
      ({ profit: drawProfit, expenses: drawExpenses, close: drawClose,
         staff: drawStaff })[tab]();
    }
    draw();
  });
})(window);
</script>
<script>
/* =================================================================
   Mobile banking — a bKash/Nagad point is not a shop selling goods.
   Its whole business is cash moving one way and e-money the other.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const H = root.POSEngine.helpers;
  const WALLETS = root.POSEngine.WALLETS;
  const KINDS = ["Cash In", "Cash Out", "Send Money", "Recharge", "Bill Pay", "B2B Load"];

  A.register("agent", function (page) {
    const state = { wallet: "bKash", kind: "Cash In", filter: "All", search: "" };

    // ---- balances
    const tiles = el("div", { class: "grid",
      style: { gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))",
               marginBottom: "var(--gap)" } });
    const today = H.dayKey();
    WALLETS.forEach(function (w) {
      const bal = A.eng.walletBalance(w);
      const day = A.eng.walletSummary(today, today).find(function (s) { return s.wallet === w; });
      tiles.appendChild(el("div", { class: "tile" }, [
        el("div", { class: "k", text: w }),
        el("div", { class: "v", style: { color: bal < 0 ? "var(--bad)" : "var(--pri)" },
          text: A.money(bal) }),
        el("div", { class: "s", text: T("e-money balance")
          + (day ? " · " + A.qty(day.count) + " " + T("Today")
                   + " · " + T("Your commission") + " " + A.money(day.commission) : "") }),
      ]));
    });
    page.appendChild(tiles);

    const wrap = el("div", { class: "till" });
    const form = el("div", { class: "card card-pad" });
    const book = el("div", { class: "card" });
    wrap.appendChild(form); wrap.appendChild(book);
    page.appendChild(wrap);

    // ---- new transaction
    const f = {};
    function drawForm() {
      A.clear(form);
      form.appendChild(el("h3", { style: { fontSize: "1.1rem" }, text: T("New transaction") }));
      form.appendChild(el("div", { class: "small muted", style: { marginBottom: "12px" },
        text: root.isBn() ? "ওয়ালেট আর কী হলো বাছুন, তারপর নম্বর ও টাকা"
                          : "Pick the wallet and what happened, then the number and amount" }));

      const wseg = el("div", { class: "seg", style: { width: "100%" } });
      WALLETS.forEach(function (w) {
        wseg.appendChild(el("button", { class: state.wallet === w ? "on" : "", text: w,
          onclick: function () { state.wallet = w; drawForm(); } }));
      });
      form.appendChild(wseg);

      const kgrid = el("div", { class: "grid", style: { gridTemplateColumns:
        "repeat(auto-fit,minmax(110px,1fr))", margin: "10px 0" } });
      KINDS.forEach(function (k) {
        kgrid.appendChild(el("button", {
          class: "btn btn-sm" + (state.kind === k ? " btn-pri" : ""), text: T(k),
          onclick: function () { state.kind = k; drawForm(); } }));
      });
      form.appendChild(kgrid);

      f.number = A.field(T("Customer number"), { inputmode: "tel",
        placeholder: "01XXXXXXXXX", value: f.number ? f.number.val() : "" });
      const known = el("div", { class: "tiny", style: { color: "var(--acc)", minHeight: "18px" } });
      f.number.input.addEventListener("input", function () {
        const hist = A.eng.walletCustomerHistory(f.number.val(), 3);
        known.textContent = hist.length
          ? T("Seen before") + " · " + hist.length + " · " + T(hist[0].kind)
            + " " + A.money(hist[0].amount)
          : "";
      });
      form.appendChild(f.number);
      form.appendChild(known);

      f.amount = A.field(T("Amount"), { type: "number", inputmode: "decimal", min: 0 });
      f.comm = A.field(T("Your commission"), { type: "number", inputmode: "decimal", min: 0 });
      f.charge = A.field(T("Extra charge"), { type: "number", inputmode: "decimal", min: 0 });
      form.appendChild(el("div", { class: "row", style: { marginTop: "10px", gap: "8px" } },
        [el("div", { class: "grow" }, [f.amount]), el("div", { class: "grow" }, [f.comm]),
         el("div", { class: "grow" }, [f.charge])]));

      f.trx = A.field(T("TrxID"), { placeholder: "9F4KX2LM7Q" });
      form.appendChild(el("div", { style: { marginTop: "10px" } }, [f.trx]));

      const effect = el("div", { class: "small muted", style: { minHeight: "22px",
        marginTop: "10px" } });
      function preview() {
        const signs = root.POSEngine.WALLET_KINDS[state.kind] || [0, 0];
        const amt = f.amount.num(0), ch = f.charge.num(0);
        const cash = signs[0] * amt + ch, emoney = signs[1] * amt;
        effect.textContent = T("Cash") + " " + (cash >= 0 ? "+" : "−")
          + A.money(Math.abs(cash), { bare: true }) + "   ·   " + state.wallet + " "
          + (emoney >= 0 ? "+" : "−") + A.money(Math.abs(emoney), { bare: true });
      }
      [f.amount, f.charge].forEach(function (x) {
        x.input.addEventListener("input", preview);
      });
      preview();
      form.appendChild(effect);

      const save = el("button", { class: "btn btn-pri btn-lg",
        style: { width: "100%", marginTop: "12px" }, text: "✓ " + T("Save") + "  (Enter)",
        onclick: submit });
      form.appendChild(save);
      [f.number, f.amount, f.comm, f.charge, f.trx].forEach(function (x) {
        x.input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submit();
        });
      });
    }

    function submit() {
      const amt = f.amount.num(0);
      if (amt <= 0) { A.toast(T("Enter an amount"), "warn"); return f.amount.input.focus(); }
      A.eng.addWalletTxn({ wallet: state.wallet, kind: state.kind, amount: amt,
        customer_number: f.number.val().replace(/\D/g, ""),
        commission: f.comm.num(0), charge: f.charge.num(0),
        trx_id: f.trx.val(), user_id: A.user ? A.user.id : null });
      A.toast(T("Saved"), "ok");
      A.refresh();
    }
    drawForm();

    // ---- today's book
    function drawBook() {
      A.clear(book);
      const head = el("div", { class: "card-pad",
        style: { borderBottom: "1px solid var(--line)" } });
      head.appendChild(el("div", { class: "spread", style: { marginBottom: "8px" } }, [
        el("h3", { style: { fontSize: "1.05rem" }, text: T("Today's book") }),
        el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"), onclick: function () {
          const rows = A.eng.walletTxns(today, today, state.filter, state.search, 100000);
          A.xlsx(T("Mobile banking"), [["Time", "Wallet", "Type", "Number", "Amount",
            "Commission", "Charge", "Cash effect", "e-money effect", "TrxID"]]
            .concat(rows.map(function (w) {
              return [String(w.created_at).slice(11, 16), w.wallet, w.kind,
                w.customer_number, w.amount, w.commission, w.charge,
                w.cash_delta, w.ewallet_delta, w.trx_id]; })), "mobile-banking");
        } }),
      ]));
      const search = A.field("", { placeholder: "🔍 " + T("Search"), value: state.search, wide: true });
      search.input.addEventListener("input", function () {
        state.search = search.val(); drawBook();
      });
      const fseg = el("div", { class: "seg" });
      ["All"].concat(WALLETS).forEach(function (w) {
        fseg.appendChild(el("button", { class: state.filter === w ? "on" : "",
          text: w === "All" ? T("All") : w,
          onclick: function () { state.filter = w; drawBook(); } }));
      });
      head.appendChild(el("div", { class: "row", style: { gap: "8px" } }, [search, fseg]));
      book.appendChild(head);

      const rows = A.eng.walletTxns(today, today, state.filter, state.search, 200);
      if (!rows.length) {
        book.appendChild(el("div", { class: "empty" }, [
          el("div", { class: "big", text: "📱" }),
          el("div", { text: T("Nothing here yet") })]));
      } else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { text: T("Method") }),
          el("th", { text: T("Phone") }), el("th", { class: "right", text: T("Amount") }),
          el("th", { class: "right", text: "" })])]));
        const tb = el("tbody");
        rows.forEach(function (w) {
          const dead = w.status !== "ok";
          tb.appendChild(el("tr", { style: dead ? { opacity: ".45",
            textDecoration: "line-through" } : null }, [
            el("td", { class: "nowrap tiny muted", text: A.timeText(w.created_at) }),
            el("td", {}, [el("div", { style: { fontWeight: "700" }, text: T(w.kind) }),
              el("div", { class: "tiny faint", text: w.wallet })]),
            el("td", { class: "nowrap tiny", text: w.customer_number || "—" }),
            el("td", { class: "right" }, [
              el("div", { style: { fontWeight: "700" }, text: A.money(w.amount) }),
              w.commission ? el("div", { class: "tiny faint",
                text: "+" + A.money(w.commission) }) : null]),
            el("td", { class: "right" }, [dead ? null :
              el("button", { class: "btn btn-sm", text: "✕", title: T("Void"),
                onclick: function () {
                  A.confirm(T("Void"), T("This cannot be undone."), { danger: true })
                    .then(function (y) { if (y) { A.eng.voidWalletTxn(w.id);
                      A.toast(T("Void") + " ✓", "ok"); A.refresh(); } });
                } })]),
          ]));
        });
        tbl.appendChild(tb);
        book.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }

      const sum = A.eng.walletSummary(today, today);
      const tot = sum.reduce(function (t, s) {
        t.volume += s.volume; t.commission += s.commission; t.cash += s.cash_delta; return t;
      }, { volume: 0, commission: 0, cash: 0 });
      book.appendChild(el("div", { class: "card-pad row small",
        style: { borderTop: "1px solid var(--line)", gap: "18px", flexWrap: "wrap" } }, [
        el("span", {}, [el("span", { class: "muted", text: T("Total") + ": " }),
          el("strong", { text: A.money(tot.volume) })]),
        el("span", {}, [el("span", { class: "muted", text: T("Your commission") + ": " }),
          el("strong", { style: { color: "var(--ok)" }, text: A.money(tot.commission) })]),
        el("span", {}, [el("span", { class: "muted", text: T("Cash") + ": " }),
          el("strong", { text: (tot.cash >= 0 ? "+" : "−") + A.money(Math.abs(tot.cash)) })]),
      ]));
    }
    drawBook();
  });
})(window);
</script>
<script>
/* =================================================================
   Barcode labels — a printable sheet the shop can stick on shelves.

   Code 39 is drawn as an inline SVG rather than fetched as a font,
   because nothing may be downloaded: the whole app has to work with
   the phone in flight mode.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  //  Code 39: each character is nine bars, three of them wide.
  const C39 = {
    "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw",
    "5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
    "A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn",
    "F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
    "K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn",
    "P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
    "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn",
    "Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn",
  };

  function barcode(code, height) {
    const text = "*" + String(code).toUpperCase().replace(/[^0-9A-Z\-\. ]/g, "") + "*";
    const narrow = 1.6, wide = narrow * 2.6, gap = narrow;
    let x = 0;
    const bars = [];
    for (let i = 0; i < text.length; i++) {
      const pattern = C39[text.charAt(i)];
      if (!pattern) continue;
      for (let b = 0; b < 9; b++) {
        const w = pattern.charAt(b) === "w" ? wide : narrow;
        if (b % 2 === 0) bars.push({ x: x, w: w });   // even index = dark bar
        x += w;
      }
      x += gap;
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + Math.ceil(x) + " " + height);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", height);
    svg.setAttribute("preserveAspectRatio", "none");
    bars.forEach(function (b) {
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", 0);
      r.setAttribute("width", b.w); r.setAttribute("height", height);
      r.setAttribute("fill", "#000");
      svg.appendChild(r);
    });
    return svg;
  }

  A.labels = function () {
    const all = A.eng.products();
    if (!all.length) return A.toast(T("Nothing here yet"), "warn");
    const m = A.modal({ title: T("Labels") });
    const picked = {};
    const perCol = A.field(root.isBn() ? "এক সারিতে কয়টা" : "Per row",
      { type: "select", value: "3", options: ["2", "3", "4"] });
    const copies = A.field(root.isBn() ? "প্রতিটির কয় কপি" : "Copies each",
      { type: "number", value: "1", min: 1 });
    m.body.appendChild(el("div", { class: "row" },
      [el("div", { class: "grow" }, [perCol]), el("div", { class: "grow" }, [copies])]));
    const list = el("div", { class: "stack", style: { gap: "4px", marginTop: "12px",
      maxHeight: "40vh", overflowY: "auto" } });
    all.forEach(function (p) {
      const cb = el("input", { type: "checkbox", checked: true });
      picked[p.id] = cb;
      list.appendChild(el("label", { class: "row", style: { gap: "10px",
        padding: "6px 0", cursor: "pointer" } }, [
        cb, el("span", { class: "grow", text: p.name }),
        el("span", { class: "tiny faint", text: p.barcode || p.sku || "—" })]));
    });
    m.body.appendChild(list);
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: "🖨 " + T("Print"),
      onclick: function () {
        const chosen = all.filter(function (p) { return picked[p.id].checked; });
        if (!chosen.length) return A.toast(T("None"), "warn");
        m.close();
        sheet(chosen, parseInt(perCol.val(), 10) || 3,
              Math.max(parseInt(copies.val(), 10) || 1, 1));
      } }));
  };

  function sheet(products, cols, copies) {
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'
      + '@page{size:A4;margin:8mm}'
      + 'body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif}'
      + '.g{display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:4mm}'
      + '.l{border:1px dashed #bbb;border-radius:3mm;padding:3mm;text-align:center;'
      + 'break-inside:avoid;page-break-inside:avoid}'
      + '.n{font-size:10pt;font-weight:700;line-height:1.2;height:2.6em;overflow:hidden}'
      + '.p{font-size:13pt;font-weight:800;margin-top:1mm}'
      + '.c{font-size:7pt;letter-spacing:.08em;margin-top:.5mm;color:#333}'
      + '</style></head><body><div class="g" id="g"></div></body></html>');
    doc.close();
    const g = doc.getElementById("g");
    const sym = A.symAscii();
    products.forEach(function (p) {
      for (let i = 0; i < copies; i++) {
        const code = p.barcode || p.sku || "";
        const cell = doc.createElement("div");
        cell.className = "l";
        const n = doc.createElement("div"); n.className = "n"; n.textContent = p.name;
        cell.appendChild(n);
        if (code) {
          const holder = doc.createElement("div");
          holder.style.cssText = "height:12mm;margin-top:1mm";
          holder.appendChild(doc.importNode(barcode(code, 40), true));
          cell.appendChild(holder);
          const c = doc.createElement("div"); c.className = "c";
          c.textContent = String(code).toUpperCase(); cell.appendChild(c);
        }
        const price = doc.createElement("div"); price.className = "p";
        price.textContent = sym + " " + (Number(p.sale_price) || 0).toFixed(2);
        cell.appendChild(price);
        g.appendChild(cell);
      }
    });
    setTimeout(function () {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) {}
      setTimeout(function () { frame.remove(); }, 1500);
    }, 200);
  }
})(window);
</script>
