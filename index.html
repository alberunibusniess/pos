        el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"), onclick: function () {
          const out = [["Invoice", "Date", "Time", "Customer", "Phone", "Kind",
            "Subtotal", "Discount", "Tax", "Delivery", "Total", "Cash", "Mobile",
            "Method", "TrxID", "Change", "Due", "Status"]];
          sales.forEach(function (s) {
            out.push([s.invoice_no, String(s.created_at).slice(0, 10),
              String(s.created_at).slice(11, 16), s.customer_name, s.customer_phone,
              s.kind, s.subtotal, s.discount_amt, s.tax_amt, s.delivery_charge,
              s.grand_total, s.paid_cash, s.paid_mobile, s.payment_method,
              s.trx_id || "", s.change_due, s.due, s.status]);
          });
          A.xlsx(T("Invoice"), out, "bills-" + mode);
        } }),
      ]));
      const tbl2 = el("table", { class: "tbl" });
      tbl2.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { text: T("Invoice") }), el("th", { text: T("Date") }),
        el("th", { text: T("Name") }), el("th", { text: T("Method") }),
        el("th", { class: "right", text: T("Total") }),
        el("th", { class: "right", text: "" })])]));
      const tb2 = el("tbody");
      sales.slice(0, 120).forEach(function (s) {
        tb2.appendChild(el("tr", {}, [
          el("td", { class: "nowrap", style: { fontWeight: "700" } }, [
            el("span", { text: s.invoice_no }),
            s.kind === "return" ? el("span", { class: "chip chip-warn",
              style: { marginLeft: "6px" }, text: T("Return") }) : null]),
          el("td", { class: "nowrap tiny muted",
            text: A.dateText(s.created_at) + " " + A.timeText(s.created_at) }),
          el("td", { text: s.customer_name || T("Walk-in") }),
          el("td", { class: "tiny muted", text: T(s.payment_method || "Cash") }),
          el("td", { class: "right", style: { fontWeight: "700" },
            text: A.money(s.grand_total) }),
          el("td", { class: "right nowrap" }, [
            el("button", { class: "btn btn-sm", text: "👁",
              onclick: function () { A.showSale(s); } })]),
        ]));
      });
      tbl2.appendChild(tb2);
      list.appendChild(el("div", { class: "scroll-x" }, [tbl2]));
      body.appendChild(list);
    }
    draw();
  });

  /** One bill, reopened — reprint it, send it, or cancel it. */
  A.showSale = function (s) {
    const items = A.eng.saleItems(s.id);
    const m = A.modal({ title: s.invoice_no });
    m.body.appendChild(el("div", { class: "slip",
      text: A.receiptText(s, items) }));
    m.footer.appendChild(el("button", { class: "btn", text: "🖨 " + T("Print"),
      onclick: function () { A.printReceipt(s, items); } }));
    if (s.customer_phone) {
      m.footer.appendChild(el("button", { class: "btn btn-ok",
        text: "🟢 WhatsApp", onclick: function () { A.shareReceipt(s, items); } }));
    }
    if (s.status === "completed") {
      m.footer.appendChild(el("button", { class: "btn btn-bad", text: T("Void"),
        onclick: function () {
          A.confirm(T("Void") + " " + s.invoice_no, root.isBn()
            ? "মাল স্টকে ফিরে যাবে, বাকি থাকলে সেটাও বাদ যাবে।"
            : "Stock goes back and any due is removed.", { danger: true })
            .then(function (y) {
              if (!y) return;
              A.eng.voidSale(s.id); m.close();
              A.toast(T("Void") + " ✓", "ok"); A.refresh();
            });
        } }));
    }
  };
})(window);
</script>
<script>
/* =================================================================
   Profit, expenses, the day close, and the staff list.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const H = root.POSEngine.helpers;

  function ranges() {
    const d = new Date();
    const today = H.dayKey();
    return {
      today: { start: today, end: today, label: T("Today") },
      month: { start: H.dayKey(new Date(d.getFullYear(), d.getMonth(), 1)),
               end: today, label: T("This month") },
      d30: { start: H.dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 29)),
             end: today, label: T("Last 30 days") },
      year: { start: d.getFullYear() + "-01-01", end: today, label: T("This year") },
    };
  }

  A.register("money", function (page) {
    let tab = (A.params && A.params.tab) || "profit";
    let rangeKey = "month";

    const tabs = el("div", { class: "seg", style: { marginBottom: "var(--gap)" } });
    [["profit", "Profit"], ["expenses", "Expenses"], ["close", "Day close"],
     ["staff", "Staff"]].forEach(function (t) {
      tabs.appendChild(el("button", { class: tab === t[0] ? "on" : "", text: T(t[1]),
        onclick: function () { tab = t[0]; draw(); } }));
    });
    page.appendChild(tabs);
    const body = el("div");
    page.appendChild(body);

    function rangePicker(onPick) {
      const r = ranges();
      const seg = el("div", { class: "seg", style: { marginBottom: "var(--gap)" } });
      Object.keys(r).forEach(function (k) {
        seg.appendChild(el("button", { class: rangeKey === k ? "on" : "", text: r[k].label,
          onclick: function () { rangeKey = k; onPick(); } }));
      });
      return seg;
    }

    function drawProfit() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const p = A.eng.profitBetween(r.start, r.end);
      const line = function (k, v, tone, big) {
        return el("div", { class: "spread", style: { padding: "10px 0",
          borderBottom: "1px solid var(--line)" } }, [
          el("span", { class: big ? "" : "muted",
            style: big ? { fontWeight: "800", fontSize: "1.05rem" } : null, text: T(k) }),
          el("strong", { style: { fontSize: big ? "1.35rem" : "1rem",
            color: tone ? "var(--" + tone + ")" : null }, text: v }),
        ]);
      };
      body.appendChild(el("div", { class: "card card-pad" }, [
        el("h3", { style: { fontSize: "1.05rem", marginBottom: "6px" },
          text: root.isBn() ? "আসলে কত থাকল" : "What is actually left" }),
        el("div", { class: "small muted", style: { marginBottom: "10px" },
          text: root.isBn() ? "বিক্রয়, বাদ পণ্যের খরচ, বাদ দোকানের খরচ"
                            : "Sales, minus what the goods cost, minus shop expenses" }),
        line("Revenue", A.money(p.revenue)),
        line("Cost of goods", "−" + A.money(p.cogs)),
        line("Gross profit", A.money(p.gross), "ok"),
        line("Expenses", "−" + A.money(p.expenses)),
        line("Net profit", A.money(p.net), p.net >= 0 ? "ok" : "bad", true),
      ]));
      if (p.lines_without_cost) {
        body.appendChild(el("div", { class: "card card-pad small",
          style: { marginTop: "var(--gap)", borderColor: "var(--warn)" },
          text: root.isBn()
            ? p.lines_without_cost + " টি লাইনে ক্রয়মূল্য নেই, তাই লাভের হিসাব ওইটুকু বেশি দেখাচ্ছে। পণ্যে ক্রয়মূল্য বসালে ঠিক হয়ে যাবে।"
            : p.lines_without_cost + " lines have no cost price, so profit reads high." }));
      }
      const byCat = A.eng.expenseByCategory(r.start, r.end);
      if (byCat.length) {
        body.appendChild(el("div", { class: "card card-pad", style: { marginTop: "var(--gap)" } },
          [el("h3", { style: { fontSize: "1rem", marginBottom: "10px" }, text: T("Expenses") })]
          .concat(byCat.map(function (c) {
            return el("div", { class: "spread small", style: { padding: "6px 0" } }, [
              el("span", { class: "muted", text: T(c.category) }),
              el("span", { text: A.money(c.total) })]);
          }))));
      }
      body.appendChild(el("button", { class: "btn btn-sm", style: { marginTop: "var(--gap)" },
        text: "⇩ " + T("Excel"), onclick: function () {
          A.xlsx(T("Profit"), [["Item", "Amount"],
            ["Revenue", p.revenue], ["Cost of goods", p.cogs], ["Gross profit", p.gross],
            ["Expenses", p.expenses], ["Net profit", p.net]], "profit");
        } }));
    }

    function drawExpenses() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const rows = A.eng.expensesBetween(r.start, r.end);
      const total = A.eng.expenseTotal(r.start, r.end);
      body.appendChild(el("div", { class: "card card-pad spread",
        style: { marginBottom: "var(--gap)" } }, [
        el("div", {}, [el("div", { class: "tiny faint", text: T("Expenses") }),
          el("strong", { style: { fontSize: "1.4rem" }, text: A.money(total) })]),
        el("div", { class: "row", style: { gap: "8px" } }, [
          el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"), onclick: function () {
            A.xlsx(T("Expenses"), [["Date", "Category", "Method", "Note", "Amount"]]
              .concat(rows.map(function (e) {
                return [e.spent_on, e.category, e.method, e.note, e.amount]; })), "expenses");
          } }),
          el("button", { class: "btn btn-sm btn-pri", text: "＋ " + T("Add expense"),
            onclick: addExpense }),
        ]),
      ]));
      const card = el("div", { class: "card" });
      if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "🧾" }), el("div", { text: T("Nothing here yet") })]));
      else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { text: T("Category") }),
          el("th", { text: T("Method") }), el("th", { class: "right", text: T("Amount") })])]));
        const tb = el("tbody");
        rows.forEach(function (e) {
          tb.appendChild(el("tr", {}, [
            el("td", { class: "nowrap", text: A.dateText(e.spent_on) }),
            el("td", {}, [el("div", { text: T(e.category) }),
              e.note ? el("div", { class: "tiny faint", text: e.note }) : null]),
            el("td", {}, [el("span", { class: "chip", text: T(e.method || "Cash") })]),
            el("td", { class: "right", style: { fontWeight: "700" }, text: A.money(e.amount) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }
      body.appendChild(card);
    }

    function addExpense() {
      const m = A.modal({ title: T("Add expense") });
      const cats = ["Shop rent", "Electricity", "Transport", "Salary", "Supplies",
                    "Repairs", "Other"];
      const cat = A.field(T("Category"), { type: "select", value: cats[0],
        options: cats.map(function (c) { return { value: c, label: T(c) }; }) });
      const amt = A.field(T("Amount"), { type: "number", inputmode: "decimal", min: 0 });
      const how = A.field(T("Paid by"), { type: "select", value: "Cash",
        options: ["Cash", "bKash", "Nagad", "Rocket", "Bank"] });
      const when = A.field(T("Date"), { type: "date", value: H.dayKey() });
      const note = A.field(T("Note"), { type: "textarea" });
      m.body.appendChild(cat);
      m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
        [el("div", { class: "grow" }, [amt]), el("div", { class: "grow" }, [how])]));
      m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [when]));
      m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [note]));
      m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
      m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
        onclick: function () {
          if (amt.num(0) <= 0) return A.toast(T("Enter an amount"), "warn");
          A.eng.addExpense(cat.val(), amt.num(0), note.val(), when.val(),
            A.user ? A.user.id : null, how.val());
          m.close(); A.toast(T("Saved"), "ok"); draw();
        } }));
    }

    function drawClose() {
      const today = H.dayKey();
      const carried = A.eng.openingCashFor(today);
      const opening = A.field(T("Opening cash"), { type: "number", inputmode: "decimal",
        value: carried || 0, min: 0,
        hint: root.isBn() ? "গতকাল যা গোনা হয়েছিল" : "what was counted last night" });
      const counted = A.field(T("Counted"), { type: "number", inputmode: "decimal", min: 0 });
      const rows = el("div");
      const diff = el("div", { class: "center", style: { fontSize: "1.15rem",
        fontWeight: "800", padding: "10px 0" } });

      function pos() { return A.eng.cashPosition(today, opening.num(0)); }
      function paint() {
        const p = pos();
        A.clear(rows);
        [["Opening cash", p.opening, 1], ["Cash sales", p.cash_sales, 1],
         ["Cash refunds", p.cash_refunds, -1], ["Cash expenses", p.cash_expenses, -1],
         ["Paid to suppliers", p.supplier_cash, -1],
         ["Old credit collected", p.due_collected, 1],
         ["Mobile banking cash", p.agent_cash, 1]].forEach(function (r) {
          rows.appendChild(el("div", { class: "spread", style: { padding: "8px 0",
            borderBottom: "1px solid var(--line)" } }, [
            el("span", { class: "muted", text: T(r[0]) }),
            el("span", { text: (r[2] < 0 && r[1] ? "−" : "") + A.money(Math.abs(r[1])) }),
          ]));
        });
        rows.appendChild(el("div", { class: "spread", style: { padding: "12px 0" } }, [
          el("strong", { style: { fontSize: "1.05rem" }, text: T("Should be in the drawer") }),
          el("strong", { style: { fontSize: "1.45rem", color: "var(--pri)" },
            text: A.money(p.expected) }),
        ]));
        const c = counted.input.value;
        if (!c) { diff.textContent = ""; return; }
        const d = Math.round((counted.num(0) - p.expected) * 100) / 100;
        if (Math.abs(d) < 0.005) {
          diff.textContent = "✓ " + T("Drawer matches exactly");
          diff.style.color = "var(--ok)";
        } else if (d > 0) {
          diff.textContent = T("Extra in drawer") + ": " + A.money(d);
          diff.style.color = "var(--warn)";
        } else {
          diff.textContent = T("Short by") + ": " + A.money(Math.abs(d));
          diff.style.color = "var(--bad)";
        }
      }
      opening.input.addEventListener("input", paint);
      counted.input.addEventListener("input", paint);

      body.appendChild(el("div", { class: "card card-pad" }, [
        el("h3", { style: { fontSize: "1.05rem", marginBottom: "10px" }, text: T("Day close") }),
        rows,
        el("div", { class: "row", style: { marginTop: "6px" } },
          [el("div", { class: "grow" }, [opening]), el("div", { class: "grow" }, [counted])]),
        diff,
        el("div", { class: "row", style: { marginTop: "8px" } }, [
          el("button", { class: "btn grow", text: "🖨 " + T("Print"), onclick: function () {
            A.printDayClose(pos(), counted.num(0));
          } }),
          el("button", { class: "btn btn-pri grow", text: "✓ " + T("Close the day"),
            onclick: function () {
              if (!counted.input.value) return A.toast(T("Counted") + ": " + T("Required"), "warn");
              const p = pos();
              const d = Math.round((counted.num(0) - p.expected) * 100) / 100;
              A.confirm(T("Close the day"), T("Difference") + ": " + A.money(d))
                .then(function (y) {
                  if (!y) return;
                  A.eng.saveDayClose(p, counted.num(0),
                    Math.abs(d) < 0.005 ? "" : (d > 0 ? "Extra" : "Short"),
                    A.user ? A.user.id : null);
                  A.toast(T("Saved"), "ok"); draw();
                });
            } }),
        ]),
      ]));
      paint();

      const past = A.eng.dayCloses(30);
      if (past.length) {
        const card = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Date") }), el("th", { class: "right", text: T("Should be in the drawer") }),
          el("th", { class: "right", text: T("Counted") }),
          el("th", { class: "right", text: T("Difference") })])]));
        const tb = el("tbody");
        past.forEach(function (c) {
          tb.appendChild(el("tr", {}, [
            el("td", { class: "nowrap", text: A.dateText(c.closed_on) }),
            el("td", { class: "right muted", text: A.money(c.expected_cash) }),
            el("td", { class: "right", text: A.money(c.counted_cash) }),
            el("td", { class: "right", style: { fontWeight: "700",
              color: Math.abs(c.difference) < 0.005 ? "var(--ok)"
                   : c.difference > 0 ? "var(--warn)" : "var(--bad)" },
              text: A.money(c.difference) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
        body.appendChild(card);
      }
    }

    function drawStaff() {
      const r = ranges()[rangeKey];
      body.appendChild(rangePicker(draw));
      const rows = A.eng.salesByUser(r.start, r.end);
      const card = el("div", { class: "card" });
      if (!rows.length) card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "👤" }), el("div", { text: T("Nothing here yet") })]));
      else {
        const tbl = el("table", { class: "tbl" });
        tbl.appendChild(el("thead", {}, [el("tr", {}, [
          el("th", { text: T("Name") }), el("th", { class: "right", text: T("Orders today") }),
          el("th", { class: "right", text: T("Total") }),
          el("th", { class: "right", text: T("Discount") })])]));
        const tb = el("tbody");
        rows.forEach(function (u) {
          tb.appendChild(el("tr", {}, [
            el("td", { style: { fontWeight: "700" }, text: u.name }),
            el("td", { class: "right", text: A.qty(u.orders) }),
            el("td", { class: "right", text: A.money(u.total) }),
            el("td", { class: "right muted", text: A.money(u.discount) }),
          ]));
        });
        tbl.appendChild(tb);
        card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
      }
      body.appendChild(card);
    }

    function draw() {
      A.$$(".seg button", tabs).forEach(function (b, i) {
        b.className = ["profit", "expenses", "close", "staff"][i] === tab ? "on" : "";
      });
      A.clear(body);
      ({ profit: drawProfit, expenses: drawExpenses, close: drawClose,
         staff: drawStaff })[tab]();
    }
    draw();
  });
})(window);
</script>
<script>
/* =================================================================
   Mobile banking — a bKash/Nagad point is not a shop selling goods.
   Its whole business is cash moving one way and e-money the other.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const H = root.POSEngine.helpers;
  const WALLETS = root.POSEngine.WALLETS;
  const KINDS = ["Cash In", "Cash Out", "Send Money", "Recharge", "Bill Pay", "B2B Load"];

  A.register("agent", function (page) {
    const state = { wallet: "bKash", kind: "Cash In", filter: "All", search: "" };

    // ---- balances
    const tiles = el("div", { class: "grid",
      style: { gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))",
               marginBottom: "var(--gap)" } });
    const today = H.dayKey();
    WALLETS.forEach(function (w) {
      const bal = A.eng.walletBalance(w);
      const day = A.eng.walletSummary(today, today).find(function (s) { return s.wallet === w; });
      tiles.appendChild(el("div", { class: "tile" }, [
        el("div", { class: "k", text: w }),
        el("div", { class: "v", style: { color: bal < 0 ? "var(--bad)" : "var(--pri)" },
          text: A.money(bal) }),
        el("div", { class: "s", text: T("e-money balance")
          + (day ? " · " + A.qty(day.count) + " " + T("Today")
                   + " · " + T("Your commission") + " " + A.money(day.commission) : "") }),
      ]));
    });
    page.appendChild(tiles);

    const wrap = el("div", { class: "till" });
    const form = el("div", { class: "card card-pad" });
    const book = el("div", { class: "card" });
    wrap.appendChild(form); wrap.appendChild(book);
    page.appendChild(wrap);

    // ---- new transaction
    const f = {};
    function drawForm() {
      A.clear(form);
      form.appendChild(el("h3", { style: { fontSize: "1.1rem" }, text: T("New transaction") }));
      form.appendChild(el("div", { class: "small muted", style: { marginBottom: "12px" },
        text: root.isBn() ? "ওয়ালেট আর কী হলো বাছুন, তারপর নম্বর ও টাকা"
                          : "Pick the wallet and what happened, then the number and amount" }));

      const wseg = el("div", { class: "seg", style: { width: "100%" } });
      WALLETS.forEach(function (w) {
        wseg.appendChild(el("button", { class: state.wallet === w ? "on" : "", text: w,
          onclick: function () { state.wallet = w; drawForm(); } }));
      });
      form.appendChild(wseg);

      const kgrid = el("div", { class: "grid", style: { gridTemplateColumns:
        "repeat(auto-fit,minmax(110px,1fr))", margin: "10px 0" } });
      KINDS.forEach(function (k) {
        kgrid.appendChild(el("button", {
          class: "btn btn-sm" + (state.kind === k ? " btn-pri" : ""), text: T(k),
          onclick: function () { state.kind = k; drawForm(); } }));
      });
      form.appendChild(kgrid);

      f.number = A.field(T("Customer number"), { inputmode: "tel",
        placeholder: "01XXXXXXXXX", value: f.number ? f.number.val() : "" });
      const known = el("div", { class: "tiny", style: { color: "var(--acc)", minHeight: "18px" } });
      f.number.input.addEventListener("input", function () {
        const hist = A.eng.walletCustomerHistory(f.number.val(), 3);
        known.textContent = hist.length
          ? T("Seen before") + " · " + hist.length + " · " + T(hist[0].kind)
            + " " + A.money(hist[0].amount)
          : "";
      });
      form.appendChild(f.number);
      form.appendChild(known);

      f.amount = A.field(T("Amount"), { type: "number", inputmode: "decimal", min: 0 });
      f.comm = A.field(T("Your commission"), { type: "number", inputmode: "decimal", min: 0 });
      f.charge = A.field(T("Extra charge"), { type: "number", inputmode: "decimal", min: 0 });
      form.appendChild(el("div", { class: "row", style: { marginTop: "10px", gap: "8px" } },
        [el("div", { class: "grow" }, [f.amount]), el("div", { class: "grow" }, [f.comm]),
         el("div", { class: "grow" }, [f.charge])]));

      f.trx = A.field(T("TrxID"), { placeholder: "9F4KX2LM7Q" });
      form.appendChild(el("div", { style: { marginTop: "10px" } }, [f.trx]));

      const effect = el("div", { class: "small muted", style: { minHeight: "22px",
        marginTop: "10px" } });
      function preview() {
        const signs = root.POSEngine.WALLET_KINDS[state.kind] || [0, 0];
        const amt = f.amount.num(0), ch = f.charge.num(0);
        const cash = signs[0] * amt + ch, emoney = signs[1] * amt;
        effect.textContent = T("Cash") + " " + (cash >= 0 ? "+" : "−")
          + A.money(Math.abs(cash), { bare: true }) + "   ·   " + state.wallet + " "
          + (emoney >= 0 ? "+" : "−") + A.money(Math.abs(emoney), { bare: true });
      }
      [f.amount, f.charge].forEach(function (x) {
        x.input.addEventListener("input", preview);
      });
      preview();
      form.appendChild(effect);

      const save = el("button", { class: "btn btn-pri btn-lg",
        style: { width: "100%", marginTop: "12px" }, text: "✓ " + T("Save") + "  (Enter)",
        onclick: submit });
      form.appendChild(save);
      [f.number, f.amount, f.comm, f.charge, f.trx].forEach(function (x) {
        x.input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submit();
        });
      });
    }

    function submit() {
      const amt = f.amount.num(0);
      if (amt <= 0) { A.toast(T("Enter an amount"), "warn"); return f.amount.input.focus(); }
      A.eng.addWalletTxn({ wallet: state.wallet, kind: state.kind, amount: amt,
        customer_number: f.number.val().replace(/\D/g, ""),
        commission: f.comm.num(0), charge: f.charge.num(0),
        trx_id: f.trx.val(), user_id: A.user ? A.user.id : null });
      A.toast(T("Saved"), "ok");
      A.refresh();
    }
    drawForm();

    // ---- today's book
    function drawBook() {
      A.clear(book);
      const head = el("div", { class: "card-pad",
        style: { borderBottom: "1px solid var(--line)" } });

      const sum = A.eng.walletSummary(today, today);

        el("span", {}, [el("span", { class: "muted", text: T("Cash") + ": " }),
          el("strong", { text: (tot.cash >= 0 ? "+" : "−") + A.money(Math.abs(tot.cash)) })]),

    }
    drawBook();
  });

<script>
/* =================================================================
   Barcode labels — a printable sheet the shop can stick on shelves.

   Code 39 is drawn as an inline SVG rather than fetched as a font,
   because nothing may be downloaded: the whole app has to work with
   the phone in flight mode.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  //  Code 39: each character is nine bars, three of them wide.
  const C39 = {
    "0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw",
    "5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
    "A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn",
    "F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
    "K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn",
    "P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
    "U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn",
    "Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn",
  };

  function barcode(code, height) {
    const text = "*" + String(code).toUpperCase().replace(/[^0-9A-Z\-\. ]/g, "") + "*";
    const narrow = 1.6, wide = narrow * 2.6, gap = narrow;
    let x = 0;
    const bars = [];
    for (let i = 0; i < text.length; i++) {
      const pattern = C39[text.charAt(i)];
      if (!pattern) continue;
      for (let b = 0; b < 9; b++) {
        const w = pattern.charAt(b) === "w" ? wide : narrow;
        if (b % 2 === 0) bars.push({ x: x, w: w });   // even index = dark bar
        x += w;
      }
      x += gap;
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + Math.ceil(x) + " " + height);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", height);
    svg.setAttribute("preserveAspectRatio", "none");
    bars.forEach(function (b) {
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", 0);
      r.setAttribute("width", b.w); r.setAttribute("height", height);
      r.setAttribute("fill", "#000");
      svg.appendChild(r);
    });
    return svg;
  }

  A.labels = function () {
    const all = A.eng.products();
    if (!all.length) return A.toast(T("Nothing here yet"), "warn");
    const m = A.modal({ title: T("Labels") });
    const picked = {};
    const perCol = A.field(root.isBn() ? "এক সারিতে কয়টা" : "Per row",
      { type: "select", value: "3", options: ["2", "3", "4"] });
    const copies = A.field(root.isBn() ? "প্রতিটির কয় কপি" : "Copies each",
      { type: "number", value: "1", min: 1 });
    m.body.appendChild(el("div", { class: "row" },
      [el("div", { class: "grow" }, [perCol]), el("div", { class: "grow" }, [copies])]));
    const list = el("div", { class: "stack", style: { gap: "4px", marginTop: "12px",
      maxHeight: "40vh", overflowY: "auto" } });
    all.forEach(function (p) {
      const cb = el("input", { type: "checkbox", checked: true });
      picked[p.id] = cb;
      list.appendChild(el("label", { class: "row", style: { gap: "10px",
        padding: "6px 0", cursor: "pointer" } }, [
        cb, el("span", { class: "grow", text: p.name }),
        el("span", { class: "tiny faint", text: p.barcode || p.sku || "—" })]));
    });
    m.body.appendChild(list);
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: "🖨 " + T("Print"),
      onclick: function () {
        const chosen = all.filter(function (p) { return picked[p.id].checked; });
        if (!chosen.length) return A.toast(T("None"), "warn");
        m.close();
        sheet(chosen, parseInt(perCol.val(), 10) || 3,
              Math.max(parseInt(copies.val(), 10) || 1, 1));
      } }));
  };

  function sheet(products, cols, copies) {
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'
      + '@page{size:A4;margin:8mm}'
      + 'body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif}'
      + '.g{display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:4mm}'
      + '.l{border:1px dashed #bbb;border-radius:3mm;padding:3mm;text-align:center;'
      + 'break-inside:avoid;page-break-inside:avoid}'
      + '.n{font-size:10pt;font-weight:700;line-height:1.2;height:2.6em;overflow:hidden}'
      + '.p{font-size:13pt;font-weight:800;margin-top:1mm}'
      + '.c{font-size:7pt;letter-spacing:.08em;margin-top:.5mm;color:#333}'
      + '</style></head><body><div class="g" id="g"></div></body></html>');
    doc.close();
    const g = doc.getElementById("g");
    const sym = A.symAscii();
    products.forEach(function (p) {
      for (let i = 0; i < copies; i++) {
        const code = p.barcode || p.sku || "";
        const cell = doc.createElement("div");
        cell.className = "l";
        const n = doc.createElement("div"); n.className = "n"; n.textContent = p.name;
        cell.appendChild(n);
        if (code) {
          const holder = doc.createElement("div");
          holder.style.cssText = "height:12mm;margin-top:1mm";
          holder.appendChild(doc.importNode(barcode(code, 40), true));
          cell.appendChild(holder);
          const c = doc.createElement("div"); c.className = "c";
          c.textContent = String(code).toUpperCase(); cell.appendChild(c);
        }
        const price = doc.createElement("div"); price.className = "p";
        price.textContent = sym + " " + (Number(p.sale_price) || 0).toFixed(2);
        cell.appendChild(price);
        g.appendChild(cell);
      }
    });
    setTimeout(function () {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) {}
      setTimeout(function () { frame.remove(); }, 1500);
    }, 200);
  }
})(window);
</script>
<script>
/* =================================================================
   Settings — shop details, look, receipt, targets, shops, backup.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const S = root.POSStore;

  function group(title, kids) {
    return el("div", { class: "card card-pad stack", style: { marginBottom: "var(--gap)" } },
      [el("h3", { style: { fontSize: "1.05rem" }, text: T(title) })].concat(kids));
  }
  function segRow(label, options, current, onPick) {
    const seg = el("div", { class: "seg" });
    options.forEach(function (o) {
      seg.appendChild(el("button", { class: current === o.value ? "on" : "", text: o.label,
        onclick: function () { onPick(o.value); } }));
    });
    return el("div", { class: "stack", style: { gap: "6px" } },
      [el("label", { class: "small muted", text: T(label) }), seg]);
  }

  A.register("settings", function (page) {
    const e = A.eng;

    // ---- shop identity
    const locked = root.SHOP.locked;
    const name = A.field(T("Name"), { value: A.shopName() });
    if (locked) {
      name.input.disabled = true;
      name.appendChild(el("div", { class: "tiny faint", text: root.isBn()
        ? "এই কপিটি " + (root.SHOP.issued_to || root.SHOP.name) + " এর জন্য তৈরি, নাম বদলানো যায় না"
        : "This copy was made for " + (root.SHOP.issued_to || root.SHOP.name) }));
    }
    const phone = A.field(T("Phone"), { value: e.setting("business_phone", root.SHOP.phone),
      inputmode: "tel" });
    const addr = A.field(T("Address"), { type: "textarea",
      value: e.setting("business_address", root.SHOP.address) });
    page.appendChild(group("Shop", [
      name, phone, addr,
      segRow("Shop", [{ value: "shop", label: root.isBn() ? "দোকান" : "Shop" },
        { value: "agent", label: root.isBn() ? "বিকাশ/নগদ পয়েন্ট" : "Agent point" },
        { value: "both", label: root.isBn() ? "দুটোই" : "Both" }],
        e.setting("shop_type", "shop"), function (v) {
          e.setSetting("shop_type", v); A.refresh();
        }),
      el("button", { class: "btn btn-pri", text: T("Save"), onclick: function () {
        if (!locked) e.setSetting("business_name", name.val());
        e.setSetting("business_phone", phone.val());
        e.setSetting("business_address", addr.val());
        A.toast(T("Saved"), "ok"); A.refresh();
      } }),
    ]));

    // ---- appearance
    page.appendChild(group("Appearance", [
      segRow("Language", [{ value: "bn", label: "বাংলা" }, { value: "en", label: "English" }],
        e.setting("lang", "bn"), function (v) {
          e.setSetting("lang", v); root.setLang(v); A.refresh();
        }),
      segRow("Theme", [{ value: "light", label: T("Light") },
        { value: "dark", label: T("Dark") },
        { value: "auto", label: root.isBn() ? "নিজে থেকে" : "Auto" }],
        e.setting("theme", "light"), function (v) {
          e.setSetting("theme", v); A.applyTheme(); A.refresh();
        }),
      segRow("Text size", [{ value: "small", label: "A" }, { value: "normal", label: "A" },
        { value: "large", label: "A" }, { value: "largest", label: "A" }],
        e.setting("text_size", "normal"), function (v) {
          e.setSetting("text_size", v); A.applyTheme(); A.refresh();
        }),
      segRow("Density", [{ value: "comfortable", label: root.isBn() ? "আরামদায়ক" : "Comfortable" },
        { value: "compact", label: root.isBn() ? "ঘন" : "Compact" }],
        e.setting("density", "comfortable"), function (v) {
          e.setSetting("density", v); A.applyTheme(); A.refresh();
        }),
      el("div", { class: "field" }, [
        el("label", { text: T("Colour") }),
        A.themeSwatches(),
      ]),
      el("div", { class: "field" }, [
        el("label", { text: root.isBn() ? "অ্যাপ" : "App" }),
        el("div", { class: "row" }, [
          el("button", { class: "btn btn-pri",
            text: "⬇ " + (root.isBn() ? "হোম স্ক্রিনে বসান" : "Install on this device"),
            onclick: A.installApp }),
        ]),
        el("div", { class: "tiny faint", text: root.isBn()
          ? "বসালে আইকন হবে, নেট ছাড়াই খুলবে"
          : "Adds an icon and opens without internet" }),
      ]),
    ]));

    // ---- receipt
    const footer = A.field(T("Footer message"), { value: e.setting("receipt_footer",
      root.isBn() ? "ধন্যবাদ, আবার আসবেন" : "Thank you, please come again") });
    page.appendChild(group("Receipt", [
      segRow("Paper width", [{ value: "32", label: "58 mm" }, { value: "48", label: "80 mm" }],
        String(e.setting("paper", "32")), function (v) {
          e.setSetting("paper", v); A.refresh();
        }),
      segRow("Bengali numbers on receipts", [{ value: "0", label: T("No") },
        { value: "1", label: T("Yes") }], String(e.setting("receipt_bn_digits", "0")),
        function (v) { e.setSetting("receipt_bn_digits", v); A.refresh(); }),
      segRow("Print", [{ value: "0", label: root.isBn() ? "হাতে" : "Manual" },
        { value: "1", label: root.isBn() ? "নিজে থেকে" : "Automatic" }],
        String(e.setting("auto_print", "0")), function (v) {
          e.setSetting("auto_print", v); A.refresh();
        }),
      footer,
      el("button", { class: "btn", text: T("Save"), onclick: function () {
        e.setSetting("receipt_footer", footer.val()); A.toast(T("Saved"), "ok");
      } }),
    ]));

    // ---- targets
    const td = A.field(T("Daily target"), { type: "number", inputmode: "decimal",
      value: e.setting("target_daily", "") , min: 0 });
    const tm = A.field(T("Monthly target"), { type: "number", inputmode: "decimal",
      value: e.setting("target_monthly", ""), min: 0 });
    const tax = A.field(T("Tax") + " %", { type: "number", inputmode: "decimal",
      value: e.setting("default_tax", ""), min: 0 });
    page.appendChild(group("Targets", [
      el("div", { class: "row" }, [el("div", { class: "grow" }, [td]),
        el("div", { class: "grow" }, [tm]), el("div", { class: "grow" }, [tax])]),
      el("button", { class: "btn", text: T("Save"), onclick: function () {
        e.setSetting("target_daily", td.num(0));
        e.setSetting("target_monthly", tm.num(0));
        e.setSetting("default_tax", tax.num(0));
        A.toast(T("Saved"), "ok"); A.refresh();
      } }),
    ]));

    // ---- several shops on one device
    const shops = S.readShops();
    const shopList = el("div", { class: "stack", style: { gap: "6px" } });
    shops.forEach(function (s) {
      const here = s.id === A.store.shopId;
      shopList.appendChild(el("div", { class: "spread card card-pad",
        style: { borderColor: here ? "var(--pri)" : null } }, [
        el("div", { class: "grow" }, [
          el("strong", { text: s.name }),
          here ? el("div", { class: "tiny", style: { color: "var(--pri)" },
            text: root.isBn() ? "এখন খোলা আছে" : "open now" }) : null,
        ]),
        here ? null : el("button", { class: "btn btn-sm btn-pri", text: T("Switch shop"),
          onclick: function () { S.setActiveShop(s.id); location.reload(); } }),
      ]));
    });
    page.appendChild(group("Shops", [
      el("div", { class: "small muted", text: root.isBn()
        ? "একই ডিভাইসে কয়েকটা দোকান রাখতে পারেন — প্রত্যেকের হিসাব সম্পূর্ণ আলাদা। দুই ডিভাইসের হিসাব একসাথে দেখতে হলে ইন্টারনেট লাগবে, সেটা এখানে নেই।"
        : "Several shops on one device; each keeps its own separate book." }),
      shopList,
      el("button", { class: "btn", text: "＋ " + T("Add shop"), onclick: function () {
        const m = A.modal({ title: T("Add shop") });
        const n = A.field(T("Name"), { value: "" });
        m.body.appendChild(n);
        m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
        m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
          onclick: function () {
            if (!n.val()) return A.toast(T("Required"), "warn");
            const list = S.readShops();
            const id = list.reduce(function (m2, s) { return Math.max(m2, s.id); }, 0) + 1;
            list.push({ id: id, name: n.val() });
            S.writeShops(list); S.setActiveShop(id);
            location.reload();
          } }));
      } }),
    ]));

    // ---- backup
    const last = e.setting("last_backup", "");
    const quota = el("div", { class: "tiny faint" });
    A.store.quota().then(function (q) {
      if (!q || !q.total) return;
      const mb = function (n) { return (n / 1048576).toFixed(1) + " MB"; };
      quota.textContent = T("Storage used") + ": " + mb(q.used) + " / " + mb(q.total);
    });
    page.appendChild(group("Backup", [
      el("div", { class: "small muted", text: root.isBn()
        ? "ব্রাউজারের ভিতরের হিসাব ক্যাশ ক্লিয়ার করলে বা ব্রাউজার বদলালে মুছে যেতে পারে। সপ্তাহে একবার ব্যাকআপ নামিয়ে নিজের WhatsApp-এ পাঠিয়ে রাখুন।"
        : "Browser data can be wiped by clearing the cache. Save a backup weekly." }),
      last ? el("div", { class: "tiny faint", text: (root.isBn() ? "শেষ ব্যাকআপ: " : "Last backup: ")

    page.appendChild(el("div", { class: "tiny faint center",

      text: "POS " + (root.SHOP.build || "") + " · "
        + (root.SHOP.issued_to ? (root.isBn() ? "লাইসেন্স: " : "licensed to ")
           + root.SHOP.issued_to : (root.isBn() ? "অফলাইন কপি" : "offline copy")) }));
  });
})(window);
</script>
<script>
/* =================================================================
   The memo — on paper and as a picture.

   A thermal printer has no Bengali font, so anything Bengali has to
   reach it as dots, not letters.  The browser cannot send ESC/POS
   bytes, so the slip is laid out as plain text at the paper's column
   count and handed to the print dialog; the same text is drawn onto a
   canvas for the WhatsApp copy.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  function width() { return parseInt(A.eng.setting("paper", "32"), 10) || 32; }
  function bn() { return A.eng.setting("receipt_bn_digits", "0") === "1"; }

  function pad(s, n) { s = String(s); return s.length >= n ? s.slice(0, n)
    : s + new Array(n - s.length + 1).join(" "); }
  function padL(s, n) { s = String(s); return s.length >= n ? s.slice(-n)
    : new Array(n - s.length + 1).join(" ") + s; }
  function centre(s, w) {
    s = String(s).slice(0, w);
    const left = Math.max(Math.floor((w - s.length) / 2), 0);
    return new Array(left + 1).join(" ") + s;
  }
  function rule(ch, w) { return new Array(w + 1).join(ch); }
  function two(left, right, w) {
    right = String(right);
    left = String(left).slice(0, Math.max(w - right.length - 1, 1));
    return left + new Array(Math.max(w - left.length - right.length, 1) + 1).join(" ") + right;
  }
  function wrap(text, w) {
    const out = [];
    String(text).split(/\s+/).forEach(function (word) {
      if (!out.length) { out.push(word); return; }
      if ((out[out.length - 1] + " " + word).length <= w) out[out.length - 1] += " " + word;
      else out.push(word);
    });
    return out;
  }

  /** The plain-text slip.  Currency is ASCII: a thermal head prints ৳ as
   *  a black box. */
  A.receiptText = function (sale, items) {
    const w = width(), sym = A.symAscii(), e = A.eng;
    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)
      .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    const L = [];
    L.push(centre(A.shopName().toUpperCase(), w));
    const phone = e.setting("business_phone", root.SHOP.phone);
    const addr = e.setting("business_address", root.SHOP.address);
    if (addr) wrap(addr, w).forEach(function (x) { L.push(centre(x, w)); });
    if (phone) L.push(centre(phone, w));
    L.push(rule("=", w));
    L.push(two("Invoice", sale.invoice_no, w));
    L.push(two("Date", String(sale.created_at).slice(0, 16).replace("T", " "), w));
    if (sale.customer_name && sale.customer_name !== T("Walk-in")) {
      L.push(two("Customer", sale.customer_name, w));
    }
    if (sale.customer_phone) L.push(two("Phone", sale.customer_phone, w));
    L.push(rule("-", w));
    L.push(pad("ITEM", w - 12) + padL("AMOUNT", 12));
    L.push(rule("-", w));
    (items || []).forEach(function (it) {
      wrap(it.name, w).forEach(function (x) { L.push(x); });
      const qty = (Math.round(it.qty * 1000) / 1000) + " " + (it.unit || "");
      L.push(two("  " + qty + " x " + n(it.price), n(it.line_total), w));
    });
    L.push(rule("-", w));
    L.push(two("Subtotal", n(sale.subtotal), w));
    if (Number(sale.discount_amt)) L.push(two("Discount", "-" + n(sale.discount_amt), w));
    if (Number(sale.tax_amt)) L.push(two("Tax (" + sale.tax_percent + "%)", n(sale.tax_amt), w));
    if (Number(sale.delivery_charge)) L.push(two("Delivery", n(sale.delivery_charge), w));
    L.push(rule("=", w));
    L.push(two("TOTAL", sym + n(sale.grand_total), w));
    if (Number(sale.paid_cash)) L.push(two("Cash", n(sale.paid_cash), w));
    if (Number(sale.paid_mobile)) {
      L.push(two(sale.mobile_method || "Mobile", n(sale.paid_mobile), w));
      if (sale.trx_id) L.push(two("TrxID", sale.trx_id, w));
    }
    if (Number(sale.change_due)) L.push(two("Change", n(sale.change_due), w));
    if (Number(sale.due)) L.push(two("DUE", n(sale.due), w));
    L.push(rule("-", w));
    const foot = A.eng.setting("receipt_footer", root.isBn()
      ? "ধন্যবাদ, আবার আসবেন" : "Thank you, please come again");
    if (foot) wrap(foot, w).forEach(function (x) { L.push(centre(x, w)); });
    L.push("");
    let text = L.join("\n");
    if (bn()) {
      text = root.bnDigits(text);
      // The invoice number, TrxID and phone are identifiers — someone has
      // to type them back in or match them against a statement, and in
      // Bengali digits they are useless for that.
      [sale.invoice_no, sale.trx_id, sale.customer_phone].forEach(function (id) {
        if (!id) return;
        text = text.split(root.bnDigits(String(id))).join(String(id));
      });
    }
    return text;
  };

  /** Print through the browser.  A hidden iframe keeps the app's own
   *  screen out of the print, and closes itself afterwards. */
  function printText(text) {
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(frame);
    const w = width();
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'
      + '@page{size:' + (w > 40 ? "80mm" : "58mm") + ' auto;margin:2mm}'
      + 'body{margin:0;font-family:"Courier New",monospace;'
      + 'font-size:' + (w > 40 ? "11px" : "12px") + ';line-height:1.35;white-space:pre}'
      + '</style></head><body></body></html>');
    doc.close();
    doc.body.textContent = text;
    setTimeout(function () {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch (e) { A.toast(root.isBn() ? "প্রিন্ট করা গেল না" : "Could not print", "bad"); }
      setTimeout(function () { frame.remove(); }, 1200);
    }, 120);
  }

  A.printReceipt = function (sale, items) { printText(A.receiptText(sale, items)); };
  A.printDayClose = function (pos, counted) {
    const w = width(), sym = A.symAscii();
    const n = function (v) { return (Math.round((Number(v) || 0) * 100) / 100)
      .toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    const t = A.eng.totalsForDay(pos.day);
    const L = [centre(A.shopName().toUpperCase(), w), centre("DAY CLOSING", w), rule("=", w),
      two("Date", pos.day, w), two("Time", new Date().toTimeString().slice(0, 5), w),
      rule("-", w), two("Orders", String(t.orders), w),
      two("Total sales", n(t.revenue), w), rule("-", w),
      two("Opening cash", n(pos.opening), w), two("Cash sales", n(pos.cash_sales), w),
      two("Cash refunds", "-" + n(pos.cash_refunds), w),
      two("Cash expenses", "-" + n(pos.cash_expenses), w),
      two("To suppliers", "-" + n(pos.supplier_cash), w),
      two("Credit collected", n(pos.due_collected), w),
      two("Mobile banking", n(pos.agent_cash), w), rule("=", w),
      two("EXPECTED", sym + n(pos.expected), w), two("COUNTED", sym + n(counted), w),
      two("DIFFERENCE", n(counted - pos.expected), w), rule("-", w), "",
      "Signature: ______________", "", ""];
    printText(L.join("\n"));
  };

  /** The same slip as a PNG, for WhatsApp.  Bengali survives here because
   *  the phone's own font draws it and the customer receives pixels. */
  function toCanvas(text) {
    const lines = text.split("\n");
    const scale = 2;                       // crisp on a phone screen
    const cw = 7.2 * scale, lh = 17 * pad0(scale), padPx = 14 * scale;
    function pad0(s) { return s; }
    const w = Math.round(width() * cw + padPx * 2);
    const h = Math.round(lines.length * lh + padPx * 2);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#000000";
    g.font = (12 * scale) + 'px "Courier New",monospace';
    g.textBaseline = "top";
    lines.forEach(function (line, i) {
      g.fillText(line, padPx, padPx + i * lh);
    });
    return c;
  }

  A.shareReceipt = function (sale, items) {
    const text = A.receiptText(sale, items);
    const canvas = toCanvas(text);
    canvas.toBlob(function (blob) {
      const file = blob ? new File([blob], sale.invoice_no + ".png",
        { type: "image/png" }) : null;
      const caption = A.shopName() + " · " + sale.invoice_no + " · "
        + A.money(sale.grand_total);
      // Phones can hand the picture straight to WhatsApp; a desktop
      // browser usually cannot, so it falls back to wa.me with the words
      // and the picture saved beside it.
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], text: caption }).catch(function () {});
        return;
      }
      if (blob) A.download(blob, sale.invoice_no + ".png");
      const phone = sale.customer_phone;
      if (phone) {
        const url = A.eng.waLink(phone, caption + "\n\n"
          + (root.isBn() ? "মেমোর ছবি সংযুক্ত করুন" : "attach the saved memo picture"));
        window.open(url, "_blank", "noopener");
      }
      A.toast(root.isBn() ? "মেমোর ছবি নেমেছে — WhatsApp-এ সংযুক্ত করুন"
                          : "Memo image saved — attach it in WhatsApp", "ok");
    }, "image/png");
  };

  /** Shown the moment a sale is saved. */
  A.saleDone = function (sale, items) {
    const m = A.modal({ title: T("Sale completed") });
    m.body.appendChild(el("div", { class: "center", style: { marginBottom: "12px" } }, [
      el("div", { style: { fontSize: "2.6rem", color: "var(--ok)" }, text: "✓" }),
      el("div", { style: { fontSize: "1.8rem", fontWeight: "800" },
        text: A.money(sale.grand_total) }),
      el("div", { class: "muted small", text: sale.invoice_no }),
      Number(sale.change_due) ? el("div", { class: "chip chip-ok",
        style: { marginTop: "8px" },
        text: T("Change") + " " + A.money(sale.change_due) }) : null,
      Number(sale.due) ? el("div", { class: "chip chip-warn", style: { marginTop: "8px" },
        text: T("Due") + " " + A.money(sale.due) }) : null,
    ]));
    m.body.appendChild(el("div", { class: "slip", text: A.receiptText(sale, items) }));
    m.footer.appendChild(el("button", { class: "btn", text: "🖨 " + T("Print receipt"),
      onclick: function () { A.printReceipt(sale, items); } }));
    m.footer.appendChild(el("button", { class: "btn btn-ok", text: "🟢 " + T("Send on WhatsApp"),
      onclick: function () { A.shareReceipt(sale, items); } }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Next sale") + " ▸",
      onclick: function () { m.close(); } }));
    if (A.eng.setting("auto_print", "0") === "1") {
      setTimeout(function () { A.printReceipt(sale, items); }, 200);
    }
  };
})(window);
</script>
<script>
/* =================================================================
   A real .xlsx, written by hand.

   CSV would have been easier, but Excel keeps mangling Bengali in CSV
   and the owner has to click through an import wizard.  A .xlsx opens
   with one double-click and keeps the text exactly as typed.

   The file is a ZIP.  Compression is skipped entirely (ZIP "stored"
   mode is perfectly valid), which removes the need for a deflate
   implementation and keeps this to a page of code.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App;

  const CRC = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const utf8 = (s) => new TextEncoder().encode(s);

  function zip(files) {
    const chunks = [], central = [];
    let offset = 0;
    files.forEach(function (f) {
      const name = utf8(f.name), data = utf8(f.body), sum = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);  // UTF-8 names
      local.setUint16(8, 0, true);                                      // stored
      local.setUint32(14, sum, true);
      local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
      local.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(local.buffer), name, data);

      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true);
      cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true);
      cen.setUint32(16, sum, true);
      cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
      cen.setUint16(28, name.length, true);
      cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), name);
      offset += 30 + name.length + data.length;
    });
    let censize = 0;
    central.forEach(function (c) { censize += c.length; });
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, censize, true); end.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]),
      { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    // Excel rejects raw control characters outright.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");

  function colName(i) {
    let s = "";
    i += 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s;
                    i = Math.floor((i - 1) / 26); }
    return s;
  }

  function sheetXml(rows) {
    let out = '<?xml version="1.0" encoding="UTF-8"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetData>';
    rows.forEach(function (row, r) {
      out += '<row r="' + (r + 1) + '">';
      (row || []).forEach(function (cell, c) {
        const ref = colName(c) + (r + 1);
        const isNum = typeof cell === "number" && isFinite(cell);
        if (cell === null || cell === undefined || cell === "") return;
        out += isNum
          ? '<c r="' + ref + '"><v>' + cell + '</v></c>'
          : '<c r="' + ref + '" t="inlineStr" s="' + (r === 0 ? 1 : 0) + '">'
            + '<is><t xml:space="preserve">' + esc(cell) + '</t></is></c>';
      });
      out += '</row>';
    });
    return out + '</sheetData></worksheet>';
  }

  /** rows[0] is treated as the header and comes out bold. */
  A.xlsx = function (sheetName, rows, fileName) {
    const safe = String(sheetName || "Sheet1").replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31);
    const blob = zip([
      { name: "[Content_Types].xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + '</Types>' },
      { name: "_rels/.rels", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
        + '</Relationships>' },
      { name: "xl/workbook.xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
        + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
        + '<sheets><sheet name="' + esc(safe) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: "xl/_rels/workbook.xml.rels", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
        + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
        + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
        + '</Relationships>' },
      { name: "xl/styles.xml", body:
        '<?xml version="1.0" encoding="UTF-8"?>'
        + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
        + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
        + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
        + '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'
        + '<borders count="1"><border/></borders>'
        + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
        + '<cellXfs count="2"><xf xfId="0"/><xf fontId="1" applyFont="1" xfId="0"/></cellXfs>'
        + '</styleSheet>' },
      { name: "xl/worksheets/sheet1.xml", body: sheetXml(rows) },
    ]);
    A.download(blob, (fileName || "export") + "-"
      + root.POSEngine.helpers.dayKey() + ".xlsx");
  };

  A.download = function (blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  };

  // ------------------------------------------------------------ backup
  A.saveBackup = function () {
    const dump = A.store.exportAll();
    dump.shop_name = A.shopName();
    const blob = new Blob([JSON.stringify(dump)], { type: "application/json" });
    A.download(blob, "pos-backup-" + root.POSEngine.helpers.dayKey() + ".json");
    A.eng.setSetting("last_backup", root.POSEngine.helpers.stamp());
    A.toast(root.isBn() ? "ব্যাকআপ ফাইল নেমে গেছে" : "Backup file downloaded", "ok");
  };

  A.restoreBackup = function () {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json";
    input.onchange = function () {
      const f = input.files && input.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (e) { return A.toast(root.isBn() ? "ফাইলটা পড়া গেল না" : "Could not read that file", "bad"); }
        A.confirm(root.isBn() ? "ব্যাকআপ ফেরাবেন?" : "Restore this backup?",
          root.isBn()
            ? "এখনকার সব হিসাব মুছে গিয়ে ব্যাকআপের হিসাব বসবে।\n\nব্যাকআপ নেওয়া হয়েছিল: "
              + String(data.saved_at || "").slice(0, 10)
            : "Everything now will be replaced by the backup.", { danger: true })
          .then(function (yes) {
            if (!yes) return;
            try {
              A.store.importAll(data).then(function () {
                A.toast(root.isBn() ? "ফেরানো হয়েছে" : "Restored", "ok");
                setTimeout(function () { location.reload(); }, 700);
              });
            } catch (e) {
              A.toast((root.isBn() ? "ফেরানো গেল না: " : "Restore failed: ") + e.message, "bad");
            }
          });
      };
      reader.readAsText(f);
    };
    input.click();
  };
})(window);
</script>
<script>
/* =================================================================
   Boot: open this shop's book, then draw.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el;

  function fatal(msg) {
    document.body.innerHTML = "";
    document.body.appendChild(el("div", { class: "empty",
      style: { paddingTop: "22vh" } }, [
      el("div", { class: "big", text: "⚠" }),
      el("h2", { style: { marginBottom: "8px" }, text: "চালু করা গেল না" }),
      el("div", { class: "muted", text: msg }),
    ]));
  }

  function start() {
    const S = root.POSStore;
    const store = new S.Store(S.activeShopId());
    store.open().then(function () {
      A.store = store;
      A.eng = new root.POSEngine(store);

      // First run: settings the shop expects to already be there.
      if (!store.tables.settings.units) {
        A.eng.setSetting("units", "pcs,kg,litre,packet,bosta,hali,dozen,gram");
      }
      if (!store.tables.settings.business_name && !root.SHOP.locked) {
        A.eng.setSetting("business_name", root.SHOP.name);
      }
      const shops = S.readShops();
      const me = shops.find(function (s) { return s.id === store.shopId; });
      if (me && me.name !== A.shopName()) {
        me.name = A.shopName(); S.writeShops(shops);
      }

      root.setLang(A.eng.setting("lang", "bn"));
      A.applyTheme();
      document.title = A.shopName() + " · POS";

      if (store._failed) {
        A.toast(root.isBn()
          ? "এই ব্রাউজারে হিসাব জমা রাখা যাচ্ছে না — প্রাইভেট উইন্ডো হলে বন্ধ করে সাধারণ উইন্ডোতে খুলুন"
          : "This browser will not store data — try a normal window", "bad");
      }

      A.go("dashboard");

      // Save everything still queued before the tab goes away.
      window.addEventListener("pagehide", function () { store.flush(); });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") store.flush();
      });
    }).catch(function (err) { fatal(err.message); });
  }


  // ---------------------------------------------------------- install
  /* Chrome hands over a one-shot prompt object; iOS Safari hands over
     nothing at all, so that one gets written instructions instead. */
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    A.installEvent = e;
    if (A.refreshInstallBtn) A.refreshInstallBtn();
  });
  window.addEventListener("appinstalled", function () {
    A.installEvent = null;
    A.toast(root.isBn() ? "অ্যাপ ইনস্টল হয়েছে" : "App installed", "ok");
    if (A.refreshInstallBtn) A.refreshInstallBtn();
  });

  // Register the offline cache, but only when served over http(s):
  // opened straight off the disk as a file:// page there is no scope for
  // a worker, and the attempt throws a confusing console error.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else { start(); }
})(window);
</script>
<div id="app">
  <aside id="rail"></aside>
  <div id="main">
    <header id="top">
      <button class="btn btn-ghost btn-icon only-phone" id="menubtn" aria-label="menu">☰</button>
      <h1 id="top-title">POS</h1>
      <div class="topbar-tools" id="top-tools"></div>
    </header>
    <main id="page"></main>
  </div>
</div>
<nav id="tabbar"></nav>
<div id="toast"></div>
<script>
document.getElementById("menubtn").addEventListener("click", function () {
  document.body.classList.toggle("drawer");
});
document.addEventListener("click", function (e) {
  // Tapping the dimmed area closes the drawer on a phone.
  if (document.body.classList.contains("drawer") &&
      !e.target.closest("#rail") && !e.target.closest("#menubtn") &&
      !e.target.closest("#tabbar")) {
    document.body.classList.remove("drawer");
  }
});
</script>
</body>
</html>
