<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Offline shop billing">
<style>
/* ===================================================================
   One design, two themes, two screen shapes.

   Everything is driven by the tokens on :root, so a colour or a text
   size changes in one place.  Sizes are in rem against a root font the
   shopkeeper can set, which is how the whole interface grows without
   any layout being rebuilt.
   =================================================================== */
:root{
  --pri:#0f766e; --pri-d:#0b5f58; --pri-l:#14b8a6;
  --acc:#7c3aed; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --surface3:#e9eef4;
  --line:#dfe6ee; --text:#0f172a; --muted:#5b6b7f; --faint:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --shadow-lg:0 2px 6px rgba(15,23,42,.08),0 24px 48px -24px rgba(15,23,42,.3);
  --r:14px; --r-sm:10px; --r-lg:22px;
  --pad:18px; --gap:14px;
  --tap:48px;                     /* never smaller: shop fingers, fast hands */
  --fs:16px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b1117; --surface:#141c25; --surface2:#1b242f; --surface3:#26323f;
  --line:#2b3745; --text:#e8eef5; --muted:#9aabbd; --faint:#64748b;
  --pri:#14b8a6; --pri-d:#0d9488; --pri-l:#2dd4bf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,
              "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------ shell */
#app{display:flex;min-height:100dvh}
#rail{
  width:248px;flex:0 0 248px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:30;
}
.brand{padding:22px 20px 16px;display:flex;gap:12px;align-items:center}
.brand-mark{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,var(--pri-l),var(--pri-d));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;
  box-shadow:var(--shadow);
}
.brand-name{font-weight:700;font-size:1.02rem;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-sub{font-size:.76rem;color:var(--faint);margin-top:2px}
#nav{padding:6px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.navbtn{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);
  color:var(--muted);font-size:.97rem;font-weight:600;text-align:left;
  transition:background .12s,color .12s;
}
.navbtn:hover{background:var(--surface2);color:var(--text)}
.navbtn.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.navbtn .ic{width:22px;flex:0 0 22px;display:grid;place-items:center;font-size:1.05rem}
.navbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .pip{
  min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);
  color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;
}
.rail-foot{padding:12px 16px 18px;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--faint);line-height:1.5}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px var(--pad);display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
#top h1{font-size:1.5rem;flex:1;min-width:140px}
.topbar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#page{padding:var(--pad);flex:1;max-width:1600px;width:100%;margin:0 auto}

/* ------------------------------------------------------------ pieces */
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:var(--pad)}
.grid{display:grid;gap:var(--gap)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:var(--gap);align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:.86rem}.tiny{font-size:.76rem}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}
.grow{flex:1;min-width:0}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);
  font-weight:700;font-size:.95rem;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);
  transition:filter .12s,transform .06s,background .12s;
}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ghost{background:transparent}
.btn-lg{min-height:58px;font-size:1.06rem;padding:0 24px}
.btn-sm{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:8px}
.btn-icon{width:var(--tap);padding:0;flex:0 0 var(--tap)}
.btn[disabled]{opacity:.45;pointer-events:none}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:.82rem;color:var(--muted);font-weight:600}
.inp{
  width:100%;min-height:var(--tap);padding:10px 14px;border-radius:var(--r-sm);
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  outline:none;transition:border-color .12s,box-shadow .12s;
}
.inp:focus{border-color:var(--pri);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  border-radius:17px;background:var(--surface2);border:1px solid var(--line);
  font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);
  border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.chip-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);
  border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.chip-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);
  border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px;gap:3px;overflow-x:auto;max-width:100%}
.seg button{min-height:38px;padding:0 14px;border-radius:8px;font-weight:600;
  font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
table.tbl th{
  text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
table.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.tile{padding:16px 18px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700}
.tile .v{font-size:1.9rem;font-weight:800;margin-top:6px;line-height:1.1;
  overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:4px}

.bar{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pri);border-radius:4px;
  transition:width .35s ease}

.empty{padding:48px 20px;text-align:center;color:var(--faint)}
.empty .big{font-size:2.4rem;margin-bottom:10px;opacity:.55}

/* --------------------------------------------------------- dialogs */
.veil{position:fixed;inset:0;background:rgba(6,12,20,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(680px,100%);
  max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  animation:pop .16s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes pop{from{transform:translateY(12px) scale(.99);opacity:0}}
.modal > header{padding:18px var(--pad) 12px;display:flex;gap:12px;align-items:center;
  border-bottom:1px solid var(--line)}
.modal > header h3{font-size:1.15rem;flex:1}
.modal > .body{padding:var(--pad);overflow-y:auto;flex:1}
.modal > footer{padding:14px var(--pad);border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal > footer .btn{flex:1;min-width:120px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{padding:12px 18px;border-radius:var(--r-sm);background:var(--text);
  color:var(--bg);font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);
  animation:rise .18s ease;max-width:100%;text-align:center}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.toast.ok{background:var(--ok);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
.toast.warn{background:var(--warn);color:#fff}

/* --------------------------------------------------------- till */
.till{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--gap);align-items:start}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px}
.ptile{padding:12px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;
  gap:6px;min-height:104px;transition:transform .07s,border-color .12s,box-shadow .12s}
.ptile:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.ptile:active{transform:scale(.98)}
.ptile .pn{font-weight:700;font-size:.9rem;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .pp{font-weight:800;color:var(--pri);font-size:1.05rem;margin-top:auto}
.ptile .ps{font-size:.72rem;color:var(--faint)}
.ptile.out{opacity:.62}
.ptile .thumb{width:100%;height:74px;border-radius:8px;object-fit:cover;
  background:var(--surface3)}
.cartline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;
  padding:10px 0;border-bottom:1px solid var(--line)}
.qtybox{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;background:var(--surface2)}
.qtybox button{width:36px;height:36px;font-weight:800;font-size:1.05rem;color:var(--muted)}
.qtybox button:hover{background:var(--surface3);color:var(--text)}
.qtybox .q{min-width:48px;text-align:center;font-weight:700;font-size:.92rem}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.totals .big{font-size:1.5rem;font-weight:800}

/* --------------------------------------------------------- receipt */
.slip{background:#fff;color:#000;font-family:"Courier New",ui-monospace,monospace;
  font-size:12px;line-height:1.45;padding:10px;white-space:pre-wrap;
  width:100%;max-width:340px;margin:0 auto;border-radius:6px}

/* --------------------------------------------------------- phone */
#tabbar{display:none}
@media (max-width:900px){
  :root{--pad:14px;--gap:12px}
  #rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  body.drawer #rail{transform:none}
  body.drawer::after{content:"";position:fixed;inset:0;background:rgba(6,12,20,.5);
    z-index:25}
  #top h1{font-size:1.2rem}
  #page{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .till{grid-template-columns:1fr}
  .tile .v{font-size:1.55rem}
  #tabbar{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;
    left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 2px 7px;font-size:.66rem;font-weight:700;color:var(--muted)}
  #tabbar button .ic{font-size:1.24rem}
  #tabbar button.on{color:var(--pri)}
  .modal{width:100%;max-height:96dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;
    margin-top:auto;animation:sheet .2s ease}
  .veil{align-items:flex-end;padding:0}
  @keyframes sheet{from{transform:translateY(24px)}}
  .modal > footer .btn{min-width:0}
}
@media (min-width:901px){ .only-phone{display:none !important} }

@media print{
  body{background:#fff}
  #rail,#top,#tabbar,.veil,#toast,.noprint{display:none !important}
  #page{padding:0;max-width:none}
  .slip{max-width:none;font-size:12px;padding:0}
}

/* ===================================================================
   PREMIUM LAYER
   Depth, gradient and type refinements applied on top of the base.
   Everything still reads from the same tokens, so a theme switch
   carries through the whole thing.
   =================================================================== */
:root{
  --r:16px; --r-sm:12px; --r-lg:26px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -16px rgba(15,23,42,.28);
  --shadow-lg:0 4px 10px rgba(15,23,42,.07),0 30px 60px -28px rgba(15,23,42,.36);
  --ring:color-mix(in srgb,var(--pri) 24%,transparent);
  --glow:color-mix(in srgb,var(--pri) 12%,transparent);
  --hair:color-mix(in srgb,var(--text) 8%,transparent);
}
html[data-theme="dark"]{
  --hair:color-mix(in srgb,#ffffff 10%,transparent);
  --bg:#080d13; --surface:#111923; --surface2:#18222e; --surface3:#22303e;
  /* the status colours have to lift off a dark sheet, not sink into it */
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
html[data-theme="dark"] .btn-ok{background:linear-gradient(180deg,#10b981,#047857)}
html[data-theme="dark"] .btn-bad{background:linear-gradient(180deg,#f87171,#b91c1c)}
html[data-density="compact"]{ --pad:13px; --gap:10px; --tap:44px }

body{
  background:
    radial-gradient(1100px 620px at 8% -8%, var(--glow), transparent 60%),
    radial-gradient(900px 520px at 108% 0%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  letter-spacing:.005em;
}
.num,.tile .v,.duecard-amt,.duerow-amt,.totals .big,.mini-v,
table.tbl td.right,table.tbl th.right{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}

/* --------------------------------------------------------- surfaces */
.card{
  border-color:var(--hair);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--surface) 100%,transparent),
    color-mix(in srgb,var(--surface2) 62%,var(--surface)));
  backdrop-filter:saturate(120%);
}
.tile{
  border-color:var(--hair);position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--surface),
    color-mix(in srgb,var(--surface2) 70%,var(--surface)));
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
}
.tile::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--pri-l),var(--pri));opacity:.85;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile .k{letter-spacing:.08em;font-size:.7rem}
.tile .v{letter-spacing:-.02em;font-weight:800}
.tile-hero{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--pri-d),var(--pri) 55%,var(--pri-l));
  box-shadow:0 16px 40px -20px color-mix(in srgb,var(--pri) 85%,transparent),var(--shadow);
}
.tile-hero::before{display:none}
.tile-hero .k,.tile-hero .s{color:rgba(255,255,255,.82)}
.tile-hero .v{color:#fff}
.tiles4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.strong{font-weight:700} .up{letter-spacing:.08em;text-transform:uppercase}

/* ------------------------------------------------------------- rail */
#rail{
  background:linear-gradient(180deg,var(--surface),
    color-mix(in srgb,var(--surface2) 80%,var(--surface)));
  border-right-color:var(--hair);
}
.brand{padding:20px 18px 14px}
.brand-mark{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--pri) 90%,transparent);
}
.navbtn{position:relative;border-radius:12px}
.navbtn::before{
  content:"";position:absolute;left:0;top:50%;height:0;width:3px;border-radius:0 3px 3px 0;
  background:var(--pri);transform:translateY(-50%);transition:height .18s ease;
}
.navbtn.on{
  color:var(--pri);font-weight:700;
  background:linear-gradient(90deg,color-mix(in srgb,var(--pri) 16%,transparent),
                                   color-mix(in srgb,var(--pri) 5%,transparent));
}
.navbtn.on::before{height:56%}

/* -------------------------------------------------------------- top */
#top{
  padding:14px var(--pad);border-bottom-color:var(--hair);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
}
#top h1{letter-spacing:-.02em}
#page{animation:pagein .22s cubic-bezier(.2,.8,.3,1)}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}}

/* ---------------------------------------------------------- buttons */
.btn{border-color:var(--hair);border-radius:12px;letter-spacing:.005em}
.btn-pri{
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--pri-l) 30%,var(--pri)),var(--pri-d));
  border-color:transparent;
  box-shadow:0 10px 22px -14px color-mix(in srgb,var(--pri) 92%,transparent),
             inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-ok{background:linear-gradient(180deg,#22c55e,#15803d);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn-bad{background:linear-gradient(180deg,#ef4444,#b91c1c);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn-acc{background:linear-gradient(180deg,var(--acc),
  color-mix(in srgb,var(--acc) 70%,#000));border-color:transparent}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--surface2)}
.installbtn{white-space:nowrap}

.inp{border-color:var(--hair);border-radius:12px;

<body>
<script>
/* =====================================================================
   The one block that changes per shop.

   The copy generator rewrites exactly this object and nothing else, so
   every shop gets a file that is byte-identical apart from its own name.
   The name is not editable inside the app: that is the whole licence.
   ===================================================================== */
window.SHOP = {
  name: "নমুনা দোকান",
  name_en: "Sample Store",
  phone: "",
  address: "",
  tagline: "",
  issued_to: "",          // who this copy was made for
  issued_on: "",          // yyyy-mm-dd
  locked: false,          // true in a generated copy: name cannot be edited
  build: "1.0.0",
};
</script>
<script>
/* =====================================================================
   engine.js — every rule about money, and nothing about the screen.

   This is a direct port of the Python engine that was checked line by
   line against a hand-worked shop day.  Keeping it free of any DOM or
   storage code means the same file can be run in a test harness, which
   is the only reason the arithmetic can be trusted at all.

   Shapes (kept deliberately close to the old SQLite tables):
     products     {id,name,sku,barcode,unit,cost_price,sale_price,stock,
                   low_stock_at,tax_percent,category,is_active}
     sales        {id,invoice_no,kind:'sale'|'return',status:'completed'|'void',
                   customer_id,customer_name,customer_phone,subtotal,
                   discount_amt,tax_percent,tax_amt,delivery_charge,
                   grand_total,paid_cash,paid_mobile,mobile_method,trx_id,
                   change_due,due,payment_method,ref_sale_id,user_id,
                   created_at}
     sale_items   {id,sale_id,product_id,name,unit,qty,price,cost,line_total}
     stock_moves  {id,product_id,change,reason,ref,created_at}
     customers    {id,name,phone,whatsapp,address,due}
     due_payments {id,customer_id,amount,method,note,paid_on,user_id}
     expenses     {id,category,amount,method,note,spent_on,user_id}
     wallet_txns  {id,wallet,kind,customer_number,customer_name,amount,
                   commission,charge,cash_delta,ewallet_delta,trx_id,note,
                   status,created_at}
     day_close    {id,closed_on,opening_cash,cash_sales,cash_refunds,
                   cash_expenses,due_collected,agent_cash,expected_cash,
                   counted_cash,difference,note}
     users        {id,name,pin_hash,role,is_active}
   ===================================================================== */

(function (root) {
  "use strict";

  const MOBILE_METHODS = ["bKash", "Nagad", "Rocket", "Card", "Upay", "Bank"];

  //  How each kind of agent transaction moves money: [cash, e-money].
  //  Cash In  : customer hands over notes, agent sends e-money out
  //  Cash Out : customer takes notes, agent receives e-money
  const WALLET_KINDS = {
    "Cash In":    [ 1, -1],
    "Cash Out":   [-1,  1],
    "Send Money": [ 1, -1],
    "Recharge":   [ 1, -1],
    "Bill Pay":   [ 1, -1],
    "Payment":    [ 1, -1],
    "B2B Load":   [-1,  1],
  };

  const WALLETS = ["bKash", "Nagad", "Rocket", "Upay"];

  // ------------------------------------------------------------------
  //  small helpers
  // ------------------------------------------------------------------
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const num = (n, dflt) => {
    const v = parseFloat(n);
    return isFinite(v) ? v : (dflt || 0);
  };

  function pad(n, width) {
    let s = String(n);
    while (s.length < width) s = "0" + s;
    return s;
  }

  /** Local date as YYYY-MM-DD — never toISOString(), which is UTC and
   *  would file an 11pm Dhaka sale under the next day. */
  function dayKey(d) {
    d = d ? new Date(d) : new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1, 2) + "-" + pad(d.getDate(), 2);
  }

  function stamp(d) {
    d = d ? new Date(d) : new Date();
    return dayKey(d) + " " + pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2)
           + ":" + pad(d.getSeconds(), 2);
  }

  const dayOf = (row) => String(row.created_at || row.spent_on || row.paid_on || "").slice(0, 10);
  const inRange = (day, start, end) => day >= start && day <= end;

  // ==================================================================
  //  Engine
  // ==================================================================
  function Engine(db) {
    this.db = db;                    // {tables:{...}, put(), nextId()}
  }

  Engine.prototype._t = function (name) {
    return this.db.tables[name] || (this.db.tables[name] = []);
  };

  Engine.prototype.setting = function (key, dflt) {
    const s = this.db.tables.settings || {};
    return s[key] === undefined || s[key] === null || s[key] === "" ? dflt : s[key];
  };

  Engine.prototype.setSetting = function (key, value) {
    this.db.tables.settings[key] = value;
    this.db.put("settings", this.db.tables.settings);
  };

  Engine.prototype.settingFloat = function (key, dflt) {
    return num(this.setting(key, dflt), dflt || 0);
  };

  // ---------------------------------------------------------------- products
  Engine.prototype.products = function (opts) {
    opts = opts || {};
    let rows = this._t("products");
    if (opts.onlyActive !== false) rows = rows.filter((p) => p.is_active !== 0);
    if (opts.search) {
      const q = String(opts.search).toLowerCase();
      rows = rows.filter((p) =>
        (p.name || "").toLowerCase().indexOf(q) >= 0 ||
        (p.sku || "").toLowerCase().indexOf(q) >= 0 ||
        (p.barcode || "").toLowerCase().indexOf(q) >= 0);
    }
    if (opts.category) rows = rows.filter((p) => p.category === opts.category);
    return rows.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  };

  Engine.prototype.product = function (id) {
    return this._t("products").find((p) => p.id === id) || null;
  };

  Engine.prototype.findByCode = function (code) {
    code = String(code || "").trim();
    if (!code) return null;
    return this._t("products").find(
      (p) => p.is_active !== 0 && (p.barcode === code || p.sku === code)) || null;
  };

  Engine.prototype.saveProduct = function (data) {
    const t = this._t("products");
    if (data.id) {
      const row = this.product(data.id);
      if (!row) return null;
      //  Stock is deliberately NOT written here.  An edit form holds the
      //  figure from the moment it was opened; a sale made meanwhile
      //  would be wiped out by saving a price change.  Stock only ever
      //  moves through adjustStock, which also writes the ledger.
      ["name", "sku", "barcode", "unit", "cost_price", "sale_price",
       "low_stock_at", "tax_percent", "category"].forEach((f) => {
        if (data[f] !== undefined) row[f] = data[f];
      });
      this.db.put("products", row);
      return row;
    }
    const row = {
      id: this.db.nextId("products"),
      name: data.name || "", sku: data.sku || "", barcode: data.barcode || "",
      unit: data.unit || "pcs",
      cost_price: num(data.cost_price), sale_price: num(data.sale_price),
      stock: num(data.stock), low_stock_at: num(data.low_stock_at, 5),
      tax_percent: num(data.tax_percent), category: data.category || "",
      is_active: 1,
    };
    t.push(row);
    this.db.put("products", row);
    if (row.stock) this._move(row.id, row.stock, "opening", "");
    return row;
  };

  Engine.prototype.deleteProduct = function (id) {
    const row = this.product(id);
    if (!row) return;
    row.is_active = 0;
    // Retire the code with the row, so the same SKU can be used again.
    if (row.sku) row.sku = row.sku + "#del" + Date.now();
    this.db.put("products", row);
  };

  Engine.prototype._move = function (product_id, change, reason, ref) {
    const row = {
      id: this.db.nextId("stock_moves"), product_id: product_id,
      change: r2(change), reason: reason, ref: ref || "", created_at: stamp(),
    };
    this._t("stock_moves").push(row);
    this.db.put("stock_moves", row);
  };

  Engine.prototype.adjustStock = function (product_id, change, reason, ref) {
    const p = this.product(product_id);
    if (!p) return;
    p.stock = r2(num(p.stock) + num(change));
    this.db.put("products", p);
    this._move(product_id, change, reason || "adjust", ref);
  };

  Engine.prototype.lowStock = function () {
    return this._t("products").filter(
      (p) => p.is_active !== 0 && num(p.low_stock_at) > 0 &&
             num(p.stock) <= num(p.low_stock_at))
      .sort((a, b) => num(a.stock) - num(b.stock));
  };

  Engine.prototype.categories = function () {
    const seen = {};
    this.products().forEach((p) => { if (p.category) seen[p.category] = 1; });
    return Object.keys(seen).sort();
  };

  Engine.prototype.units = function () {
    const list = this.setting("units", "pcs,kg,litre,packet,bosta,pcs");
    const out = [];
    String(list).split(",").forEach((u) => {
      u = u.trim();
      if (u && out.indexOf(u) < 0) out.push(u);
    });
    return out;
  };

  // --------------------------------------------------------------- customers
  Engine.prototype.customers = function (search) {
    let rows = this._t("customers");
    if (search) {
      const q = String(search).toLowerCase();
      rows = rows.filter((c) =>
        (c.name || "").toLowerCase().indexOf(q) >= 0 ||
        (c.phone || "").indexOf(q) >= 0 ||
        (c.whatsapp || "").indexOf(q) >= 0);
    }
    return rows.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  };

  Engine.prototype.customer = function (id) {
    return this._t("customers").find((c) => c.id === id) || null;
  };

  Engine.prototype.saveCustomer = function (data) {
    if (data.id) {
      const row = this.customer(data.id);
      if (!row) return null;
      ["name", "phone", "whatsapp", "address"].forEach((f) => {
        if (data[f] !== undefined) row[f] = data[f];
      });
      this.db.put("customers", row);
      return row;
    }
    const row = {
      id: this.db.nextId("customers"), name: data.name || "",
      phone: data.phone || "", whatsapp: data.whatsapp || "",
      address: data.address || "", due: 0,
    };
    this._t("customers").push(row);
    this.db.put("customers", row);
    return row;
  };

  /** Take a payment against a customer's credit.
   *  The balance moves RELATIVE to whatever it is right now, never written
   *  as an absolute figure — a credit sale made while the settle dialog sat
   *  open would otherwise be silently erased.  Returns the new balance. */
  Engine.prototype.settleDue = function (customer_id, amount, method, note, user_id) {
    amount = r2(amount);
    const c = this.customer(customer_id);
    if (!c) return 0;
    if (amount <= 0) return num(c.due);
    const row = {
      id: this.db.nextId("due_payments"), customer_id: customer_id,
      amount: amount, method: method || "Cash", note: note || "",
      paid_on: dayKey(), user_id: user_id || null, created_at: stamp(),
    };
    this._t("due_payments").push(row);
    this.db.put("due_payments", row);
    c.due = r2(Math.max(num(c.due) - amount, 0));
    this.db.put("customers", c);
    return c.due;
  };

  Engine.prototype.outstandingDue = function () {
    return r2(this._t("customers").reduce((s, c) => s + num(c.due), 0));
  };

  // ------------------------------------------------------------------- sales
  Engine.prototype.nextInvoiceNo = function () {
    const prefix = this.setting("invoice_prefix", "INV");
    const d = new Date();
    const stampStr = String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1, 2)
                   + pad(d.getDate(), 2);
    const today = dayKey();
    const count = this._t("sales").filter(
      (s) => s.kind !== "return" && dayOf(s) === today).length;
    return prefix + "-" + stampStr + "-" + pad(count + 1, 4);
  };

  Engine.prototype.createSale = function (sale, items) {
    const kind = sale.kind || "sale";
    const id = this.db.nextId("sales");
    const row = {
      id: id,
      invoice_no: sale.invoice_no || this.nextInvoiceNo(),
      kind: kind, status: "completed",
      ref_sale_id: sale.ref_sale_id || null,
      customer_id: sale.customer_id || null,
      customer_name: sale.customer_name || "Walk-in",
      customer_phone: sale.customer_phone || "",
      subtotal: r2(sale.subtotal), discount_amt: r2(sale.discount_amt),
      tax_percent: num(sale.tax_percent), tax_amt: r2(sale.tax_amt),
      delivery_charge: r2(sale.delivery_charge),
      grand_total: r2(sale.grand_total),
      paid_cash: r2(sale.paid_cash), paid_mobile: r2(sale.paid_mobile),
      mobile_method: sale.mobile_method || null,
      trx_id: sale.trx_id || null,
      change_due: r2(sale.change_due), due: r2(sale.due),
      payment_method: sale.payment_method || "Cash",
      note: sale.note || "", user_id: sale.user_id || null,
      created_at: sale.created_at || stamp(),
    };
    this._t("sales").push(row);
    this.db.put("sales", row);

    (items || []).forEach((it) => {
      const p = it.product_id ? this.product(it.product_id) : null;
      // Freeze the cost into the line.  Looking it up later would price
      // old sales at today's cost and bend every profit figure.
      const cost = it.cost !== undefined && it.cost !== null
        ? num(it.cost) : (p ? num(p.cost_price) : 0);
      const line = {
        id: this.db.nextId("sale_items"), sale_id: id,
        product_id: it.product_id || null, name: it.name || "",
        unit: it.unit || "pcs", qty: num(it.qty, 1), price: num(it.price),
        cost: cost, line_total: r2(it.line_total),
      };
      this._t("sale_items").push(line);
      this.db.put("sale_items", line);

      if (p) {
        const direction = kind === "return" ? 1 : -1;
        p.stock = r2(num(p.stock) + direction * num(it.qty, 0));
        this.db.put("products", p);
        this._move(p.id, direction * num(it.qty, 0), kind, row.invoice_no);
      }
    });

    if (row.customer_id && row.due > 0) {
      const c = this.customer(row.customer_id);
      if (c) { c.due = r2(num(c.due) + row.due); this.db.put("customers", c); }
    }
    return row;
  };

  Engine.prototype.sale = function (id) {
    return this._t("sales").find((s) => s.id === id) || null;
  };

  Engine.prototype.saleItems = function (sale_id) {
    return this._t("sale_items").filter((i) => i.sale_id === sale_id);
  };

  /** Cancel a sale and undo everything it did.
   *  A return already ADDED its goods back to the shelf, so voiding one
   *  has to take them off again — voiding both kinds the same way invents
   *  stock out of nothing.  The customer's balance comes back off too, or
   *  they keep being chased for a bill that no longer exists. */
  Engine.prototype.voidSale = function (id) {
    const head = this.sale(id);
    if (!head || head.status === "void") return;
    const direction = head.kind === "return" ? -1 : 1;
    this.saleItems(id).forEach((it) => {
      if (!it.product_id) return;
      const p = this.product(it.product_id);
      if (!p) return;
      const change = direction * num(it.qty);
      p.stock = r2(num(p.stock) + change);
      this.db.put("products", p);
      this._move(p.id, change, "void", head.invoice_no);
    });
    if (head.customer_id && num(head.due) > 0) {
      const c = this.customer(head.customer_id);
      if (c) {
        c.due = r2(Math.max(num(c.due) - num(head.due), 0));
        this.db.put("customers", c);
      }
    }
    head.status = "void";
    this.db.put("sales", head);
  };

  /** Record a return as a negative sale, so every report nets out on its
   *  own without a single query learning about a new concept. */
  Engine.prototype.createReturn = function (original, items, refund, method) {
    const prefix = this.setting("invoice_prefix", "INV");
    const d = new Date();
    const today = dayKey();
    const count = this._t("sales").filter(
      (s) => s.kind === "return" && dayOf(s) === today).length;
    const invoice = "RET-" + prefix + "-" + String(d.getFullYear()).slice(2)
      + pad(d.getMonth() + 1, 2) + pad(d.getDate(), 2) + "-" + pad(count + 1, 3);

    const total = r2(refund);
    const priced = (items || []).map((it) => ({
      product_id: it.product_id, name: it.name, unit: it.unit,
      qty: num(it.qty), price: -num(it.price),
      // Freeze the ORIGINAL line cost, or the goods come back at today's
      // cost price and the profit figure bends every time a cost changes.
      cost: num(it.cost),
      line_total: -r2(num(it.qty) * num(it.price)),
    }));

    return this.createSale({
      invoice_no: invoice, kind: "return", ref_sale_id: original.id,
      customer_id: original.customer_id, customer_name: original.customer_name,
      customer_phone: original.customer_phone,
      subtotal: -total, discount_amt: 0, tax_percent: 0, tax_amt: 0,
      delivery_charge: 0, grand_total: -total,
      paid_cash: method === "Cash" ? -total : 0,
      paid_mobile: method === "Cash" ? 0 : -total,
      mobile_method: method === "Cash" ? null : method,
      change_due: 0, due: 0, payment_method: method || "Cash",
      note: "Return against " + (original.invoice_no || ""),
    }, priced);
  };

  Engine.prototype.returnedQty = function (sale_id) {
    const out = {};

    const expected = r2(opening + r2(cash_sales) - r2(cash_refunds)
                        - cash_expenses + due_collected + agent_cash
                        - supplier_cash);

      cash_refunds: r2(cash_refunds), cash_expenses: cash_expenses,

    if (wallet && wallet !== "All") rows = rows.filter((w) => w.wallet === wallet);
    if (search) {

        (w.customer_number || "").indexOf(q) >= 0 ||
        (w.trx_id || "").toLowerCase().indexOf(q) >= 0 ||
        (w.customer_name || "").toLowerCase().indexOf(q) >= 0 ||

    const opening = this.settingFloat("wallet_open_" + wallet.toLowerCase(), 0);
    const moved = this._t("wallet_txns")
      .filter((w) => w.status === "ok" && w.wallet === wallet)
      .reduce((s, w) => s + num(w.ewallet_delta), 0);

  Engine.prototype.walletCashDelta = function (day) {

      .filter((w) => w.status === "ok" && dayOf(w) === day)
      .reduce((s, w) => s + num(w.cash_delta), 0));
  };

  Engine.prototype.walletSummary = function (start, end) {
    const by = {};
    this._t("wallet_txns")
      .filter((w) => w.status === "ok" && inRange(dayOf(w), start, end))
      .forEach((w) => {
        const b = by[w.wallet] || (by[w.wallet] = {
          wallet: w.wallet, count: 0, cash_in: 0, cash_out: 0, volume: 0,
          commission: 0, charge: 0, cash_delta: 0, ewallet_delta: 0 });
        b.count += 1;
        if (w.kind === "Cash In") b.cash_in += num(w.amount);
        if (w.kind === "Cash Out") b.cash_out += num(w.amount);
        b.volume += num(w.amount);
        b.commission += num(w.commission);
        b.charge += num(w.charge);
        b.cash_delta += num(w.cash_delta);
        b.ewallet_delta += num(w.ewallet_delta);

      .filter((w) => String(w.customer_number || "").replace(/\D/g, "").indexOf(tail) >= 0)
      .sort((a, b) => b.id - a.id).slice(0, limit || 50);

  Engine.prototype.totalsForDay = function (day) {

      revenue += num(s.grand_total);
      due += num(s.due);
      if (s.kind !== "return") orders += 1;   // a return is not an order
    });

  Engine.prototype.salesSeries = function (days) {
    days = days || 7;

      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      const key = dayKey(d);

      const sign = s.kind === "return" ? -1 : 1;

        const b = by[it.name] || (by[it.name] = { name: it.name, qty: 0, total: 0 });

    if (lang === "bn") {
      return (customer.name || "") + ", আসসালামু আলাইকুম।\n\n"
        + shop + " এ আপনার বাকি আছে " + money + "।\n"
        + "সুবিধামতো সময়ে পরিশোধ করলে কৃতজ্ঞ থাকব।\n\nধন্যবাদ।";
    }
    return (customer.name || "") + ", assalamu alaikum.\n\n"
      + "Your outstanding balance at " + shop + " is " + money + ".\n"
      + "We would be grateful if you could settle it at your convenience.\n\nThank you.";
  };

  E.prototype.waLink = function (phone, text) {
    const digits = String(phone || "").replace(/\D/g, "");
    if (!digits) return "";
    // Bangladeshi numbers are typed as 01XXXXXXXXX; WhatsApp needs 880…
    const intl = digits.length === 11 && digits.charAt(0) === "0"
      ? "88" + digits : (digits.length === 10 ? "880" + digits : digits);
    return "https://wa.me/" + intl + "?text=" + encodeURIComponent(text || "");
  };


  // ==================================================================
  //  বাকি — the credit book
  //
  //  A shopkeeper's real question is never "what is the balance".  It is
  //  "which sale is this money still sitting against, and how long has it
  //  been there".  So the ledger is rebuilt from the sales and the
  //  payments rather than read off the single running figure, and unpaid
  //  amounts are aged oldest-first the way a shopkeeper counts them.
  // ==================================================================

  /** Whole-day difference between two YYYY-MM-DD keys. */
  function daysApart(from, to) {
    if (!from || !to) return 0;
    const a = new Date(from + "T00:00:00");
    const b = new Date(to + "T00:00:00");
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.round((b - a) / 86400000);
  }

  /** Oldest still-unpaid credit sale, settling payments first-in-first-out. */
  function oldestUnpaid(entries) {
    const queue = [];
    entries.forEach(function (e) {
      if (e.kind === "sale") { queue.push({ day: e.day, left: e.amount }); return; }
      let pay = e.amount;
      while (pay > 0.004 && queue.length) {
        const head = queue[0];
        const take = Math.min(head.left, pay);
        head.left = r2(head.left - take);
        pay = r2(pay - take);
        if (head.left <= 0.004) queue.shift();
      }
    });
    return queue.length ? queue[0].day : "";
  }

  /** Every credit sale and every payment for one customer, oldest first,
   *  each carrying the balance as it stood right after that line. */
  E.prototype.dueLedger = function (customer_id) {
    const entries = [];
    this._t("sales").forEach(function (s) {
      if (s.customer_id !== customer_id) return;
      if (s.status !== "completed") return;
      if (num(s.due) <= 0.004) return;
      entries.push({
        kind: "sale", at: s.created_at || "", day: dayOf(s),
        label: s.invoice_no || "", amount: r2(num(s.due)),
        total: r2(num(s.grand_total)), sale_id: s.id,
      });
    });
    this._t("due_payments").forEach(function (p) {
      if (p.customer_id !== customer_id) return;
      entries.push({
        kind: "payment", at: p.created_at || (p.paid_on || "") + " 00:00:00",
        day: p.paid_on || "", label: p.method || "Cash",
        amount: r2(num(p.amount)), note: p.note || "",
      });
    });
    entries.sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    let bal = 0;
    entries.forEach(function (e) {
      bal = r2(bal + (e.kind === "sale" ? e.amount : -e.amount));
      e.balance = bal;
    });
    return entries;
  };

  /** One customer with everything the বাকি screen shows about them. */
  E.prototype.dueProfile = function (customer_id) {
    const c = this.customer(customer_id);
    if (!c) return null;
    const led = this.dueLedger(customer_id);
    const today = dayKey();
    let lastSale = "", lastPaid = "", charged = 0, paid = 0;
    led.forEach(function (e) {
      if (e.kind === "sale") { lastSale = e.day || lastSale; charged += e.amount; }
      else { lastPaid = e.day || lastPaid; paid += e.amount; }
    });
    const oldest = oldestUnpaid(led);
    return {
      row: c, due: r2(num(c.due)), ledger: led,
      charged: r2(charged), paid: r2(paid),
      last_sale: lastSale, last_paid: lastPaid,
      oldest: oldest, days: oldest ? daysApart(oldest, today) : 0,
    };
  };

  /** Everyone who still owes, biggest first (or oldest first). */
  E.prototype.dueCustomers = function (opts) {
    opts = opts || {};
    const self = this;
    const q = String(opts.search || "").trim().toLowerCase();
    const digits = q.replace(/\D/g, "");
    let rows = this._t("customers").filter(function (c) { return num(c.due) > 0.004; });
    if (q) {
      rows = rows.filter(function (c) {
        const phone = String(c.phone || "").replace(/\D/g, "");
        const wa = String(c.whatsapp || "").replace(/\D/g, "");
        return (c.name || "").toLowerCase().indexOf(q) >= 0 ||
               (digits.length >= 3 && (phone.indexOf(digits) >= 0 || wa.indexOf(digits) >= 0));
      });
    }
    const out = rows.map(function (c) { return self.dueProfile(c.id); });
    if (opts.sort === "old") out.sort(function (a, b) { return b.days - a.days; });
    else if (opts.sort === "name") {
      out.sort(function (a, b) {
        return (a.row.name || "").localeCompare(b.row.name || "");
      });
    } else out.sort(function (a, b) { return b.due - a.due; });
    return out;
  };

  /** Head-of-page figures for the বাকি screen. */
  E.prototype.dueSummary = function () {
    const list = this.dueCustomers();
    const month = dayKey().slice(0, 7);
    let collected = 0;
    this._t("due_payments").forEach(function (p) {
      if (String(p.paid_on || "").slice(0, 7) === month) collected += num(p.amount);
    });
    let old30 = 0, people30 = 0;
    list.forEach(function (c) { if (c.days >= 30) { old30 += c.due; people30 += 1; } });
    return {
      total: r2(list.reduce(function (s, c) { return s + c.due; }, 0)),
      people: list.length,
      collected_month: r2(collected),
      old30: r2(old30), people30: people30,
      biggest: list.length ? list[0] : null,
      list: list,
    };
  };

  /** Payments taken in a date range — for the reports screen. */
  E.prototype.duePaymentsBetween = function (start, end) {
    return this._t("due_payments").filter(function (p) {
      return inRange(String(p.paid_on || "").slice(0, 10), start, end);
    }).sort(function (a, b) { return String(b.paid_on).localeCompare(String(a.paid_on)); });
  };

  E.prototype.smsLink = function (phone, text) {
    return "sms:" + String(phone || "").replace(/[^\d+]/g, "")
      + "?body=" + encodeURIComponent(text || "");
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
/* =====================================================================
   store.js — where a shop's books actually live.

   IndexedDB, not localStorage.  localStorage caps out around 5 MB and a
   busy shop writes past that inside a year; it is also synchronous, so
   saving a sale would stutter the till.

   Each shop gets its OWN database ("pos_shop_<id>").  That keeps every
   query free of shop filtering, makes a backup exactly one shop's book,
   and means one shop's data can never leak into another's totals.  The
   list of shops is tiny, so it sits in localStorage.
   ===================================================================== */
(function (root) {
  "use strict";

  const SHOP_LIST_KEY = "pos_shops";
  const ACTIVE_KEY = "pos_active_shop";

  const TABLES = ["products", "sales", "sale_items", "stock_moves", "customers",
    "due_payments", "expenses", "wallet_txns", "day_close", "users",
    "suppliers", "purchases", "purchase_items", "supplier_payments",
    "held_bills", "photos"];

  // ------------------------------------------------------------ shop list
  function readShops() {
    try {
      const raw = localStorage.getItem(SHOP_LIST_KEY);
      const list = raw ? JSON.parse(raw) : null;
      if (list && list.length) return list;
    } catch (e) { /* storage blocked or corrupt — fall through */ }
    return [{ id: 1, name: (root.SHOP && root.SHOP.name) || "My shop" }];
  }

  function writeShops(list) {
    try { localStorage.setItem(SHOP_LIST_KEY, JSON.stringify(list)); }
    catch (e) { /* nothing we can do; the shop still works this session */ }
  }

  function activeShopId() {
    try {
      const v = parseInt(localStorage.getItem(ACTIVE_KEY), 10);
      if (v && readShops().some((s) => s.id === v)) return v;
    } catch (e) { /* ignore */ }
    return readShops()[0].id;
  }

  function setActiveShop(id) {
    try { localStorage.setItem(ACTIVE_KEY, String(id)); } catch (e) { /* ignore */ }
  }

  // ---------------------------------------------------------------- store
  function Store(shopId) {
    this.shopId = shopId;
    this.dbName = "pos_shop_" + shopId;
    this.idb = null;
    this.tables = {};
    this.seq = {};
    this._queue = {};      // table -> {id: row} waiting to be written
    this._timer = null;
    this._failed = false;
    TABLES.forEach((t) => { this.tables[t] = []; });
    this.tables.settings = {};
  }

  Store.prototype.open = function () {
    const self = this;
    return new Promise(function (resolve) {
      let req;
      try {
        req = indexedDB.open(self.dbName, 1);
      } catch (e) {
        // Private windows and locked-down browsers refuse IndexedDB.  The
        // app still has to open — it just cannot remember anything, and it
        // says so rather than pretending a sale was saved.
        self._failed = true;
        return resolve(self);
      }
      req.onupgradeneeded = function (ev) {
        const db = ev.target.result;
        TABLES.forEach(function (t) {
          if (!db.objectStoreNames.contains(t)) db.createObjectStore(t, { keyPath: "id" });
        });
        if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings");
      };
      req.onerror = function () { self._failed = true; resolve(self); };
      req.onsuccess = function (ev) {
        self.idb = ev.target.result;
        self._loadAll().then(function () { resolve(self); });
      };
    });
  };

  Store.prototype._loadAll = function () {
    const self = this;
    if (!self.idb) return Promise.resolve();
    const jobs = TABLES.map(function (name) {
      return new Promise(function (resolve) {
        try {
          const req = self.idb.transaction(name, "readonly").objectStore(name).getAll();
          req.onsuccess = function () {
            const rows = req.result || [];
            self.tables[name] = rows;
            let max = 0;
            rows.forEach(function (r) { if (r.id > max) max = r.id; });
            self.seq[name] = max;
            resolve();
          };
          req.onerror = function () { resolve(); };
        } catch (e) { resolve(); }
      });
    });
    jobs.push(new Promise(function (resolve) {
      try {
        const req = self.idb.transaction("settings", "readonly")
          .objectStore("settings").get("all");
        req.onsuccess = function () { self.tables.settings = req.result || {}; resolve(); };
        req.onerror = function () { resolve(); };
      } catch (e) { resolve(); }
    }));
    return Promise.all(jobs);
  };

  Store.prototype.nextId = function (table) {
    this.seq[table] = (this.seq[table] || 0) + 1;
    return this.seq[table];
  };

  /** Queue a row for writing.  Writes are batched on the next tick so a
   *  sale with ten lines is one transaction, not eleven. */
  Store.prototype.put = function (table, row) {
    if (this._failed) return;
    const bucket = this._queue[table] || (this._queue[table] = {});
    bucket[table === "settings" ? "all" : row.id] = row;
    if (!this._timer) {
      const self = this;
      this._timer = setTimeout(function () { self.flush(); }, 0);
    }
  };

  Store.prototype.flush = function () {
    this._timer = null;
    if (!this.idb || this._failed) return Promise.resolve();
    const queue = this._queue;
    this._queue = {};
    const names = Object.keys(queue);
    if (!names.length) return Promise.resolve();
    const self = this;
    return new Promise(function (resolve) {
      let tx;
      try { tx = self.idb.transaction(names, "readwrite"); }
      catch (e) { return resolve(); }
      names.forEach(function (name) {
        const store = tx.objectStore(name);
        const rows = queue[name];
        Object.keys(rows).forEach(function (key) {
          try {
            if (name === "settings") store.put(rows[key], "all");
            else store.put(rows[key]);
          } catch (e) { /* one bad row must not lose the rest */ }
        });
      });
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { resolve(); };
      tx.onabort = function () { resolve(); };
    });
  };

  Store.prototype.remove = function (table, id) {
    const list = this.tables[table];
    if (list) {
      const i = list.findIndex(function (r) { return r.id === id; });
      if (i >= 0) list.splice(i, 1);
    }
    if (!this.idb || this._failed) return;
    try { this.idb.transaction(table, "readwrite").objectStore(table).delete(id); }
    catch (e) { /* ignore */ }
  };

  // --------------------------------------------------------------- backup
  /** The whole book as one plain object — this is what the backup button
   *  writes to a file, and what restore reads back. */
  Store.prototype.exportAll = function () {
    const out = { format: "pos-backup", version: 1, shop: this.shopId,
                  saved_at: new Date().toISOString(), tables: {} };
    TABLES.forEach((t) => { out.tables[t] = this.tables[t]; });
    out.tables.settings = this.tables.settings;
    return out;
  };

  Store.prototype.importAll = function (data) {
    if (!data || data.format !== "pos-backup") throw new Error("not a backup file");
    const self = this;
    TABLES.forEach(function (t) {
      const rows = (data.tables && data.tables[t]) || [];
      self.tables[t] = rows;
      let max = 0;
      rows.forEach(function (r) { if (r.id > max) max = r.id; });
      self.seq[t] = max;
      rows.forEach(function (r) { self.put(t, r); });
    });
    self.tables.settings = (data.tables && data.tables.settings) || {};
    self.put("settings", self.tables.settings);
    return self.flush();
  };

  Store.prototype.wipe = function () {
    const self = this;
    TABLES.forEach(function (t) {
      self.tables[t] = [];
      self.seq[t] = 0;
      if (self.idb && !self._failed) {
        try { self.idb.transaction(t, "readwrite").objectStore(t).clear(); }
        catch (e) { /* ignore */ }
      }
    });
    self.tables.settings = {};
    self.put("settings", {});
    return self.flush();
  };

  /** How much room is left.  A shop that fills its quota stops being able
   *  to save sales, and the browser gives no warning of its own. */
  Store.prototype.quota = function () {
    if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
    return navigator.storage.estimate().then(function (est) {
      return { used: est.usage || 0, total: est.quota || 0 };
    }).catch(function () { return null; });
  };

  root.POSStore = {
    Store: Store, TABLES: TABLES,
    readShops: readShops, writeShops: writeShops,
    activeShopId: activeShopId, setActiveShop: setActiveShop,
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>

    "Density":"ঘনত্ব","Theme":"থিম","Language":"ভাষা","App":"অ্যাপ",
    "Receipt":"মেমো","Backup":"ব্যাকআপ","Save backup":"ব্যাকআপ নামান",
    "Restore backup":"ব্যাকআপ ফেরান","Shops":"দোকানসমূহ","Add shop":"দোকান যোগ",
    "Switch shop":"দোকান বদলান","Targets":"টার্গেট","Danger zone":"সাবধান",
    "Erase everything":"সব মুছে ফেলুন","Storage used":"জায়গা ব্যবহৃত",

  let lang = "bn";
  function t(s){ if(lang==="en") return s; return BN[s] || s; }
  function setLang(l){ lang = (l === "en") ? "en" : "bn";
    document.documentElement.lang = lang; }
  function isBn(){ return lang === "bn"; }
  const BND = "০১২৩৪৫৬৭৮৯";
  function bnDigits(s){ return String(s).replace(/[0-9]/g, d => BND[+d]); }
  root.T = t; root.setLang = setLang; root.isBn = isBn;
  root.bnDigits = bnDigits; root.BN_STRINGS = BN;
})(window);

<script>
/* ===================================================================
   app.js — the shell: boot, navigation, and the handful of helpers
   every screen leans on (money formatting, toasts, dialogs).
   =================================================================== */
(function (root) {
  "use strict";
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.prototype.slice.call((el || document).querySelectorAll(sel));

  /** Build an element without touching innerHTML, so a shop name or a
   *  customer's note can never turn into markup. */
  function el(tag, attrs, kids) {
    const node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;      // only ever our own markup
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), v);
      else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
      else node.setAttribute(k, v);
    });
    (Array.isArray(kids) ? kids : kids === undefined ? [] : [kids])
      .forEach(function (k) {
        if (k === null || k === undefined || k === false) return;
        node.appendChild(typeof k === "string" || typeof k === "number"
          ? document.createTextNode(String(k)) : k);
      });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  const App = {
    store: null, eng: null, view: "dashboard", user: null,
    _views: {}, _cache: {},
  };

  // ------------------------------------------------------------ money
  App.sym = function () {
    const c = App.eng.setting("currency", "BDT");
    return { BDT: "৳", USD: "$", INR: "₹", EUR: "€", GBP: "£" }[c] || "৳";
  };
  /** ASCII for the printer: a thermal head has no ৳ glyph and prints a box. */
  App.symAscii = function () {
    const c = App.eng.setting("currency", "BDT");
    return { BDT: "Tk", USD: "$", INR: "Rs.", EUR: "EUR", GBP: "GBP" }[c] || "Tk";
  };
  App.money = function (n, opts) {
    n = Number(n) || 0;
    const txt = Math.abs(n).toLocaleString("en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const body = (n < 0 ? "-" : "") + ((opts && opts.bare) ? "" : App.sym()) + txt;
    return (root.isBn() && App.eng.setting("bn_digits_ui", "1") === "1")
      ? root.bnDigits(body) : body;
  };
  App.qty = function (n) {
    const v = Number(n) || 0;
    const txt = (Math.round(v * 1000) / 1000).toString();
    return root.isBn() ? root.bnDigits(txt) : txt;
  };
  function asDate(s) {
    if (s instanceof Date) return s;
    // "2026-09-23 18:40:00" is not valid ISO in every browser, so swap the
    // separator — but only for that shape, never for a Date's own text.
    const str = String(s);
    return new Date(/^\d{4}-\d{2}-\d{2} /.test(str) ? str.replace(" ", "T") : str);
  }

  App.dateText = function (s) {
    if (!s) return "";
    const d = asDate(s);
    if (isNaN(d)) return String(s).slice(0, 10);
    const months = root.isBn()
      ? ["জানু","ফেব","মার্চ","এপ্রি","মে","জুন","জুলা","আগ","সেপ্ট","অক্টো","নভে","ডিসে"]
      : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const out = d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
    return root.isBn() ? root.bnDigits(out) : out;
  };
  App.timeText = function (s) {
    if (!s) return "";
    const d = asDate(s);
    if (isNaN(d)) return "";
    let h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    const out = h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
    return root.isBn() ? root.bnDigits(out) : out;
  };

  // ------------------------------------------------------------ toast
  App.toast = function (msg, kind) {
    const box = $("#toast");
    const node = el("div", { class: "toast " + (kind || ""), text: msg });
    box.appendChild(node);
    setTimeout(function () {
      node.style.transition = "opacity .25s"; node.style.opacity = "0";
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 260);
    }, kind === "bad" ? 4200 : 2400);
  };

  // ----------------------------------------------------------- dialog
  App.modal = function (opts) {
    const body = el("div", { class: "body" });
    const foot = el("footer");
    const veil = el("div", { class: "veil", onclick: function (e) {
      if (e.target === veil && opts.dismissable !== false) close();
    } });
    const box = el("div", { class: "modal" }, [
      el("header", {}, [
        el("h3", { text: opts.title || "" }),
        el("button", { class: "btn btn-ghost btn-icon", text: "✕",
                       title: root.T("Close"), onclick: function () { close(); } }),
      ]),
      body, foot,
    ]);
    veil.appendChild(box);
    document.body.appendChild(veil);
    function close() { if (veil.parentNode) veil.parentNode.removeChild(veil);
                       document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape" && opts.dismissable !== false) close(); }
    document.addEventListener("keydown", onKey);
    setTimeout(function () {
      const first = body.querySelector("input,select,textarea");
      if (first && !opts.noFocus) first.focus();
    }, 60);
    return { veil: veil, body: body, footer: foot, close: close };
  };

  App.confirm = function (title, message, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      const m = App.modal({ title: title, dismissable: true });
      m.body.appendChild(el("p", { class: "muted", text: message,
        style: { margin: "0", whiteSpace: "pre-line" } }));
      m.footer.appendChild(el("button", { class: "btn", text: root.T("Cancel"),
        onclick: function () { m.close(); resolve(false); } }));
      m.footer.appendChild(el("button", {
        class: "btn " + (opts.danger ? "btn-bad" : "btn-pri"),
        text: opts.ok || root.T("Yes"),
        onclick: function () { m.close(); resolve(true); } }));
    });
  };

  App.field = function (label, opts) {
    opts = opts || {};
    const tag = opts.type === "textarea" ? "textarea"
              : opts.type === "select" ? "select" : "input";
    const input = el(tag, { class: "inp",
      type: tag === "input" ? (opts.type || "text") : null,
      placeholder: opts.placeholder || "", value: opts.value !== undefined ? opts.value : "",
      inputmode: opts.inputmode || null, step: opts.step || null,
      min: opts.min !== undefined ? opts.min : null,
      accept: opts.accept || null, id: opts.id || null });
    if (tag === "textarea" && opts.value) input.value = opts.value;
    if (tag === "select" && opts.options) {
      opts.options.forEach(function (o) {
        const v = typeof o === "string" ? o : o.value;
        const t = typeof o === "string" ? o : o.label;
        input.appendChild(el("option", { value: v, text: t,
          selected: String(v) === String(opts.value) }));
      });
    }
    const wrap = el("div", { class: "field" + (opts.wide ? " grow" : ""),
                             style: opts.style || null },
      [label ? el("label", { text: label }) : null, input,
       opts.hint ? el("div", { class: "tiny faint", text: opts.hint }) : null]);
    wrap.input = input;
    wrap.val = function () { return input.value.trim(); };
    wrap.num = function (d) { const v = parseFloat(input.value);
                              return isFinite(v) ? v : (d || 0); };
    return wrap;
  };

  // ------------------------------------------------------- appearance
  /** Named looks, not just an accent colour.  Each one carries its own
   *  primary ramp and a second colour used for gradients and highlights,
   *  so switching actually changes the feel of the app rather than
   *  recolouring one button. */
  App.THEMES = {
    emerald: { bn: "পান্না",  en: "Emerald", pri: "#0f766e", d: "#0b5f58", l: "#2dd4bf",
               acc: "#7c3aed", dk: ["#14b8a6", "#0d9488", "#5eead4"] },
    indigo:  { bn: "নীল",     en: "Indigo",  pri: "#4338ca", d: "#3730a3", l: "#818cf8",
               acc: "#0ea5e9", dk: ["#818cf8", "#6366f1", "#a5b4fc"] },
    royal:   { bn: "বেগুনি",  en: "Royal",   pri: "#7e22ce", d: "#6b21a8", l: "#c084fc",
               acc: "#db2777", dk: ["#c084fc", "#a855f7", "#d8b4fe"] },
    ruby:    { bn: "লাল",     en: "Ruby",    pri: "#be123c", d: "#9f1239", l: "#fb7185",
               acc: "#7c3aed", dk: ["#fb7185", "#e11d48", "#fda4af"] },
    sunset:  { bn: "কমলা",    en: "Sunset",  pri: "#c2410c", d: "#9a3412", l: "#fb923c",
               acc: "#db2777", dk: ["#fb923c", "#ea580c", "#fdba74"] },
    forest:  { bn: "সবুজ",    en: "Forest",  pri: "#15803d", d: "#166534", l: "#4ade80",
               acc: "#0d9488", dk: ["#4ade80", "#22c55e", "#86efac"] },
    ocean:   { bn: "সাগর",    en: "Ocean",   pri: "#0369a1", d: "#075985", l: "#38bdf8",
               acc: "#06b6d4", dk: ["#38bdf8", "#0ea5e9", "#7dd3fc"] },
    gold:    { bn: "সোনালি",  en: "Gold",    pri: "#a16207", d: "#854d0e", l: "#facc15",
               acc: "#b45309", dk: ["#facc15", "#eab308", "#fde047"] },
  };

  /** light / dark / auto — auto follows the phone's own setting. */
  App.darkNow = function () {
    const mode = App.eng.setting("theme", "light");
    if (mode === "dark") return true;
    if (mode === "auto") {
      return !!(root.matchMedia && root.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    return false;
  };

  App.applyTheme = function () {
    const dark = App.darkNow();
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

    const key = App.eng.setting("accent", "emerald");
    const th = App.THEMES[key] || App.THEMES.emerald;
    const s = document.documentElement.style;
    if (dark) {
      s.setProperty("--pri", th.dk[0]);
      s.setProperty("--pri-d", th.dk[1]);
      s.setProperty("--pri-l", th.dk[2]);
    } else {
      s.setProperty("--pri", th.pri);
      s.setProperty("--pri-d", th.d);
      s.setProperty("--pri-l", th.l);
    }
    s.setProperty("--acc", th.acc);

    const size = App.eng.setting("text_size", "normal");
    s.setProperty("--fs",
      ({ small: "15px", normal: "16px", large: "18px", largest: "20px" })[size] || "16px");
    document.documentElement.setAttribute("data-density",
      App.eng.setting("density", "comfortable"));

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content",
      getComputedStyle(document.documentElement).getPropertyValue("--pri").trim());
  };

  /** The round swatches in Settings — you pick a look by seeing it. */
  App.themeSwatches = function () {
    const wrap = el("div", { class: "swatches" });
    Object.keys(App.THEMES).forEach(function (key) {
      const th = App.THEMES[key];
      const on = App.eng.setting("accent", "emerald") === key;
      wrap.appendChild(el("button", {
        class: "swatch" + (on ? " on" : ""),
        title: root.isBn() ? th.bn : th.en,
        onclick: function () {
          App.eng.setSetting("accent", key); App.applyTheme(); App.refresh();
        },
      }, [
        el("span", { class: "dot", style: {
          background: "linear-gradient(135deg," + th.l + "," + th.d + ")" } }),
        el("span", { class: "tiny", text: root.isBn() ? th.bn : th.en }),
      ]));
    });
    return wrap;
  };


  // ------------------------------------------------------ install app
  App.isStandalone = function () {
    return !!(root.matchMedia && root.matchMedia("(display-mode: standalone)").matches)
        || root.navigator.standalone === true;
  };
  App.isIOS = function () {
    return /iPad|iPhone|iPod/.test(root.navigator.userAgent || "")
        || (root.navigator.platform === "MacIntel" && root.navigator.maxTouchPoints > 1);
  };

  App.installApp = function () {
    if (App.installEvent) {
      const e = App.installEvent;
      App.installEvent = null;
      e.prompt();
      e.userChoice.then(function (r) {
        if (r && r.outcome !== "accepted") App.installEvent = e;
        if (App.refreshInstallBtn) App.refreshInstallBtn();
      });
      return;
    }
    // No prompt on offer — say plainly how this browser does it.
    const ios = App.isIOS();
    const bn = root.isBn();
    const steps = ios
      ? (bn ? ["নিচে (বা উপরে) শেয়ার বাটন ⬆ চাপুন",
               "লিস্ট থেকে “Add to Home Screen” বাছুন",
               "উপরে ডানে “Add” চাপুন"]
            : ["Tap the Share button", "Choose “Add to Home Screen”", "Tap “Add”"])
      : (bn ? ["ব্রাউজারের উপরে ডানে ⋮ (তিন ফোঁটা) চাপুন",
               "“Install app” বা “Add to Home screen” বাছুন",
               "“Install” চাপুন"]
            : ["Open the browser menu (⋮)", "Choose “Install app”", "Tap Install"]);
    const m = App.modal({ title: bn ? "অ্যাপ হিসেবে বসান" : "Install the app" });
    m.body.appendChild(el("p", { class: "muted", style: { marginTop: 0 },
      text: bn ? "বসালে হোম স্ক্রিনে আইকন হবে, ব্রাউজারের ঠিকানা লেখা থাকবে না, আর নেট ছাড়াই খুলবে।"
               : "It gets a home-screen icon, no address bar, and opens without internet." }));
    const ol = el("ol", { class: "steps" });
    steps.forEach(function (t) { ol.appendChild(el("li", { text: t })); });
    m.body.appendChild(ol);
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: root.T("Close"),
      onclick: m.close }));
  };

  // ------------------------------------------------------- top tools
  App.buildTools = function () {
    const box = $("#top-tools");
    if (!box) return;
    clear(box);

    box.appendChild(el("button", {
      class: "btn btn-ghost btn-icon",
      title: App.darkNow() ? root.T("Light") : root.T("Dark"),
      text: App.darkNow() ? "☀" : "☾",
      onclick: function () {
        App.eng.setSetting("theme", App.darkNow() ? "light" : "dark");
        App.applyTheme(); App.refresh();
      },
    }));

    const btn = el("button", {
      class: "btn btn-sm btn-pri installbtn",
      text: "⬇ " + (root.isBn() ? "অ্যাপ বসান" : "Install app"),
      onclick: App.installApp,
    });
    box.appendChild(btn);
    App.refreshInstallBtn = function () {
      const hide = App.isStandalone()
        || (!App.installEvent && !App.isIOS() && !/Chrome|Edg/i.test(root.navigator.userAgent || ""));
      btn.classList.toggle("hide", hide);
    };
    App.refreshInstallBtn();
  };

  // ------------------------------------------------------------- nav
  const NAV = [
    ["dashboard", "▦", "Dashboard"],
    ["till",      "🛒", "New sale"],
    ["products",  "📦", "Products"],
    ["dues",      "📕", "Dues"],
    ["customers", "👥", "Customers"],
    ["suppliers", "🚚", "Suppliers"],
    ["reports",   "📈", "Reports"],
    ["money",     "৳",  "Profit & cash"],
    ["agent",     "📱", "Mobile banking"],
    ["settings",  "⚙",  "Settings"],
  ];
  const TABS = [["dashboard", "▦", "Dashboard"], ["till", "🛒", "Sale"],
                ["dues", "📕", "Dues"], ["products", "📦", "Products"],
                ["more", "☰", "More"]];

  App.buildRail = function () {
    const rail = $("#rail");
    clear(rail);
    const shop = App.shopName();
    rail.appendChild(el("div", { class: "brand" }, [
      el("div", { class: "brand-mark", text: (shop || "?").trim().charAt(0) }),
      el("div", { class: "grow" }, [
        el("div", { class: "brand-name", text: shop, title: shop }),
        el("div", { class: "brand-sub", text: "POS " + (root.SHOP.build || "") }),
      ]),
    ]));
    const nav = el("nav", { id: "nav" });
    const hidden = App.hiddenScreens();
    NAV.forEach(function (n) {
      if (hidden.indexOf(n[0]) >= 0) return;
      const pip = App.navBadge(n[0]);
      nav.appendChild(el("button", {
        class: "navbtn" + (App.view === n[0] ? " on" : ""),
        onclick: function () { App.go(n[0]); document.body.classList.remove("drawer"); },
      }, [el("span", { class: "ic", text: n[1] }),
          el("span", { class: "lbl", text: root.T(n[2]) }),
          pip ? el("span", { class: "pip", text: pip }) : null]));
    });
    rail.appendChild(nav);
    rail.appendChild(el("div", { class: "rail-foot" }, [
      el("div", { text: root.SHOP.issued_to || root.SHOP.name }),
      el("div", { class: "tiny", text: root.T("Offline") === "Offline"
        ? "অফলাইন · নেট লাগে না" : "" }),
    ]));

    App.buildTools();

    const tabbar = $("#tabbar");
    clear(tabbar);
    TABS.forEach(function (n) {
      tabbar.appendChild(el("button", {
        class: (App.view === n[0] || (n[0] === "more" && NAV.slice(4)
                 .some(function (x) { return x[0] === App.view; }))) ? "on" : "",
        onclick: function () {
          if (n[0] === "more") document.body.classList.add("drawer");
          else App.go(n[0]);
        },
      }, [el("span", { class: "ic", text: n[1] }),
          el("span", { text: root.T(n[2]) })]));
    });
  };

  App.navBadge = function (key) {
    if (key === "products") { const n = App.eng.lowStock().length; return n ? n : 0; }
    if (key === "dues") { const n = App.eng.dueCustomers().length; return n ? n : 0; }
    return 0;
  };

  App.hiddenScreens = function () {
    const type = App.eng.setting("shop_type", "shop");
    if (type === "agent") return ["till", "products", "suppliers"];
    if (type === "shop") return ["agent"];
    return [];
  };

  App.shopName = function () {
    return root.SHOP.locked
      ? (root.isBn() ? root.SHOP.name : (root.SHOP.name_en || root.SHOP.name))
      : App.eng.setting("business_name", root.SHOP.name);
  };

  App.go = function (view, params) {
    App.view = view;
    App.params = params || {};
    App.buildRail();
    const page = $("#page");
    clear(page);
    $("#top-title").textContent = root.T(
      (NAV.find(function (n) { return n[0] === view; }) || [0, 0, "Dashboard"])[2]);
    const render = App._views[view];
    if (render) {
      try { render(page); }
      catch (err) {
        page.appendChild(el("div", { class: "empty" }, [
          el("div", { class: "big", text: "⚠" }),
          el("div", { text: "এই পাতায় সমস্যা হয়েছে: " + err.message }),
        ]));
        if (root.console) console.error(err);
      }
    }
    page.scrollIntoView ? window.scrollTo(0, 0) : null;
  };

  App.register = function (name, fn) { App._views[name] = fn; };
  App.refresh = function () { App.go(App.view, App.params); };

  App.weekday = function (day) {
    const d = asDate(day);
    if (isNaN(d)) return "";
    return (root.isBn()
      ? ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"]
      : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"])[d.getDay()];
  };

  App.el = el; App.$ = $; App.$$ = $$; App.clear = clear;
  root.App = App;
})(window);

<script>
/* =================================================================
   Dashboard — what the owner wants at a glance, plus the one search
   box that answers "who is this number and what do they owe me?"
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  function tile(k, v, s, tone) {
    return el("div", { class: "tile" }, [
      el("div", { class: "k", text: T(k) }),
      el("div", { class: "v", text: v, style: tone ? { color: "var(--" + tone + ")" } : null }),
      s ? el("div", { class: "s", text: s }) : null,
    ]);
  }

  function chart(series) {
    const peak = Math.max.apply(null, series.map(function (d) { return d.total; }).concat([1]));
    return el("div", { class: "row", style: { alignItems: "flex-end", gap: "8px",
      height: "150px", padding: "8px 2px 0" } },
      series.map(function (d) {
        const h = Math.max(Math.round((d.total / peak) * 118), 3);
        const label = A.weekday(d.day + "T00:00");
        return el("div", { class: "grow", style: { display: "flex",
          flexDirection: "column", alignItems: "center", gap: "6px", minWidth: "0" } }, [
          el("div", { class: "tiny faint nowrap",
            text: d.total ? A.money(d.total, { bare: true }).split(".")[0] : "" }),
          el("div", { title: A.money(d.total), style: { width: "100%", height: h + "px",
            borderRadius: "6px 6px 2px 2px",
            background: "linear-gradient(180deg,var(--pri-l),var(--pri))" } }),
          el("div", { class: "tiny faint", text: label }),
        ]);
      }));
  }

  function targetBar(label, t) {
    if (!t.target) return null;
    const pct = Math.round(t.pct * 100);
    return el("div", { class: "stack", style: { gap: "6px" } }, [
      el("div", { class: "spread" }, [
        el("span", { class: "small muted", text: T(label) }),
        el("span", { class: "small", text: A.money(t.done) + " / " + A.money(t.target) }),
      ]),
      el("div", { class: "bar" }, [el("i", { style: { width: Math.min(pct, 100) + "%",
        background: pct >= 100 ? "var(--ok)" : "var(--pri)" } })]),
      el("div", { class: "tiny faint", text: (root.isBn() ? root.bnDigits(pct) : pct) + "%" }),
    ]);
  }

  // ------------------------------------------------------------ search
  function searchPanel() {
    const results = el("div", { class: "stack", style: { marginTop: "12px" } });
    const box = A.field("", { placeholder: T("Search a number, name, invoice or TrxID"),
      inputmode: "search", wide: true });
    box.input.setAttribute("autocomplete", "off");

    let timer = null;
    box.input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(run, 160);
    });

    function run() {
      A.clear(results);
      const q = box.val();
      if (q.length < 2) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Type a phone number to see who it is and what they owe") }));
        return;
      }
      const hit = A.eng.lookup(q);
      const total = hit.customers.length + hit.sales.length + hit.products.length
                  + hit.wallet.length;
      if (!total) {
        results.appendChild(el("div", { class: "tiny faint", text: T("Nothing here yet") }));
        return;
      }
      hit.customers.slice(0, 6).forEach(function (c) {
        results.appendChild(customerCard(c));
      });
      if (hit.products.length) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Products") + " · " + hit.products.length }));
        hit.products.slice(0, 5).forEach(function (p) {
          results.appendChild(el("button", { class: "card card-pad spread",
            style: { textAlign: "left", width: "100%" },
            onclick: function () { A.go("products", { search: p.name }); } }, [
            el("div", { class: "grow" }, [
              el("div", { style: { fontWeight: "700" }, text: p.name }),
              el("div", { class: "tiny faint",
                text: T("Stock") + " " + A.qty(p.stock) + " " + (p.unit || "") }),
            ]),
            el("div", { style: { fontWeight: "800", color: "var(--pri)" },
              text: A.money(p.sale_price) }),
          ]));
        });
      }
      if (hit.sales.length) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Invoice") + " · " + hit.sales.length }));
        hit.sales.slice(0, 5).forEach(function (s) {
          results.appendChild(el("button", { class: "card card-pad spread",
            style: { textAlign: "left", width: "100%" },
