            : ["Open the browser menu (⋮)", "Choose \u201cInstall app\u201d", "Tap Install"]);
    m.body.appendChild(el("p", { class: "muted", style: { marginTop: 0 },
      text: bn ? "বসালে হোম স্ক্রিনে আইকন হবে, ব্রাউজারের ঠিকানা লেখা থাকবে না, আর নেট ছাড়াই খুলবে।"
               : "It gets a home-screen icon, no address bar, and opens without internet." }));
    const ol = el("ol", { class: "steps" });
    steps.forEach(function (t) { ol.appendChild(el("li", { text: t })); });
    m.body.appendChild(ol);
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: root.T("Close"),
      onclick: m.close }));
  };

  // ------------------------------------------------------- top tools
  App.buildTools = function () {
    const box = $("#top-tools");
    if (!box) return;
    clear(box);

    const nightBtn = el("button", {
      class: "btn btn-ghost btn-icon",
      title: App.darkNow() ? root.T("Light") : root.T("Dark"),
      onclick: function () {
        App.eng.setSetting("theme", App.darkNow() ? "light" : "dark");
        App.applyTheme(); App.refresh();
      },
    });
    nightBtn.appendChild(App.icon(App.darkNow() ? "sun" : "moon"));
    box.appendChild(nightBtn);

    const btn = el("button", {
      class: "btn btn-sm btn-pri installbtn", onclick: App.installApp,
    }, [App.icon("download"),
        el("span", { text: root.isBn() ? "অ্যাপ বসান" : "Install app" })]);
    box.appendChild(btn);
    App.refreshInstallBtn = function () {
      const hide = App.isStandalone()
        || (!App.installEvent && !App.isIOS() && !/Chrome|Edg/i.test(root.navigator.userAgent || ""));
      btn.classList.toggle("hide", hide);
    };
    App.refreshInstallBtn();
  };

  // ------------------------------------------------------------- nav
  const NAV = [
    ["dashboard", "dashboard", "Dashboard"],
    ["till",      "till",      "New sale"],
    ["products",  "products",  "Products"],
    ["dues",      "dues",      "Dues"],
    ["customers", "customers", "Customers"],
    ["suppliers", "suppliers", "Suppliers"],
    ["reports",   "reports",   "Reports"],
    ["money",     "money",     "Profit & cash"],
    ["agent",     "agent",     "Mobile banking"],
    ["settings",  "settings",  "Settings"],
  ];
  const TABS = [["dashboard", "dashboard", "Dashboard"], ["till", "till", "Sale"],
                ["dues", "dues", "Dues"], ["products", "products", "Products"],
                ["more", "more", "More"]];

  App.buildRail = function () {
    const rail = $("#rail");
    clear(rail);
    const shop = App.shopName();
    rail.appendChild(el("div", { class: "brand" }, [
      el("div", { class: "brand-mark", text: (shop || "?").trim().charAt(0) }),
      el("div", { class: "grow" }, [
        el("div", { class: "brand-name", text: shop, title: shop }),
        el("div", { class: "brand-sub", text: "POS " + (root.SHOP.build || "") }),
      ]),
    ]));
    const nav = el("nav", { id: "nav" });
    const hidden = App.hiddenScreens();
    NAV.forEach(function (n) {
      if (hidden.indexOf(n[0]) >= 0) return;
      const pip = App.navBadge(n[0]);
      nav.appendChild(el("button", {
        class: "navbtn" + (App.view === n[0] ? " on" : ""),
        onclick: function () { App.go(n[0]); document.body.classList.remove("drawer"); },
      }, [el("span", { class: "ic" }, [App.icon(n[1])]),
          el("span", { class: "lbl", text: root.T(n[2]) }),
          pip ? el("span", { class: "pip", text: pip }) : null]));
    });
    rail.appendChild(nav);
    rail.appendChild(el("div", { class: "rail-foot" }, [
      el("div", { text: root.SHOP.issued_to || root.SHOP.name }),
      el("div", { class: "tiny", text: root.T("Offline") === "Offline"
        ? "অফলাইন · নেট লাগে না" : "" }),
    ]));

    App.buildTools();

    const tabbar = $("#tabbar");
    clear(tabbar);
    TABS.forEach(function (n) {
      tabbar.appendChild(el("button", {
        class: (App.view === n[0] || (n[0] === "more" && NAV.slice(4)
                 .some(function (x) { return x[0] === App.view; }))) ? "on" : "",
        onclick: function () {
          if (n[0] === "more") document.body.classList.add("drawer");
          else App.go(n[0]);
        },
      }, [el("span", { class: "ic" }, [App.icon(n[1])]),
          el("span", { text: root.T(n[2]) })]));
    });
  };

  App.navBadge = function (key) {
    if (key === "products") { const n = App.eng.lowStock().length; return n ? n : 0; }
    if (key === "dues") { const n = App.eng.dueCustomers().length; return n ? n : 0; }
    return 0;
  };

  App.hiddenScreens = function () {
    const type = App.eng.setting("shop_type", "shop");
    if (type === "agent") return ["till", "products", "suppliers"];
    if (type === "shop") return ["agent"];
    return [];
  };

  App.shopName = function () {
    return root.SHOP.locked
      ? (root.isBn() ? root.SHOP.name : (root.SHOP.name_en || root.SHOP.name))
      : App.eng.setting("business_name", root.SHOP.name);
  };

  App.go = function (view, params) {
    App.view = view;
    App.params = params || {};
    App.buildRail();
    const page = $("#page");
    clear(page);
    $("#top-title").textContent = root.T(
      (NAV.find(function (n) { return n[0] === view; }) || [0, 0, "Dashboard"])[2]);
    const render = App._views[view];
    if (render) {
      try { render(page); }
      catch (err) {
        page.appendChild(el("div", { class: "empty" }, [
          el("div", { class: "big", text: "⚠" }),
          el("div", { text: "এই পাতায় সমস্যা হয়েছে: " + err.message }),
        ]));
        if (root.console) console.error(err);
      }
    }
    if (!App._keeping) window.scrollTo(0, 0);
  };

  App.register = function (name, fn) { App._views[name] = fn; };
  /** Redraw the current screen in place: same scroll, same caret. */
  App.refresh = function () {
    App._keeping = true;
    try { App.keepFocus(function () { App.go(App.view, App.params); }); }
    finally { App._keeping = false; }
  };

  App.weekday = function (day) {
    const d = asDate(day);
    if (isNaN(d)) return "";
    return (root.isBn()
      ? ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"]
      : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"])[d.getDay()];
  };

  App.el = el; App.$ = $; App.$$ = $$; App.clear = clear;
  root.App = App;
})(window);
</script>
<script>
/* =================================================================
   Dashboard — what the owner wants at a glance, plus the one search
   box that answers "who is this number and what do they owe me?"
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  function tile(k, v, s, tone) {
    return el("div", { class: "tile" }, [
      el("div", { class: "k", text: T(k) }),
      el("div", { class: "v", text: v, style: tone ? { color: "var(--" + tone + ")" } : null }),
      s ? el("div", { class: "s", text: s }) : null,
    ]);
  }

  /* ---------------------------------------------------------- chart
     Drawn as SVG rather than stacked divs: gridlines and value labels
     need to sit at exact heights, and a shop laptop is often scaled to
     125%, where rounded pixel heights visibly disagree. */
  const SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids) {
    const n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function svText(x, y, text, cls, anchor) {
    const t = sv("text", { x: x, y: y, class: cls || "", "text-anchor": anchor || "middle" });
    t.textContent = text;
    return t;
  }
  /** 1,250 -> ১.২k — an axis label has to fit, not be exact. */
  function shortMoney(n) {
    n = Number(n) || 0;
    let out;
    if (n >= 100000) out = (n / 100000).toFixed(n >= 1000000 ? 0 : 1) + "L";
    else if (n >= 1000) out = (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k";
    else out = String(Math.round(n));
    out = out.replace(".0", "");
    return root.isBn() ? root.bnDigits(out) : out;
  }

  function chart(series) {
    const W = 360, H = 168, L = 34, R = 6, TOP = 14, B = 26;
    const peak = Math.max.apply(null, series.map(function (d) { return d.total; }).concat([1]));
    // round the top up to something a person would say out loud
    const step = Math.pow(10, Math.floor(Math.log(peak) / Math.LN10));
    const top = Math.ceil(peak / (step / 2)) * (step / 2) || 1;
    const plotH = H - TOP - B, plotW = W - L - R;
    const slot = plotW / series.length;
    const bw = Math.min(slot * 0.56, 26);
    const today = new Date().toISOString().slice(0, 10);

    const kids = [];
    // gridlines, drawn first so the bars sit on top of them
    [0, 0.5, 1].forEach(function (f) {
      const y = TOP + plotH * (1 - f);
      kids.push(sv("line", { x1: L, x2: W - R, y1: y, y2: y,
        class: f === 0 ? "gl gl-base" : "gl" }));
      kids.push(svText(L - 7, y + 4, shortMoney(top * f), "gl-t", "end"));
    });

    series.forEach(function (d, i) {
      const x = L + slot * i + (slot - bw) / 2;
      const h = Math.max((d.total / top) * plotH, d.total > 0 ? 3 : 0);
      const y = TOP + plotH - h;
      const isToday = String(d.day).slice(0, 10) === today;
      if (h) {
        kids.push(sv("rect", { x: x, y: y, width: bw, height: h, rx: Math.min(bw / 2.6, 7),
          class: "bar-r" + (isToday ? " on" : "") }));
      } else {
        kids.push(sv("rect", { x: x, y: TOP + plotH - 3, width: bw, height: 3, rx: 1.5,
          class: "bar-r empty" }));
      }
      if (d.total) {
        kids.push(svText(x + bw / 2, y - 5, shortMoney(d.total), "bar-v"));
      }
      kids.push(svText(x + bw / 2, H - 8, A.weekday(d.day + "T00:00"),
        "bar-d" + (isToday ? " on" : "")));
    });

    const svg = sv("svg", { viewBox: "0 0 " + W + " " + H, class: "chart",
      role: "img" }, kids);
    return svg;
  }

  function targetBar(label, t) {
    if (!t.target) return null;
    const pct = Math.round(t.pct * 100);
    return el("div", { class: "stack", style: { gap: "6px" } }, [
      el("div", { class: "spread" }, [
        el("span", { class: "small muted", text: T(label) }),
        el("span", { class: "small", text: A.money(t.done) + " / " + A.money(t.target) }),
      ]),
      el("div", { class: "bar" }, [el("i", { style: { width: Math.min(pct, 100) + "%",
        background: pct >= 100 ? "var(--ok)" : "var(--pri)" } })]),
      el("div", { class: "tiny faint", text: (root.isBn() ? root.bnDigits(pct) : pct) + "%" }),
    ]);
  }

  // ------------------------------------------------------------ search
  function searchPanel() {
    const results = el("div", { class: "stack", style: { marginTop: "12px" } });
    const box = A.field("", { placeholder: T("Search a number, name, invoice or TrxID"),
      inputmode: "search", wide: true });
    box.input.classList.add("bigsearch");
    box.input.setAttribute("autocomplete", "off");

    let timer = null;
    box.input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(run, 160);
    });

    function run() {
      A.clear(results);
      const q = box.val();
      if (q.length < 2) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Type a phone number to see who it is and what they owe") }));
        return;
      }
      const hit = A.eng.lookup(q);
      const total = hit.customers.length + hit.sales.length + hit.products.length
                  + hit.wallet.length;
      if (!total) {
        results.appendChild(el("div", { class: "tiny faint", text: T("Nothing here yet") }));
        return;
      }
      hit.customers.slice(0, 6).forEach(function (c) {
        results.appendChild(customerCard(c));
      });
      if (hit.products.length) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Products") + " · " + hit.products.length }));
        hit.products.slice(0, 5).forEach(function (p) {
          results.appendChild(el("button", { class: "card card-pad spread",
            style: { textAlign: "left", width: "100%" },
            onclick: function () { A.go("products", { search: p.name }); } }, [
            el("div", { class: "grow" }, [
              el("div", { style: { fontWeight: "700" }, text: p.name }),
              el("div", { class: "tiny faint",
                text: T("Stock") + " " + A.qty(p.stock) + " " + (p.unit || "") }),
            ]),
            el("div", { style: { fontWeight: "800", color: "var(--pri)" },
              text: A.money(p.sale_price) }),
          ]));
        });
      }
      if (hit.sales.length) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Invoice") + " · " + hit.sales.length }));
        hit.sales.slice(0, 5).forEach(function (s) {
          results.appendChild(el("button", { class: "card card-pad spread",
            style: { textAlign: "left", width: "100%" },
            onclick: function () { A.showSale && A.showSale(s); } }, [
            el("div", { class: "grow" }, [
              el("div", { style: { fontWeight: "700" }, text: s.invoice_no }),
              el("div", { class: "tiny faint", text: A.dateText(s.created_at) + " · "
                + (s.customer_name || T("Walk-in")) }),
            ]),
            el("div", { style: { fontWeight: "800" }, text: A.money(s.grand_total) }),
          ]));
        });
      }
      if (hit.wallet.length) {
        results.appendChild(el("div", { class: "tiny faint",
          text: T("Mobile banking") + " · " + hit.wallet.length }));
        hit.wallet.slice(0, 5).forEach(function (w) {
          results.appendChild(el("div", { class: "card card-pad spread" }, [
            el("div", { class: "grow" }, [
              el("div", { style: { fontWeight: "700" },
                text: T(w.kind) + " · " + w.wallet }),
              el("div", { class: "tiny faint",
                text: w.customer_number + " · " + A.dateText(w.created_at) }),
            ]),
            el("div", { style: { fontWeight: "800" }, text: A.money(w.amount) }),
          ]));
        });
      }
    }

    run();
    const panel = el("div", { class: "card searchhero flat" }, [
      el("span", { class: "hero-ico" }, [A.icon("search")]), box,
    ]);
    return el("div", { class: "stack", style: { gap: "0" } }, [panel, results]);
  }

  function customerCard(c) {
    const row = c.row;
    const owes = c.due > 0;
    const phone = row.whatsapp || row.phone;
    const text = A.eng.reminderText(row, root.isBn() ? "bn" : "en");
    return el("div", { class: "card card-pad stack custcard", style: { gap: "10px",
      borderColor: owes ? "color-mix(in srgb,var(--warn) 45%,transparent)" : null } }, [
      el("div", { class: "spread" }, [
        el("div", { class: "grow" }, [
          el("div", { style: { fontWeight: "800", fontSize: "1.05rem" }, text: row.name }),
          el("div", { class: "tiny faint", text: [row.phone, row.address]
            .filter(Boolean).join(" · ") }),
        ]),
        el("div", { class: "right" }, [
          el("div", { class: "tiny faint", text: T("Outstanding") }),
          el("div", { style: { fontWeight: "800", fontSize: "1.25rem",
            color: owes ? "var(--warn)" : "var(--ok)" }, text: A.money(c.due) }),
        ]),
      ]),
      el("div", { class: "row tiny faint", style: { gap: "14px" } }, [
        el("span", { text: A.qty(c.orders) + " " + T("orders") }),
        el("span", { text: T("spent") + " " + A.money(c.spent) }),
        c.last_at ? el("span", { text: T("last") + " " + A.dateText(c.last_at) }) : null,
      ]),
      el("div", { class: "row", style: { gap: "8px" } }, [
        phone && owes ? el("a", { class: "btn btn-ok btn-sm",
          href: A.eng.waLink(phone, text), target: "_blank", rel: "noopener",
          text: T("Remind on WhatsApp") }) : null,
        phone && owes ? el("a", { class: "btn btn-sm",
          href: A.eng.smsLink(phone, text), text: T("Send SMS") }) : null,
        el("button", { class: "btn btn-sm", text: T("Settle due"),
          onclick: function () { A.settleDue && A.settleDue(row); } }),
      ]),
    ]);
  }

  // ------------------------------------------------------------- view
  A.register("dashboard", function (page) {
    const e = A.eng;
    const today = e.totalsForDay();
    const low = e.lowStock();
    const prog = e.targetProgress();
    const greet = (function () {
      const h = new Date().getHours();
      if (h < 12) return root.isBn() ? "সুপ্রভাত" : "Good morning";
      if (h < 17) return root.isBn() ? "শুভ অপরাহ্ন" : "Good afternoon";
      return root.isBn() ? "শুভ সন্ধ্যা" : "Good evening";
    })();

    const saleBtn = el("button", { class: "btn btn-lg hero-cta",
      onclick: function () { A.go("till"); } },
      [A.icon("till"), el("span", { text: T("New sale") })]);

    page.appendChild(el("div", { class: "card hero" }, [
      el("div", { class: "hero-top" }, [
        el("div", { class: "grow" }, [
          el("div", { class: "hero-greet", text: greet + "," }),
          el("h2", { class: "hero-shop", text: A.shopName() }),
          el("div", { class: "hero-date", text: A.dateText(new Date()) }),
        ]),
        saleBtn,
      ]),
      el("div", { class: "hero-figs" }, [
        el("div", { class: "hero-fig" }, [
          el("div", { class: "hero-k", text: T("Today's sales") }),
          el("div", { class: "hero-v", text: A.money(today.revenue) }),
        ]),
        el("div", { class: "hero-sep" }),
        el("div", { class: "hero-fig" }, [
          el("div", { class: "hero-k", text: T("Orders today") }),
          el("div", { class: "hero-v sm", text: A.qty(today.orders) }),
        ]),
        el("div", { class: "hero-sep" }),
        el("div", { class: "hero-fig" }, [
          el("div", { class: "hero-k", text: root.isBn() ? "গড় বিল" : "Average bill" }),
          el("div", { class: "hero-v sm", text: today.orders
            ? A.money(today.revenue / today.orders) : "—" }),
        ]),
      ]),
    ]));

    page.appendChild(el("div", { class: "grid tiles3",
      style: { marginTop: "var(--gap)" } }, [
      tile("Outstanding due", A.money(e.outstandingDue()),
        root.isBn() ? "সব কাস্টমার মিলিয়ে" : "across all customers",
        e.outstandingDue() > 0 ? "warn" : null),
      tile("Payable to suppliers", A.money(e.totalPayable()),
        root.isBn() ? "আপনার দেনা" : "what you owe",
        e.totalPayable() > 0 ? "bad" : null),
      tile("Low stock", A.qty(low.length),
        low.length ? low[0].name : (root.isBn() ? "সব ঠিক আছে" : "all stocked"),
        low.length ? "warn" : "ok"),
    ]));

    page.appendChild(searchPanel());

    const cols = el("div", { class: "grid",
      style: { gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))",
               marginTop: "var(--gap)" } });

    const bars = [targetBar("Daily target", prog.daily),
                  targetBar("Monthly target", prog.monthly)].filter(Boolean);
    if (bars.length) {
      cols.appendChild(el("div", { class: "card card-pad stack" },
        [el("h3", { class: "sec", text: T("Targets") })].concat(bars)));
    }

    cols.appendChild(el("div", { class: "card card-pad" }, [
      el("h3", { class: "sec", text: T("Last 7 days") }),
      chart(e.salesSeries(7)),
    ]));

    const top = e.topProducts(6, 30);
    cols.appendChild(el("div", { class: "card card-pad" }, [
      el("h3", { class: "sec", text: T("Best sellers") }),
      top.length ? el("div", { class: "stack", style: { gap: "10px" } },
        top.map(function (p) {
          const peak = Math.max.apply(null, top.map(function (x) { return x.total; }).concat([1]));
          return el("div", { class: "rankrow" }, [
            el("span", { class: "rank", text: root.isBn()
              ? root.bnDigits(String(top.indexOf(p) + 1)) : String(top.indexOf(p) + 1) }),
            el("span", { class: "grow" }, [
              el("div", { class: "spread small" }, [
                el("span", { class: "grow nowrap", style: { overflow: "hidden",
                  textOverflow: "ellipsis", fontWeight: "600" }, text: p.name }),
                el("span", { class: "muted nowrap tiny", text: A.qty(p.qty) }),
              ]),
              el("div", { class: "bar", style: { marginTop: "5px" } }, [el("i", { style: {
                width: Math.max((p.total / peak) * 100, 2) + "%" } })]),
            ]),
          ]);
        })) : el("div", { class: "tiny faint", text: T("Nothing here yet") }),
    ]));

    if (low.length) {
      cols.appendChild(el("div", { class: "card card-pad" }, [
        el("h3", { class: "sec", text: T("Low stock") }),
        el("div", { class: "stack", style: { gap: "8px" } }, low.slice(0, 8).map(function (p) {
          return el("button", { class: "spread small", style: { width: "100%",
            textAlign: "left" }, onclick: function () { A.restock && A.restock(p); } }, [
            el("span", { class: "grow nowrap", style: { overflow: "hidden",
              textOverflow: "ellipsis" }, text: p.name }),
            el("span", { class: "chip chip-warn",
              text: A.qty(p.stock) + " " + (p.unit || "") }),
          ]);
        })),
      ]));
    }
    page.appendChild(cols);
  });
})(window);
</script>
<script>
/* =================================================================
   The till.  Everything a sale needs on one screen, and nothing else.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;
  const r2 = root.POSEngine.helpers.r2;

  const cart = { lines: [], customer: null, discount: "", discountPct: false,
                 tax: "", delivery: "", cash: "", mobile: "", wallet: "bKash", trx: "" };
  A.cart = cart;

  function lineTotal(l) { return r2(Math.max(l.qty, 0) * Math.max(l.price, 0)); }


  /** 01XXXXXXXXX typed into a money box.  Eleven digits starting 01 is a
   *  Bangladeshi mobile number and never a plausible bill. */
  function looksLikePhone(v) {
    const d = String(v || "").replace(/\D/g, "");
    return d.length === 11 && d.slice(0, 2) === "01";
  }

  function compute() {
    let subtotal = 0;
    cart.lines.forEach(function (l) { subtotal += lineTotal(l); });
    subtotal = r2(subtotal);
    const dNum = Math.max(parseFloat(cart.discount) || 0, 0);
    let disc = cart.discountPct ? r2(subtotal * dNum / 100) : r2(dNum);
    disc = Math.min(Math.max(disc, 0), subtotal);
    const taxable = r2(subtotal - disc);
    // a negative tax is a discount in disguise
    const taxPct = Math.max(parseFloat(cart.tax) || 0, 0);
    const taxAmt = r2(taxable * taxPct / 100);
    const delivery = Math.max(parseFloat(cart.delivery) || 0, 0);
    const grand = r2(taxable + taxAmt + delivery);
    const cash = Math.max(parseFloat(cart.cash) || 0, 0);
    const mobile = Math.max(parseFloat(cart.mobile) || 0, 0);
    const paid = r2(cash + mobile);
    // Change comes out of the drawer, so it can only be given against cash
    // actually handed over — overpaying by bKash is not a reason to hand
    // out notes.
    const change = r2(Math.min(Math.max(paid - grand, 0), cash));
    const due = r2(Math.max(grand - paid, 0));
    const method = (mobile && cash) ? "Split" : mobile ? cart.wallet : "Cash";
    return { subtotal: subtotal, discount_amt: disc, tax_percent: taxPct,
             tax_amt: taxAmt, delivery_charge: delivery, grand_total: grand,
             paid_cash: cash, paid_mobile: mobile, paid: paid,
             change_due: change, due: due, payment_method: method,
             mobile_method: mobile ? cart.wallet : null,
             trx_id: cart.trx.trim() || null };
  }
  A.cartCompute = compute;

  function addProduct(p, qty) {
    qty = qty || 1;
    const inCart = cart.lines.filter(function (l) { return l.product_id === p.id; })
      .reduce(function (s, l) { return s + l.qty; }, 0);
    if (inCart + qty > Number(p.stock || 0)) {
      // Selling from an uncounted sack is normal here, so this warns rather
      // than blocks — but it must SAY so, or the reorder list becomes fiction.
      A.toast(T("Only") + " " + A.qty(p.stock) + " " + (p.unit || "") + " "
              + T("left in stock"), "warn");
    }
    const found = cart.lines.find(function (l) { return l.product_id === p.id; });
    if (found) found.qty = r2(found.qty + qty);
    else cart.lines.push({ product_id: p.id, name: p.name, unit: p.unit,
                           qty: qty, price: Number(p.sale_price) || 0,
                           cost: Number(p.cost_price) || 0 });
    paint();
  }
  A.addToCart = addProduct;

  let picker = null, cartBox = null, state = { search: "", cat: "" };

  function paintPicker() {
    A.clear(picker);
    const cats = A.eng.categories();
    if (cats.length) {
      const seg = el("div", { class: "seg", style: { marginBottom: "10px" } });
      [""].concat(cats).forEach(function (c) {
        seg.appendChild(el("button", { class: state.cat === c ? "on" : "",
          text: c || T("All"), onclick: function () { state.cat = c; paintPicker(); } }));
      });
      picker.appendChild(seg);
    }
    const list = A.eng.products({ search: state.search, category: state.cat });
    if (!list.length) {
      picker.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "📦" }),
        el("div", { text: T("Nothing here yet") }),
        el("button", { class: "btn btn-sm", style: { marginTop: "10px" },
          text: "＋ " + T("New product"),
          onclick: function () { A.go("products"); } }),
      ]));
      return;
    }
    const grid = el("div", { class: "prodgrid" });
    list.forEach(function (p) {
      const out = Number(p.stock) <= 0;
      const photo = p.photo_id ? A.photoUrl(p.photo_id) : null;
      grid.appendChild(el("button", { class: "ptile" + (out ? " out" : ""),
        onclick: function () { addProduct(p, 1); } }, [
        photo ? el("img", { class: "thumb", src: photo, alt: "" }) : null,
        el("div", { class: "pn", text: p.name }),
        el("div", { class: "ps", text: out ? T("Only") + " 0"
          : A.qty(p.stock) + " " + (p.unit || "") }),
        el("div", { class: "pp", text: A.money(p.sale_price) }),
      ]));
    });
    picker.appendChild(grid);
  }

  function paintCart() {
    A.clear(cartBox);
    const t = compute();

    cartBox.appendChild(el("div", { class: "spread", style: { marginBottom: "8px" } }, [
      el("button", { class: "btn btn-sm grow", style: { justifyContent: "flex-start" },
        text: "👤 " + (cart.customer ? cart.customer.name : T("Walk-in")),
        onclick: pickCustomer }),
      el("button", { class: "btn btn-sm btn-icon", text: "🗑", title: T("Clear"),
        onclick: function () {
          if (!cart.lines.length) return;
          A.confirm(T("Clear"), T("Are you sure?"), { danger: true }).then(function (y) {
            if (y) { reset(); paint(); }
          });
        } }),
    ]));

    const lines = el("div", { style: { maxHeight: "38vh", overflowY: "auto" } });
    if (!cart.lines.length) {
      lines.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "🛒" }),
        el("div", { text: T("Cart is empty") }),
        el("div", { class: "tiny", text: T("Tap a product to start") }),
      ]));
    }
    cart.lines.forEach(function (l, i) {
      lines.appendChild(el("div", { class: "cartline" }, [
        el("div", { class: "grow" }, [
          el("div", { style: { fontWeight: "700", fontSize: ".93rem" }, text: l.name }),
          el("button", { class: "tiny faint", style: { textAlign: "left" },
            text: A.money(l.price) + " × " + A.qty(l.qty) + " " + (l.unit || ""),
            onclick: function () { editLine(i); } }),
        ]),
        el("div", { class: "right nowrap", style: { fontWeight: "800" },
          text: A.money(lineTotal(l)) }),
        el("div", { class: "qtybox" }, [
          el("button", { text: "−", onclick: function () {
            l.qty = r2(l.qty - 1);
            if (l.qty <= 0) cart.lines.splice(i, 1);
            paint();
          } }),
          el("span", { class: "q", text: A.qty(l.qty) }),
          el("button", { text: "+", onclick: function () { l.qty = r2(l.qty + 1); paint(); } }),
        ]),
        el("button", { class: "tiny", style: { color: "var(--bad)", justifySelf: "end" },
          text: "✕", onclick: function () { cart.lines.splice(i, 1); paint(); } }),
      ]));
    });
    cartBox.appendChild(lines);

    // ---- adjustments
    const adj = el("div", { class: "adjrow" });
    const dType = el("div", { class: "seg" }, [
      el("button", { class: cart.discountPct ? "" : "on", text: A.sym(),
        onclick: function () { cart.discountPct = false; paint(); } }),
      el("button", { class: cart.discountPct ? "on" : "", text: "%",
        onclick: function () { cart.discountPct = true; paint(); } }),
    ]);
    const dInp = A.field(T("Discount"), { type: "number", inputmode: "decimal",
      value: cart.discount, min: 0, key: "discount" });
    dInp.input.addEventListener("input", function () {
      cart.discount = dInp.input.value; paint(); });
    const tInp = A.field(T("Tax") + " %", { type: "number", inputmode: "decimal",
      value: cart.tax, min: 0, key: "tax" });
    tInp.input.addEventListener("input", function () {
      cart.tax = tInp.input.value; paint(); });
    const vInp = A.field(T("Delivery"), { type: "number", inputmode: "decimal",
      value: cart.delivery, min: 0, key: "delivery" });
    vInp.input.addEventListener("input", function () {
      cart.delivery = vInp.input.value; paint(); });
    // the toggle belongs to the discount box, so they share one label
    dInp.querySelector("label").remove();
    adj.appendChild(el("div", { class: "field" }, [
      el("label", { text: T("Discount") }),
      el("div", { class: "disc" }, [dType, dInp]),
    ]));
    adj.appendChild(tInp);
    adj.appendChild(vInp);
    cartBox.appendChild(adj);

    // ---- totals
    cartBox.appendChild(el("div", { class: "totals", style: { marginTop: "12px" } }, [
      el("span", { class: "muted", text: T("Subtotal") }),
      el("span", { class: "right", text: A.money(t.subtotal) }),
      el("span", { class: "muted", text: T("Discount") }),
      el("span", { class: "right", text: "−" + A.money(t.discount_amt) }),
      el("span", { class: "muted", text: T("Tax") }),
      el("span", { class: "right", text: A.money(t.tax_amt) }),
      el("span", { class: "muted", text: T("Delivery") }),
      el("span", { class: "right", text: A.money(t.delivery_charge) }),
      el("span", { class: "big", text: T("Grand total") }),
      el("span", { class: "right big", style: { color: "var(--pri)" },
        text: A.money(t.grand_total) }),
    ]));

    // ---- payment
    /* These two boxes take an AMOUNT.  Labelled "Mobile / bKash" a
       shopkeeper reads them as "the customer's mobile number" and types
       one in — a real bill went out with 1,924,277,708 taka against it.
       The label now says money, and a phone-shaped number is called out
       under the box before the sale can be completed. */
    const cashInp = A.field(T("Cash received"), { type: "number", inputmode: "decimal",
      value: cart.cash, min: 0, key: "cash", placeholder: T("amount") });
    cashInp.input.addEventListener("input", function () {
      cart.cash = cashInp.input.value; paint(); });
    const mobInp = A.field(T("Mobile / bKash"), { type: "number", inputmode: "decimal",
      value: cart.mobile, min: 0, key: "mobile", placeholder: T("amount") });
    mobInp.input.addEventListener("input", function () {
      cart.mobile = mobInp.input.value; paint(); });
    const pay = el("div", { class: "row", style: { marginTop: "12px", gap: "8px" } },
      [el("div", { class: "grow" }, [cashInp]), el("div", { class: "grow" }, [mobInp])]);
    cartBox.appendChild(pay);

    [[cashInp, cart.cash], [mobInp, cart.mobile]].forEach(function (pair) {
      if (!looksLikePhone(pair[1])) return;
      pair[0].appendChild(el("div", { class: "tiny", style: { color: "var(--bad)",
        fontWeight: "700", marginTop: "4px" },
        text: T("That looks like a phone number — type the amount here") }));
      pair[0].input.style.borderColor = "var(--bad)";
    });

    if (t.paid_mobile > 0) {
      const w = A.field("", { type: "select", value: cart.wallet,
        options: root.POSEngine.WALLETS.concat(["Card", "Bank"]) });
      w.input.addEventListener("change", function () { cart.wallet = w.input.value; paint(); });
      const trx = A.field("", { placeholder: T("TrxID"), value: cart.trx, wide: true,
        key: "trx" });
      trx.input.addEventListener("input", function () { cart.trx = trx.input.value; });
      cartBox.appendChild(el("div", { class: "row", style: { marginTop: "8px", gap: "8px" } },
        [el("div", { style: { width: "130px" } }, [w]), trx]));
    }

    cartBox.appendChild(el("div", { class: "row", style: { marginTop: "8px", gap: "8px" } }, [
      el("button", { class: "btn btn-sm", text: T("Cash received") + " = " + T("Grand total"),
        onclick: function () { cart.cash = String(t.grand_total); cart.mobile = ""; paint(); } }),
      t.change_due > 0 ? el("span", { class: "chip chip-ok",
        text: T("Change") + " " + A.money(t.change_due) }) : null,
      t.due > 0 && t.paid > 0 ? el("span", { class: "chip chip-warn",
        text: T("Due") + " " + A.money(t.due) }) : null,
    ]));

    cartBox.appendChild(el("div", { class: "row", style: { marginTop: "12px", gap: "8px" } }, [
      el("button", { class: "btn grow", text: "⏸ " + T("Hold"), onclick: hold }),
      el("button", { class: "btn grow", text: "📋 " + T("Held bills")
        + (A.eng._t("held_bills").length ? " (" + A.eng._t("held_bills").length + ")" : ""),
        onclick: openHeld }),
    ]));
    cartBox.appendChild(el("button", { class: "btn btn-pri btn-lg",
      style: { width: "100%", marginTop: "10px" },
      text: "✓ " + T("Complete sale"), onclick: complete }));
  }

  function paint() {
    A.keepFocus(function () {
      if (picker) paintPicker();
      if (cartBox) paintCart();
    });
  }

  function reset() {
    cart.lines = []; cart.customer = null; cart.discount = ""; cart.discountPct = false;
    const dTax = A.eng.settingFloat("default_tax", 0);
    cart.tax = dTax ? String(dTax) : ""; cart.delivery = "";
    cart.cash = ""; cart.mobile = ""; cart.trx = "";
  }

  function editLine(i) {
    const l = cart.lines[i];
    const m = A.modal({ title: l.name });
    const q = A.field(T("Qty"), { type: "number", inputmode: "decimal", value: l.qty, min: 0 });
    const p = A.field(T("Price"), { type: "number", inputmode: "decimal", value: l.price, min: 0 });
    m.body.appendChild(el("div", { class: "row" },
      [el("div", { class: "grow" }, [q]), el("div", { class: "grow" }, [p])]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Delete"),
      onclick: function () { cart.lines.splice(i, 1); m.close(); paint(); } }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        l.qty = Math.max(q.num(0), 0); l.price = Math.max(p.num(0), 0);
        if (l.qty <= 0) cart.lines.splice(i, 1);
        m.close(); paint();
      } }));
  }

  function pickCustomer() {
    const m = A.modal({ title: T("Attach customer") });
    const search = A.field("", { placeholder: T("Search"), wide: true });
    const list = el("div", { class: "stack", style: { marginTop: "10px", gap: "6px" } });
    function draw() {
      A.clear(list);
      list.appendChild(el("button", { class: "btn", text: T("Walk-in"),
        onclick: function () { cart.customer = null; m.close(); paint(); } }));
      A.eng.customers(search.val()).slice(0, 30).forEach(function (c) {
        list.appendChild(el("button", { class: "btn spread",
          style: { justifyContent: "space-between" }, onclick: function () {
            cart.customer = c; m.close(); paint();
          } }, [
          el("span", { text: c.name + (c.phone ? " · " + c.phone : "") }),
          c.due > 0 ? el("span", { class: "chip chip-warn", text: A.money(c.due) }) : null,
        ]));
      });
    }
    search.input.addEventListener("input", draw);
    m.body.appendChild(search); m.body.appendChild(list); draw();
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: "＋ " + T("New customer"),
      onclick: function () { m.close(); A.newCustomer(function (c) {
        cart.customer = c; paint(); }); } }));
  }

  function hold() {
    if (!cart.lines.length) return A.toast(T("Cart is empty"), "warn");
    const label = (cart.customer && cart.customer.name) || cart.lines[0].name;
    const row = { id: A.store.nextId("held_bills"), label: label,
      payload: JSON.stringify(cart), item_count: cart.lines.length,
      total: compute().grand_total,
      created_at: root.POSEngine.helpers.stamp() };
    A.eng._t("held_bills").push(row);
    A.store.put("held_bills", row);
    reset(); paint();
    A.toast(T("Hold") + " ✓", "ok");
  }

  function openHeld() {
    const m = A.modal({ title: T("Held bills") });
    const rows = A.eng._t("held_bills").slice().sort(function (a, b) { return b.id - a.id; });
    if (!rows.length) m.body.appendChild(el("div", { class: "empty",
      text: T("Nothing here yet") }));
    rows.forEach(function (b) {
      m.body.appendChild(el("div", { class: "card card-pad spread",
        style: { marginBottom: "8px" } }, [
        el("div", { class: "grow" }, [
          el("div", { style: { fontWeight: "700" }, text: b.label }),
          el("div", { class: "tiny faint", text: A.qty(b.item_count) + " · "
            + A.money(b.total) + " · " + A.timeText(b.created_at) }),
        ]),
        el("button", { class: "btn btn-sm btn-pri", text: T("Back"), onclick: function () {
          const saved = JSON.parse(b.payload);
          Object.keys(saved).forEach(function (k) { cart[k] = saved[k]; });
          // Whatever was typed in the payment boxes belonged to the previous
          // customer; carrying it over files the resumed bill as already paid.
          cart.cash = ""; cart.mobile = ""; cart.trx = "";
          A.store.remove("held_bills", b.id);
          m.close(); paint();
        } }),
        el("button", { class: "btn btn-sm btn-icon", text: "🗑", onclick: function () {
          A.confirm(T("Delete"), T("This cannot be undone."), { danger: true })
            .then(function (y) { if (y) { A.store.remove("held_bills", b.id);
              m.close(); openHeld(); paint(); } });
        } }),
      ]));
    });
  }

  function complete() {
    if (!cart.lines.length) return A.toast(T("Cart is empty"), "warn");
    const t = compute();

    /* Last gate before a wrong figure is written into the books. */
    const phoney = [cart.cash, cart.mobile].some(looksLikePhone);
    const absurd = t.grand_total > 0 && t.paid > t.grand_total * 20 && t.paid > 10000;
    if (phoney || absurd) {
      A.confirm(root.isBn() ? "টাকার অঙ্কটা মিলছে না" : "That amount looks wrong",
        (root.isBn()
          ? "বিলের সর্বমোট " + A.money(t.grand_total) + ", কিন্তু নেওয়া হয়েছে "
            + A.money(t.paid) + "।\n\nফোন নম্বর লিখে ফেলেননি তো? "
            + "ওই ঘরে টাকার অঙ্ক লিখতে হয়।\n\nতবুও সেভ করব?"
          : "The bill is " + A.money(t.grand_total) + " but " + A.money(t.paid)
            + " was entered.\n\nDid a phone number go into the amount box?"
            + "\n\nSave anyway?"),
        { danger: true }).then(function (y) { if (y) proceed(); });
      return;
    }
    proceed();

    function proceed() {
    const finish = function () {
      if (t.paid_mobile > 0 && !t.trx_id) {
        A.confirm(T("TrxID"), root.isBn()
          ? "বিকাশ/নগদে টাকা নিয়েছেন কিন্তু TrxID লেখেননি। পরে টাকা মেলানো যাবে না। তবুও সেভ করব?"
          : "This bill has a mobile payment but no TrxID. Save anyway?")
          .then(function (y) { if (y) save(t); });
        return;
      }
      save(t);
    };
    if (t.paid <= 0) {
      A.confirm(T("Nothing paid yet"), T("Record this bill as fully due?"))
        .then(function (y) { if (y) finish(); });
      return;
    }
    finish();
    }
  }

  function save(t) {
    let sale;
    try {
      sale = A.eng.createSale(Object.assign({}, t, {
        invoice_no: A.eng.nextInvoiceNo(),
        customer_id: cart.customer ? cart.customer.id : null,
        customer_name: cart.customer ? cart.customer.name : T("Walk-in"),
        customer_phone: cart.customer ? (cart.customer.whatsapp || cart.customer.phone) : "",
        user_id: A.user ? A.user.id : null,
      }), cart.lines.map(function (l) {
        return { product_id: l.product_id, name: l.name, unit: l.unit, qty: l.qty,
                 price: l.price, cost: l.cost, line_total: lineTotal(l) };
      }));
    } catch (err) {
      return A.toast((root.isBn() ? "সেভ করা গেল না: " : "Could not save: ") + err.message, "bad");
    }
    const items = A.eng.saleItems(sale.id);
    // Past this point the sale IS saved.  Nothing below may stop the cart
    // from clearing, or the shopkeeper rings the same bill twice.
    reset(); paint();
    try { A.saleDone(sale, items); }
    catch (err) { A.toast(T("Saved"), "ok"); }
  }

  // ------------------------------------------------------------- view
  A.register("till", function (page) {
    if (cart.tax === "" && !cart.lines.length) {
      const d = A.eng.settingFloat("default_tax", 0);
      cart.tax = d ? String(d) : "";
    }
    const wrap = el("div", { class: "till" });
    const left = el("div", { class: "stack" });
    const right = el("div", { class: "card card-pad" });

    const search = A.field("", { placeholder: "🔍 " + T("Scan or type a product name"),
      wide: true, value: state.search });
    search.input.setAttribute("autocomplete", "off");
    search.input.addEventListener("input", function () {
      state.search = search.val(); paintPicker();
    });
    search.input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      const code = search.val();
      const hit = A.eng.findByCode(code)
        || A.eng.products({ search: code })[0];
      if (hit) { addProduct(hit, 1); search.input.value = ""; state.search = ""; paintPicker(); }
      else A.toast(root.isBn() ? "এই কোডে পণ্য পাওয়া যায়নি" : "No product for that code", "warn");
    });
    left.appendChild(el("div", { class: "card card-pad toolbar" }, [
      search,
      el("button", { class: "btn btn-sm", text: "✚ " + T("Quick item"), onclick: quickItem }),
    ]));

    picker = el("div", { class: "card card-pad" });
    left.appendChild(picker);
    cartBox = right;
    wrap.appendChild(left); wrap.appendChild(right);
    page.appendChild(wrap);
    setTimeout(function () { search.input.focus(); }, 80);
    paint();
  });

  function quickItem() {
    const m = A.modal({ title: T("Quick item") });
    const n = A.field(T("Name"), { placeholder: root.isBn() ? "যেমন: মেরামত খরচ" : "e.g. Repair charge" });
    const p = A.field(T("Price"), { type: "number", inputmode: "decimal", min: 0 });
    const q = A.field(T("Qty"), { type: "number", inputmode: "decimal", value: 1, min: 0 });
    m.body.appendChild(n);
    m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
      [el("div", { class: "grow" }, [p]), el("div", { class: "grow" }, [q])]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Add"),
      onclick: function () {
        if (!n.val()) return A.toast(T("Required"), "warn");

<script>
/* =================================================================
   Products — catalogue, stock, photos, barcode labels, and the
   weighing scale.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  // ------------------------------------------------------------ photos
  const photoCache = {};
  A.photoUrl = function (id) {
    if (photoCache[id]) return photoCache[id];
    const row = A.eng._t("photos").find(function (p) { return p.id === id; });
    if (!row) return null;
    photoCache[id] = row.data;
    return row.data;
  };

  /** Shrink to a thumbnail before storing.  A phone camera JPEG is 3-5 MB;
   *  a hundred of those would fill the browser's whole quota and the
   *  backup file would be unusable. */
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = function () { reject(new Error("read failed")); };
      reader.onload = function () {
        const img = new Image();
        img.onerror = function () { reject(new Error("not an image")); };
        img.onload = function () {
          const max = 320;
          const scale = Math.min(max / img.width, max / img.height, 1);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function savePhoto(dataUrl) {
    const row = { id: A.store.nextId("photos"), data: dataUrl };
    A.eng._t("photos").push(row);
    A.store.put("photos", row);
    photoCache[row.id] = dataUrl;
    return row.id;
  }

  // ------------------------------------------------------------- scale
  /** Most counter scales send a plain ASCII line such as "ST,GS,   1.245kg".
   *  Pull the first number out of whatever arrives — that covers the common
   *  formats without needing a driver per brand. */
  function parseWeight(text) {
    const m = String(text).match(/-?\d+(?:\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }

  A.readScale = function (onWeight) {
    if (!navigator.serial) {
      A.toast(root.isBn()
        ? "এই ব্রাউজারে ওজন মেশিন যুক্ত করা যায় না — কম্পিউটারের Chrome লাগবে"
        : "This browser cannot talk to a scale — use Chrome on a PC", "warn");
      return;
    }
    navigator.serial.requestPort().then(function (port) {
      return port.open({ baudRate: A.eng.settingFloat("scale_baud", 9600) })
        .then(function () {
          const decoder = new TextDecoderStream();
          port.readable.pipeTo(decoder.writable);
          const reader = decoder.readable.getReader();
          let buf = "";
          function pump() {
            reader.read().then(function (res) {
              if (res.done) return;
              buf += res.value;
              const lines = buf.split(/[\r\n]+/);
              buf = lines.pop();
              lines.forEach(function (line) {
                const w = parseWeight(line);
                if (w !== null && w > 0) onWeight(w);
              });
              pump();
            }).catch(function () { /* unplugged */ });
          }
          pump();
          A.toast(root.isBn() ? "ওজন মেশিন যুক্ত হয়েছে" : "Scale connected", "ok");
        });
    }).catch(function () { /* the user closed the chooser */ });
  };

  // ------------------------------------------------------------ editor
  function editor(p, after) {
    const isNew = !p;
    p = p || {};
    const m = A.modal({ title: isNew ? T("New product") : p.name });
    const f = {};
    f.name = A.field(T("Name") + " *", { value: p.name || "" });
    f.cat = A.field(T("Category"), { value: p.category || "",
      placeholder: root.isBn() ? "যেমন: চাল, তেল" : "e.g. Rice, Oil" });
    f.unit = A.field(T("Unit"), { type: "select", value: p.unit || "pcs",
      options: A.eng.units() });
    f.cost = A.field(T("Buying price"), { type: "number", inputmode: "decimal",
      value: p.cost_price || "", min: 0 });
    f.sale = A.field(T("Selling price") + " *", { type: "number", inputmode: "decimal",
      value: p.sale_price || "", min: 0 });
    f.low = A.field(T("Low stock alert at"), { type: "number", inputmode: "decimal",
      value: p.low_stock_at !== undefined ? p.low_stock_at : 5, min: 0 });
    f.sku = A.field(T("SKU"), { value: p.sku || "" });
    f.code = A.field(T("Barcode"), { value: p.barcode || "" });
    if (isNew) f.stock = A.field(T("Stock"), { type: "number", inputmode: "decimal",
      value: "", min: 0 });

    let photoId = p.photo_id || null;
    const thumb = el("div", { style: { width: "84px", height: "84px", flex: "0 0 84px",
      borderRadius: "12px", background: "var(--surface3)", overflow: "hidden",
      display: "grid", placeItems: "center" } });
    function drawThumb() {
      A.clear(thumb);
      const url = photoId ? A.photoUrl(photoId) : null;
      thumb.appendChild(url
        ? el("img", { src: url, alt: "",
            style: { width: "100%", height: "100%", objectFit: "cover" } })
        : el("span", { class: "faint", text: "📷" }));
    }
    drawThumb();
    const file = el("input", { type: "file", accept: "image/*", class: "hide",
      onchange: function () {
        const chosen = file.files && file.files[0];
        if (!chosen) return;
        shrink(chosen).then(function (url) { photoId = savePhoto(url); drawThumb(); })
          .catch(function () { A.toast(root.isBn() ? "ছবিটা পড়া গেল না" : "Could not read that image", "bad"); });
      } });

    m.body.appendChild(el("div", { class: "row", style: { marginBottom: "12px" } }, [
      thumb,
      el("div", { class: "grow stack", style: { gap: "8px" } }, [
        el("button", { class: "btn btn-sm", text: "📷 " + T("Add photo"),
          onclick: function () { file.click(); } }),
        photoId ? el("button", { class: "btn btn-sm btn-ghost", text: T("Remove photo"),
          onclick: function () { photoId = null; drawThumb(); } }) : null,
      ]),
      file,
    ]));
    m.body.appendChild(f.name);
    m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
      [el("div", { class: "grow" }, [f.cat]), el("div", { class: "grow" }, [f.unit])]));
    m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
      [el("div", { class: "grow" }, [f.cost]), el("div", { class: "grow" }, [f.sale])]));
    m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } }, [
      el("div", { class: "grow" }, [f.low]),
      isNew ? el("div", { class: "grow" }, [f.stock]) : null]));
    m.body.appendChild(el("div", { class: "row", style: { marginTop: "10px" } },
      [el("div", { class: "grow" }, [f.sku]), el("div", { class: "grow" }, [f.code])]));

    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        if (!f.name.val()) return A.toast(T("Name") + ": " + T("Required"), "warn");
        if (f.sale.num(0) <= 0) return A.toast(T("Selling price") + ": " + T("Required"), "warn");
        const data = { id: p.id, name: f.name.val(), category: f.cat.val(),
          unit: f.unit.val(), cost_price: f.cost.num(0), sale_price: f.sale.num(0),
          low_stock_at: f.low.num(0), sku: f.sku.val(), barcode: f.code.val() };
        if (isNew) data.stock = f.stock.num(0);
        const row = A.eng.saveProduct(data);
        if (row) { row.photo_id = photoId; A.store.put("products", row); }
        m.close(); A.toast(T("Saved"), "ok"); (after || A.refresh)();
      } }));
  }
  A.editProduct = editor;

  A.restock = function (p) {
    const m = A.modal({ title: T("Add stock") + " · " + p.name });
    const q = A.field(T("Qty"), { type: "number", inputmode: "decimal", value: "" });
    const note = A.field(T("Note"), { placeholder: root.isBn() ? "যেমন: ডেলিভারি" : "e.g. delivery" });
    m.body.appendChild(el("div", { class: "small muted", style: { marginBottom: "10px" },
      text: T("Stock") + ": " + A.qty(p.stock) + " " + (p.unit || "") }));
    m.body.appendChild(q); m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [note]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        const n = q.num(0);
        if (!n) return A.toast(T("Enter an amount"), "warn");
        A.eng.adjustStock(p.id, n, "adjust", note.val());
        m.close(); A.toast(T("Updated"), "ok"); A.refresh();
      } }));
  };

  // -------------------------------------------------------------- view
  A.register("products", function (page) {
    let search = (A.params && A.params.search) || "";
    const bar = el("div", { class: "card card-pad toolbar" });
    const box = A.field("", { placeholder: "🔍 " + T("Search"), value: search, wide: true });
    box.input.addEventListener("input", function () { search = box.val(); draw(); });
    bar.appendChild(box);
    bar.appendChild(el("button", { class: "btn btn-sm", text: "🏷 " + T("Labels"),
      onclick: function () { A.labels && A.labels(); } }));
    bar.appendChild(el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"),
      onclick: function () {
        A.xlsx(T("Products"), [["Name", "Category", "Unit", "Cost", "Price",
          "Stock", "SKU", "Barcode"]].concat(A.eng.products().map(function (p) {
            return [p.name, p.category, p.unit, p.cost_price, p.sale_price,
                    p.stock, p.sku, p.barcode]; })), "products");
      } }));
    bar.appendChild(el("button", { class: "btn btn-sm btn-pri", text: "＋ " + T("New product"),
      onclick: function () { editor(null); } }));
    page.appendChild(bar);

    const card = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
    page.appendChild(card);

    function draw() {
      A.clear(card);
      const rows = A.eng.products({ search: search });
      if (!rows.length) {
        card.appendChild(el("div", { class: "empty" }, [
          el("div", { class: "big", text: "📦" }),
          el("div", { text: T("Nothing here yet") })]));
        return;
      }
      const tbl = el("table", { class: "tbl tbl-cards" });
      tbl.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { class: "fit col-photo", text: "" }), el("th", { text: T("Name") }),
        el("th", { class: "fit", text: T("Stock") }),
        el("th", { class: "fit right pad col-cost", text: T("Cost") }),
        el("th", { class: "fit right pad", text: T("Price") }),
        el("th", { class: "fit right", text: T("Actions") }),
      ])]));
      const body = el("tbody");
      rows.forEach(function (p) {
        const url = p.photo_id ? A.photoUrl(p.photo_id) : null;
        const low = Number(p.low_stock_at) > 0 && Number(p.stock) <= Number(p.low_stock_at);
        body.appendChild(el("tr", {}, [
          el("td", { class: "fit col-photo" }, [
            url ? el("img", { src: url, alt: "", style: { width: "40px", height: "40px",
              borderRadius: "8px", objectFit: "cover" } })
                : el("div", { style: { width: "40px", height: "40px", borderRadius: "8px",
              background: "var(--surface3)", display: "grid", placeItems: "center" },
              text: "📦" })]),
          el("td", { class: "c-name" }, [
            el("div", { style: { fontWeight: "700" }, text: p.name }),
            el("div", { class: "tiny faint", text: [p.category, p.sku].filter(Boolean).join(" · ") }),
          ]),
          el("td", { class: "fit c-stock" }, [el("span", { class: "chip " + (low ? "chip-warn" : ""),
            text: A.qty(p.stock) + " " + (p.unit || "") })]),
          el("td", { class: "fit right pad muted col-cost", text: A.money(p.cost_price) }),
          el("td", { class: "fit right pad c-price", style: { fontWeight: "700" },
            text: A.money(p.sale_price) }),
          el("td", { class: "fit right nowrap c-act" }, [
            el("button", { class: "btn btn-sm", text: "＋", title: T("Restock"),
              onclick: function () { A.restock(p); } }),
            el("button", { class: "btn btn-sm", text: "✎", title: T("Edit"),
              style: { marginLeft: "6px" }, onclick: function () { editor(p); } }),
            el("button", { class: "btn btn-sm", text: "🗑", title: T("Delete"),
              style: { marginLeft: "6px" }, onclick: function () {
                A.confirm(T("Delete") + " · " + p.name, T("This cannot be undone."),
                  { danger: true }).then(function (y) {
                    if (y) { A.eng.deleteProduct(p.id); A.toast(T("Deleted"), "ok"); draw(); }
                  });
              } }),
          ]),
        ]));
      });
      tbl.appendChild(body);
      card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
    }
    draw();
  });
})(window);
</script>
<script>
/* =================================================================
   Customers and suppliers — the two credit books.  Money owed TO the
   shop and money owed BY the shop behave the same way, so they share
   their shape: a balance that only ever moves relatively.
   ================================================================= */
(function (root) {
  "use strict";
  const A = root.App, el = A.el, T = root.T;

  // ------------------------------------------------------------ shared
  function payDialog(opts) {
    const m = A.modal({ title: opts.title });
    m.body.appendChild(el("div", { class: "card card-pad spread",
      style: { marginBottom: "12px" } }, [
      el("span", { class: "muted", text: T("Outstanding") }),
      el("strong", { style: { fontSize: "1.2rem", color: "var(--warn)" },
        text: A.money(opts.balance) }),
    ]));
    const amt = A.field(T("Amount"), { type: "number", inputmode: "decimal",
      value: opts.balance || "", min: 0 });
    const how = A.field(T("Paid by"), { type: "select", value: "Cash",
      options: ["Cash", "bKash", "Nagad", "Rocket", "Card", "Bank"] });
    const note = A.field(T("Note"), { placeholder: "" });
    m.body.appendChild(amt);
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [how]));
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [note]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Record payment"),
      onclick: function () {
        const n = amt.num(0);
        if (n <= 0) { A.toast(T("Enter an amount"), "warn"); return amt.input.focus(); }
        const left = opts.onPay(n, how.val(), note.val());
        m.close();
        A.toast(T("Recorded") + " " + A.money(n) + " · " + T("Remaining") + " "
                + A.money(left), "ok");
        A.refresh();
      } }));
  }

  A.settleDue = function (c) {
    payDialog({ title: T("Settle due") + " · " + c.name, balance: c.due,
      onPay: function (n, how, note) {
        return A.eng.settleDue(c.id, n, how, note, A.user ? A.user.id : null);
      } });
  };

  // --------------------------------------------------------- customers
  function customerEditor(c, after) {
    const isNew = !c; c = c || {};
    const m = A.modal({ title: isNew ? T("New customer") : c.name });
    const name = A.field(T("Name") + " *", { value: c.name || "" });
    const phone = A.field(T("Phone"), { value: c.phone || "", inputmode: "tel",
      placeholder: "01XXXXXXXXX" });
    /* Almost every shop customer uses WhatsApp on the number they
       already gave, so asking for it twice was pure friction.  The
       second box only appears for the rare customer whose WhatsApp
       sits on a different number. */
    const wa = A.field("WhatsApp", { value: c.whatsapp || "", inputmode: "tel",
      placeholder: "01XXXXXXXXX" });
    const differs = !!(c.whatsapp && c.phone && c.whatsapp !== c.phone);
    const waBox = el("div", { class: "hide", style: { marginTop: "10px" } }, [wa]);
    const waToggle = el("label", { class: "checkrow" }, [
      el("input", { type: "checkbox", checked: differs ? "checked" : null }),
      el("span", { text: root.isBn() ? "WhatsApp নম্বর আলাদা"
                                     : "WhatsApp is a different number" }),
    ]);
    waToggle.querySelector("input").addEventListener("change", function () {
      waBox.classList.toggle("hide", !this.checked);
      if (this.checked && !wa.input.value) wa.input.value = phone.input.value;
      if (!this.checked) wa.input.value = "";
    });
    if (differs) waBox.classList.remove("hide");

    const addr = A.field(T("Address"), { type: "textarea", value: c.address || "" });
    m.body.appendChild(name);
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [phone]));
    m.body.appendChild(el("div", { style: { marginTop: "8px" } }, [waToggle]));
    m.body.appendChild(waBox);
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [addr]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        if (!name.val()) return A.toast(T("Required"), "warn");
        const row = A.eng.saveCustomer({ id: c.id, name: name.val(), phone: phone.val(),
          whatsapp: wa.val() || phone.val(), address: addr.val() });
        m.close(); A.toast(T("Saved"), "ok");
        if (after) after(row); else A.refresh();
      } }));
  }
  A.newCustomer = function (after) { customerEditor(null, after); };

  A.register("customers", function (page) {
    let search = "";
    const bar = el("div", { class: "card card-pad toolbar" });
    const box = A.field("", { placeholder: "🔍 " + T("Search"), wide: true });
    box.input.addEventListener("input", function () { search = box.val(); draw(); });
    bar.appendChild(box);
    bar.appendChild(el("button", { class: "btn btn-sm", text: "⇩ " + T("Excel"),
      onclick: function () {
        A.xlsx(T("Customers"), [["Name", "Phone", "WhatsApp", "Address", "Due"]]
          .concat(A.eng.customers().map(function (c) {
            return [c.name, c.phone, c.whatsapp, c.address, c.due]; })), "customers");
      } }));
    bar.appendChild(el("button", { class: "btn btn-sm btn-pri", text: "＋ " + T("New customer"),
      onclick: function () { customerEditor(null); } }));
    page.appendChild(bar);

    const owed = A.eng.outstandingDue();
    page.appendChild(el("div", { class: "card card-pad spread",
      style: { marginTop: "var(--gap)" } }, [
      el("span", { class: "muted", text: T("Outstanding due") }),
      el("strong", { style: { fontSize: "1.4rem",
        color: owed > 0 ? "var(--warn)" : "var(--ok)" }, text: A.money(owed) }),
    ]));

    const card = el("div", { class: "card", style: { marginTop: "var(--gap)" } });
    page.appendChild(card);

    function draw() {
      A.clear(card);
      const rows = A.eng.customers(search);
      if (!rows.length) return card.appendChild(el("div", { class: "empty" }, [
        el("div", { class: "big", text: "👥" }), el("div", { text: T("Nothing here yet") })]));
      const tbl = el("table", { class: "tbl" });
      tbl.className = "tbl tbl-cards";
      tbl.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", { text: T("Name") }), el("th", { class: "fit", text: T("Phone") }),
        el("th", { class: "fit right pad", text: T("Due") }),
        el("th", { class: "fit right", text: T("Actions") })])]));
      const body = el("tbody");
      rows.forEach(function (c) {
        const owes = Number(c.due) > 0;
        const phone = c.whatsapp || c.phone;
        const text = A.eng.reminderText(c, root.isBn() ? "bn" : "en");
        body.appendChild(el("tr", {}, [
          el("td", { class: "c-name" }, [
            el("div", { style: { fontWeight: "700" }, text: c.name }),
            el("div", { class: "tiny faint",
              text: [c.phone, c.address].filter(Boolean).join(" · ") })]),
          el("td", { class: "fit muted nowrap c-hide-phone", text: c.phone || "" }),
          el("td", { class: "fit right pad c-price" }, [owes
            ? el("span", { class: "chip chip-warn", text: A.money(c.due) })
            : el("span", { class: "faint", text: "—" })]),
          el("td", { class: "fit right nowrap c-act" }, [
            owes && phone ? el("a", { class: "btn btn-sm btn-ok", text: "🟢",
              title: T("Remind on WhatsApp"), target: "_blank", rel: "noopener",
              href: A.eng.waLink(phone, text) }) : null,
            owes ? el("button", { class: "btn btn-sm", text: "৳", title: T("Settle due"),
              style: { marginLeft: "6px" },
              onclick: function () { A.settleDue(c); } }) : null,
            el("button", { class: "btn btn-sm", text: "✎", style: { marginLeft: "6px" },
              onclick: function () { customerEditor(c); } }),
          ]),
        ]));

      card.appendChild(el("div", { class: "scroll-x" }, [tbl]));
    }
    draw();
  });

  // --------------------------------------------------------- suppliers
  function supplierEditor(s, after) {
    const isNew = !s; s = s || {};
    const m = A.modal({ title: isNew ? T("New supplier") : s.name });
    const name = A.field(T("Name") + " *", { value: s.name || "" });
    const phone = A.field(T("Phone"), { value: s.phone || "", inputmode: "tel" });
    const addr = A.field(T("Address"), { type: "textarea", value: s.address || "" });
    m.body.appendChild(name);
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [phone]));
    m.body.appendChild(el("div", { style: { marginTop: "10px" } }, [addr]));
    m.footer.appendChild(el("button", { class: "btn", text: T("Cancel"), onclick: m.close }));
    m.footer.appendChild(el("button", { class: "btn btn-pri", text: T("Save"),
      onclick: function () {
        if (!name.val()) return A.toast(T("Required"), "warn");
        const row = A.eng.saveSupplier({ id: s.id, name: name.val(),
