<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Offline shop billing">
<style>
/* ===================================================================
   One design, two themes, two screen shapes.

   Everything is driven by the tokens on :root, so a colour or a text
   size changes in one place.  Sizes are in rem against a root font the
   shopkeeper can set, which is how the whole interface grows without
   any layout being rebuilt.
   =================================================================== */
:root{
  --pri:#0f766e; --pri-d:#0b5f58; --pri-l:#14b8a6;
  --acc:#7c3aed; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --surface3:#e9eef4;
  --line:#dfe6ee; --text:#0f172a; --muted:#5b6b7f; --faint:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --shadow-lg:0 2px 6px rgba(15,23,42,.08),0 24px 48px -24px rgba(15,23,42,.3);
  --r:14px; --r-sm:10px; --r-lg:22px;
  --pad:18px; --gap:14px;
  --tap:48px;                     /* never smaller: shop fingers, fast hands */
  --fs:16px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b1117; --surface:#141c25; --surface2:#1b242f; --surface3:#26323f;
  --line:#2b3745; --text:#e8eef5; --muted:#9aabbd; --faint:#64748b;
  --pri:#14b8a6; --pri-d:#0d9488; --pri-l:#2dd4bf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"POS Bangla","Hind Siliguri","Noto Sans Bengali",system-ui,
              -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------ shell */
#app{display:flex;min-height:100dvh}
#rail{
  width:248px;flex:0 0 248px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:30;
}
.brand{padding:22px 20px 16px;display:flex;gap:12px;align-items:center}
.brand-mark{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,var(--pri-l),var(--pri-d));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1rem;
  box-shadow:var(--shadow);
}
.brand-name{font-weight:700;font-size:1.02rem;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-sub{font-size:.76rem;color:var(--faint);margin-top:2px}
#nav{padding:6px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.navbtn{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);
  color:var(--muted);font-size:.97rem;font-weight:600;text-align:left;
  transition:background .12s,color .12s;
}
.navbtn:hover{background:var(--surface2);color:var(--text)}
.navbtn.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.navbtn .ic{width:22px;flex:0 0 22px;display:grid;place-items:center}
.navbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .pip{
  min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);
  color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;
}
.rail-foot{padding:12px 16px 18px;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--faint);line-height:1.5}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px var(--pad);display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
#top h1{font-size:1.5rem;flex:1;min-width:140px}
.topbar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#page{padding:var(--pad);flex:1;max-width:1600px;width:100%;margin:0 auto}

/* ------------------------------------------------------------ pieces */
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:var(--pad)}
.grid{display:grid;gap:var(--gap)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:var(--gap);align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:.86rem}.tiny{font-size:.76rem}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}
.grow{flex:1;min-width:0}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:var(--r-sm);
  font-weight:700;font-size:.95rem;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);
  transition:filter .12s,transform .06s,background .12s;
}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ghost{background:transparent}
.btn-lg{min-height:58px;font-size:1.06rem;padding:0 24px}
.btn-sm{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:8px}
.btn-icon{width:var(--tap);padding:0;flex:0 0 var(--tap)}
.btn[disabled]{opacity:.45;pointer-events:none}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:.82rem;color:var(--muted);font-weight:600}
.inp{
  width:100%;min-height:var(--tap);padding:10px 14px;border-radius:var(--r-sm);
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  outline:none;transition:border-color .12s,box-shadow .12s;
}
.inp:focus{border-color:var(--pri);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  border-radius:17px;background:var(--surface2);border:1px solid var(--line);
  font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);
  border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.chip-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);
  border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.chip-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);
  border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px;gap:3px;overflow-x:auto;max-width:100%}
.seg button{min-height:38px;padding:0 14px;border-radius:8px;font-weight:600;
  font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
table.tbl th{
  text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
table.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.tile{padding:16px 18px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700}
.tile .v{font-size:1.9rem;font-weight:800;margin-top:6px;line-height:1.1;
  overflow-wrap:anywhere}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:4px}

.bar{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pri);border-radius:4px;
  transition:width .35s ease}

.empty{padding:48px 20px;text-align:center;color:var(--faint)}
.empty .big{font-size:2.4rem;margin-bottom:10px;opacity:.55}

/* --------------------------------------------------------- dialogs */
.veil{position:fixed;inset:0;background:rgba(6,12,20,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(680px,100%);
  max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  animation:pop .16s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes pop{from{transform:translateY(12px) scale(.99);opacity:0}}
.modal > header{padding:18px var(--pad) 12px;display:flex;gap:12px;align-items:center;
  border-bottom:1px solid var(--line)}
.modal > header h3{font-size:1.15rem;flex:1}
.modal > .body{padding:var(--pad);overflow-y:auto;flex:1}
.modal > footer{padding:14px var(--pad);border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal > footer .btn{flex:1;min-width:120px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{padding:12px 18px;border-radius:var(--r-sm);background:var(--text);
  color:var(--bg);font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);
  animation:rise .18s ease;max-width:100%;text-align:center}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.toast.ok{background:var(--ok);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
.toast.warn{background:var(--warn);color:#fff}

/* --------------------------------------------------------- till */
.till{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--gap);align-items:start}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px}
.ptile{padding:12px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;
  gap:6px;min-height:104px;transition:transform .07s,border-color .12s,box-shadow .12s}
.ptile:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.ptile:active{transform:scale(.98)}
.ptile .pn{font-weight:700;font-size:.9rem;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .pp{font-weight:800;color:var(--pri);font-size:1.05rem;margin-top:auto}
.ptile .ps{font-size:.72rem;color:var(--faint)}
.ptile.out{opacity:.62}
.ptile .thumb{width:100%;height:74px;border-radius:8px;object-fit:cover;
  background:var(--surface3)}
.cartline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;
  padding:10px 0;border-bottom:1px solid var(--line)}
.qtybox{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;background:var(--surface2)}
.qtybox button{width:36px;height:36px;font-weight:800;font-size:1.05rem;color:var(--muted)}
.qtybox button:hover{background:var(--surface3);color:var(--text)}
.qtybox .q{min-width:48px;text-align:center;font-weight:700;font-size:.92rem}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.totals .big{font-size:1.5rem;font-weight:800}

/* --------------------------------------------------------- receipt */
.slip{background:#fff;color:#000;font-family:"Courier New",ui-monospace,monospace;
  font-size:12px;line-height:1.45;padding:10px;white-space:pre-wrap;
  width:100%;max-width:340px;margin:0 auto;border-radius:6px}

/* --------------------------------------------------------- phone */
#tabbar{display:none}
@media (max-width:900px){
  :root{--pad:14px;--gap:12px}
  #rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  body.drawer #rail{transform:none}
  body.drawer::after{content:"";position:fixed;inset:0;background:rgba(6,12,20,.5);
    z-index:25}
  #top h1{font-size:1.2rem}
  #page{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .till{grid-template-columns:1fr}
  .tile .v{font-size:1.55rem}
  #tabbar{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;
    left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 2px 7px;font-size:.66rem;font-weight:700;color:var(--muted)}
  #tabbar button .ic{display:grid;place-items:center}
  #tabbar button.on{color:var(--pri)}
  .modal{width:100%;max-height:96dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;
    margin-top:auto;animation:sheet .2s ease}
  .veil{align-items:flex-end;padding:0}
  @keyframes sheet{from{transform:translateY(24px)}}
  .modal > footer .btn{min-width:0}
}
@media (min-width:901px){ .only-phone{display:none !important} }
@media (min-width:641px){ table.tbl td.c-name .tiny{display:none} }

@media print{
  body{background:#fff}
  #rail,#top,#tabbar,.veil,#toast,.noprint{display:none !important}
  #page{padding:0;max-width:none}
  .slip{max-width:none;font-size:12px;padding:0}
}

/* ===================================================================
   PREMIUM LAYER
   Depth, gradient and type refinements applied on top of the base.
   Everything still reads from the same tokens, so a theme switch
   carries through the whole thing.
   =================================================================== */
:root{
  --r:16px; --r-sm:12px; --r-lg:26px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -16px rgba(15,23,42,.28);
  --shadow-lg:0 4px 10px rgba(15,23,42,.07),0 30px 60px -28px rgba(15,23,42,.36);
  --ring:color-mix(in srgb,var(--pri) 24%,transparent);
  --glow:color-mix(in srgb,var(--pri) 12%,transparent);
  --hair:color-mix(in srgb,var(--text) 8%,transparent);
}
html[data-theme="dark"]{
  --hair:color-mix(in srgb,#ffffff 10%,transparent);
  --bg:#080d13; --surface:#111923; --surface2:#18222e; --surface3:#22303e;
  /* the status colours have to lift off a dark sheet, not sink into it */
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
html[data-theme="dark"] .btn-ok{background:linear-gradient(180deg,#10b981,#047857)}
html[data-theme="dark"] .btn-bad{background:linear-gradient(180deg,#f87171,#b91c1c)}
html[data-density="compact"]{ --pad:13px; --gap:10px; --tap:44px }

body{
  background:
    radial-gradient(1100px 620px at 8% -8%, var(--glow), transparent 60%),
    radial-gradient(900px 520px at 108% 0%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  letter-spacing:.005em;
}
.num,.tile .v,.duecard-amt,.duerow-amt,.totals .big,.mini-v,
table.tbl td.right,table.tbl th.right{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}

/* --------------------------------------------------------- surfaces */
.card{
  border-color:var(--hair);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--surface) 100%,transparent),
    color-mix(in srgb,var(--surface2) 62%,var(--surface)));
  backdrop-filter:saturate(120%);
}
.tile{
  border-color:var(--hair);position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--surface),
    color-mix(in srgb,var(--surface2) 70%,var(--surface)));
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
}
.tile::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--pri-l),var(--pri));opacity:.85;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile .k{letter-spacing:.08em;font-size:.7rem}
.tile .v{letter-spacing:-.02em;font-weight:800}
.tile-hero{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--pri-d),var(--pri) 55%,var(--pri-l));
  box-shadow:0 16px 40px -20px color-mix(in srgb,var(--pri) 85%,transparent),var(--shadow);
}
.tile-hero::before{display:none}
.tile-hero .k,.tile-hero .s{color:rgba(255,255,255,.82)}
.tile-hero .v{color:#fff}
.tiles4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.strong{font-weight:700} .up{letter-spacing:.08em;text-transform:uppercase}

/* ------------------------------------------------------------- rail */
#rail{
  background:linear-gradient(180deg,var(--surface),
    color-mix(in srgb,var(--surface2) 80%,var(--surface)));
  border-right-color:var(--hair);
}
.brand{padding:20px 18px 14px}
.brand-mark{
  width:44px;height:44px;flex:0 0 44px;border-radius:14px;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--pri) 90%,transparent);
}
.navbtn{position:relative;border-radius:12px}
.navbtn::before{
  content:"";position:absolute;left:0;top:50%;height:0;width:3px;border-radius:0 3px 3px 0;
  background:var(--pri);transform:translateY(-50%);transition:height .18s ease;
}
.navbtn.on{
  color:var(--pri);font-weight:700;
  background:linear-gradient(90deg,color-mix(in srgb,var(--pri) 16%,transparent),
                                   color-mix(in srgb,var(--pri) 5%,transparent));
}
.navbtn.on::before{height:56%}

/* -------------------------------------------------------------- top */
#top{
  padding:14px var(--pad);border-bottom-color:var(--hair);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
}
#top h1{letter-spacing:-.02em}
#page{animation:pagein .22s cubic-bezier(.2,.8,.3,1)}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}}

/* ---------------------------------------------------------- buttons */
.btn{border-color:var(--hair);border-radius:12px;letter-spacing:.005em}
.btn-pri{
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--pri-l) 30%,var(--pri)),var(--pri-d));
  border-color:transparent;
  box-shadow:0 10px 22px -14px color-mix(in srgb,var(--pri) 92%,transparent),
             inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-ok{background:linear-gradient(180deg,#22c55e,#15803d);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn-bad{background:linear-gradient(180deg,#ef4444,#b91c1c);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn-acc{background:linear-gradient(180deg,var(--acc),
  color-mix(in srgb,var(--acc) 70%,#000));border-color:transparent}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--surface2)}
.installbtn{white-space:nowrap}

.inp{border-color:var(--hair);border-radius:12px;
  background:color-mix(in srgb,var(--surface2) 88%,var(--surface))}
.inp:focus{box-shadow:0 0 0 4px var(--ring)}
.seg{border-color:var(--hair);border-radius:12px}
.seg button.on{background:linear-gradient(180deg,
  color-mix(in srgb,var(--pri-l) 28%,var(--pri)),var(--pri-d));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.chip{border-color:var(--hair)}
table.tbl th{background:color-mix(in srgb,var(--surface) 92%,transparent)}
table.tbl tbody tr{transition:background .12s}

/* ------------------------------------------------------- swatches */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 6px 6px;border-radius:14px;width:76px;color:var(--muted);
  border:1px solid transparent;transition:background .12s,border-color .12s}
.swatch .dot{width:34px;height:34px;border-radius:50%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -8px rgba(0,0,0,.6)}
.swatch:hover{background:var(--surface2)}
.swatch.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent);
  color:var(--pri);font-weight:700}
.swatch.on .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--pri)}

.steps{margin:14px 0 0;padding-inline-start:22px;line-height:2}
.steps li{font-weight:600}

/* ============================================================ বাকি */
.searchhero{
  margin-top:var(--gap);padding:10px;display:flex;gap:8px;align-items:center;
  border-color:color-mix(in srgb,var(--pri) 26%,var(--hair));
  box-shadow:0 0 0 4px var(--glow),var(--shadow);
}
.searchhero.first{margin-top:0;margin-bottom:var(--gap)}
.searchhero .field{flex:1;min-width:0}
.bigsearch{
  min-height:56px;font-size:1.12rem;font-weight:600;border:0;background:transparent;
}
.bigsearch:focus{box-shadow:none}

.avatar{
  width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:1.2rem;
  background:linear-gradient(135deg,var(--pri-l),var(--pri-d));
  box-shadow:0 10px 20px -12px color-mix(in srgb,var(--pri) 90%,transparent);
}
.avatar.sm{width:38px;height:38px;flex:0 0 38px;border-radius:12px;font-size:.98rem}

.duecard{overflow:hidden}
.duecard-head{
  display:flex;gap:14px;align-items:center;padding:18px var(--pad);
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--pri) 13%,transparent),
    color-mix(in srgb,var(--acc) 7%,transparent));
  border-bottom:1px solid var(--hair);
}
.duecard-name{font-size:1.22rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.duecard-amt{font-size:1.85rem;font-weight:800;color:var(--bad);letter-spacing:-.02em;
  line-height:1.1}
.duecard-body{padding:var(--pad)}
.minirow{gap:10px}
.mini{flex:1;min-width:130px;padding:10px 12px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--hair)}
.mini-v{font-weight:800;font-size:1.02rem;margin-top:3px}
.duecard-led{padding:0 var(--pad) var(--pad)}

.duelist{overflow:hidden;padding:4px}
.duerow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;transition:background .12s;
}
.duerow + .duerow{border-top:1px solid var(--hair)}
.duerow:hover{background:var(--surface2)}
.duerow:active{background:var(--surface3)}
.duerow .grow{display:flex;flex-direction:column;gap:1px;min-width:0}
.duerow-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duerow-amt{font-weight:800;color:var(--bad);white-space:nowrap;font-size:1.04rem}
.duerow-go{display:grid;place-items:center}

/* ------------------------------------------------------------ phone */
@media (max-width:900px){
  .tiles4{grid-template-columns:1fr 1fr}
  .tiles4 .tile{padding:12px 13px}
  .tiles4 .tile .v{font-size:1.12rem}
  .tiles4 .tile .k{font-size:.64rem}
  .tiles4 .tile .s{font-size:.7rem}
  .tiles4 .tile-hero{grid-column:1 / -1}
  .tiles4 .tile-hero .v{font-size:1.75rem}
  .installbtn{font-size:.78rem;padding:0 10px;min-height:36px}
  .duecard-head{padding:14px}
  .duecard-amt{font-size:1.5rem}
  .duecard-name{font-size:1.06rem}
  .mini{min-width:calc(50% - 5px)}
  .only-wide{display:none !important}
  .bigsearch{min-height:50px;font-size:1rem}
  #tabbar{
    background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top-color:var(--hair);
  }
  #tabbar button{position:relative;transition:color .14s}
  #tabbar button.on::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:30px;height:3px;border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,var(--pri-l),var(--pri));
  }
  #tabbar button.on .ic{transform:translateY(-1px)}
}
@media (min-width:901px){ .only-wide{display:inline-flex} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}


/* ---------------------------------------------------------- icons */
.ico-svg{
  width:1.25em;height:1.25em;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.btn .ico-svg{width:1.15em;height:1.15em}
.btn-icon .ico-svg{width:1.3em;height:1.3em}
.navbtn .ic{width:24px;flex:0 0 24px}
.navbtn .ic .ico-svg{width:21px;height:21px;stroke-width:1.75}
.navbtn.on .ic .ico-svg{stroke-width:2.05}
#tabbar button .ic .ico-svg{width:23px;height:23px}
.hero-ico{display:grid;place-items:center;width:44px;flex:0 0 44px;color:var(--faint)}
.hero-ico .ico-svg{width:22px;height:22px;stroke-width:2}
.searchhero:focus-within .hero-ico{color:var(--pri)}
.duerow-go .ico-svg{width:18px;height:18px;stroke-width:2;color:var(--faint)}


/* ------------------------------------------------------- dashboard */
.hero{
  overflow:hidden;border-color:transparent;color:#fff;
  background:
    radial-gradient(110% 150% at 100% 0%, color-mix(in srgb,var(--acc) 30%,transparent), transparent 66%),
    linear-gradient(135deg,var(--pri-d),var(--pri) 58%,var(--pri-l));
  box-shadow:0 20px 44px -26px color-mix(in srgb,var(--pri) 90%,transparent),var(--shadow);
}
.hero-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;
  padding:20px var(--pad) 16px}
.hero-greet{font-size:.88rem;opacity:.8;font-weight:600}
.hero-shop{font-size:1.5rem;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.hero-date{font-size:.82rem;opacity:.72;margin-top:5px}
.hero-cta{
  background:rgba(255,255,255,.96);color:var(--pri-d);border-color:transparent;
  font-weight:800;box-shadow:0 10px 24px -14px rgba(0,0,0,.7);
}
.hero-cta:hover{background:#fff;filter:none}
.hero-figs{
  display:flex;align-items:stretch;gap:0;padding:14px var(--pad) 18px;
  border-top:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.10);
}
.hero-fig{flex:1;min-width:0}
.hero-sep{width:1px;background:rgba(255,255,255,.16);margin:2px 14px}
.hero-k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75;
  font-weight:700}
.hero-v{font-size:1.9rem;font-weight:800;letter-spacing:-.025em;margin-top:4px;
  line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis}
.hero-v.sm{font-size:1.32rem}
.tiles3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.sec{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:800;margin-bottom:12px}
.searchhero.flat{box-shadow:var(--shadow);border-color:var(--hair)}
.searchhero.flat:focus-within{border-color:color-mix(in srgb,var(--pri) 40%,var(--hair));
  box-shadow:0 0 0 4px var(--glow),var(--shadow)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .gl-base{stroke-dasharray:none;stroke:color-mix(in srgb,var(--text) 22%,transparent)}
.chart .gl-t{fill:var(--faint);font-size:9px;font-weight:600}
.chart .bar-r{fill:url(#none);fill:var(--pri);opacity:.42;transition:opacity .2s}
.chart .bar-r.on{opacity:1}
.chart .bar-r.empty{fill:var(--surface3);opacity:1}
.chart:hover .bar-r{opacity:.66}
.chart .bar-r.on,.chart:hover .bar-r.on{opacity:1}
.chart .bar-v{fill:var(--muted);font-size:9.5px;font-weight:700}
.chart .bar-d{fill:var(--faint);font-size:9.5px;font-weight:600}
.chart .bar-d.on{fill:var(--pri);font-weight:800}

.rankrow{display:flex;gap:12px;align-items:flex-start}
.rank{
  width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface3);color:var(--muted);font-size:.74rem;font-weight:800;margin-top:1px;
}
.rankrow:first-child .rank{background:color-mix(in srgb,var(--pri) 18%,transparent);
  color:var(--pri)}
.bar{background:var(--surface3);height:7px;border-radius:99px}
.bar > i{background:linear-gradient(90deg,var(--pri-l),var(--pri));border-radius:99px}

@media (max-width:900px){
  .hero-top{padding:16px 14px 14px}
  .hero-shop{font-size:1.2rem}
  .hero-cta{width:100%}
  .hero-figs{padding:12px 14px 14px}
  .hero-figs{padding:11px 12px 13px}
  .hero-v{font-size:1.06rem;letter-spacing:-.03em}
  .hero-v.sm{font-size:1.02rem}
  .hero-k{font-size:.6rem;letter-spacing:.05em}
  .hero-sep{margin:2px 7px}
  .tiles3{grid-template-columns:1fr 1fr}
  .tiles3 .tile .v{font-size:1.18rem}
}


/* a label that begins with an icon lines the two up on one baseline */
.has-ico{display:inline-flex;align-items:center;gap:8px}
button.has-ico,a.has-ico{justify-content:center}
.empty .big.has-ico{justify-content:center}
.empty .big .ico-svg{width:1em;height:1em;stroke-width:1.3;opacity:.9}
.field-box{position:relative;display:flex;align-items:center}
.field-box > .inp{padding-inline-start:44px}
.field-ico{position:absolute;inset-inline-start:0;width:44px;display:grid;
  place-items:center;color:var(--faint);pointer-events:none}
.field-ico .ico-svg{width:19px;height:19px;stroke-width:2}
.field-box:focus-within .field-ico{color:var(--pri)}


/* -------------------------------------------------------- tables
   `table.tbl th` sets its own text-align, which quietly out-ranked the
   .right helper and left every number's heading sitting over the wrong
   column.  Headings now follow their cells, and the columns that hold
   numbers or buttons shrink to their content so the name column keeps
   the slack instead of everything drifting apart. */
table.tbl th.right,table.tbl td.right{text-align:right}
table.tbl th.fit,table.tbl td.fit{width:1%;white-space:nowrap}
table.tbl th.pad,table.tbl td.pad{padding-inline-end:22px}
table.tbl td .btn + .btn{margin-inline-start:6px}

/* ----------------------------------------------------- till adjust
   One label per column, boxes all the same height, nothing floating
   on its own line. */
.adjrow{
  display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;
  align-items:end;margin-top:12px;
}
.adjrow .field{min-width:0}
.adjrow .disc{display:flex;gap:8px;align-items:stretch}
.adjrow .disc .seg{flex:0 0 auto;padding:3px}
.adjrow .disc .seg button{min-height:auto;align-self:stretch;padding:0 12px}
.adjrow .disc .field{flex:1;min-width:0}
@media (max-width:520px){
  .adjrow{grid-template-columns:1fr 1fr}
  .adjrow > :first-child{grid-column:1 / -1}
}


/* ------------------------------------------------------- toolbars
   A search box next to a row of buttons.  The box used to be allowed
   to shrink to nothing on a phone, which is how a button ended up
   sitting on top of it: give it a floor, and let the buttons wrap
   underneath instead of fighting for the same line. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar > .field{flex:1 1 200px;min-width:160px}
.toolbar > .btn{flex:0 0 auto}
@media (max-width:640px){
  .toolbar > .field{flex:1 1 100%;min-width:0}
  .toolbar > .btn{flex:1 1 auto;justify-content:center}
}

/* ---------------------------------------------------- reports head */
.repbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.repbar > .seg{flex:0 1 auto;min-width:0}
.repbar .stepper{
  display:flex;align-items:center;gap:6px;flex:1 1 190px;min-width:0;
  justify-content:center;
}
.repbar .stepper .lbl{
  flex:1;min-width:0;text-align:center;font-size:1rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.repbar > .btn{flex:0 0 auto}
@media (max-width:760px){
  .repbar{flex-direction:column;align-items:stretch}
  .repbar > .seg{width:100%}
  .repbar > .seg button{flex:1;padding:0 8px}
  .repbar .stepper{width:100%}
  .repbar > .btn{width:100%;justify-content:center}
}

.datepick{
  margin-top:var(--gap);padding:var(--pad);
  background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--r);box-shadow:var(--shadow);
}
.datepick .field{flex:1 1 150px;min-width:0}
.datepick .btn{flex:1 1 auto;justify-content:center}


/* On a phone the photo and the cost price are the first things a
   shopkeeper can do without — dropping them keeps the name, the stock
   and the selling price on one screen instead of three wrapped lines. */
@media (max-width:640px){
  table.tbl .col-photo,table.tbl .col-cost{display:none}
  table.tbl th,table.tbl td{padding:10px 8px}
  table.tbl th.pad,table.tbl td.pad{padding-inline-end:10px}
}


/* A table with four columns and three buttons does not fit a phone.
   Below 640 the rows become little cards instead: name and price on
   the top line, stock and the buttons underneath. */
@media (max-width:640px){
  table.tbl-cards thead{display:none}
  table.tbl-cards,table.tbl-cards tbody,table.tbl-cards tr,
  table.tbl-cards td{display:block;width:auto}
  table.tbl-cards tr{
    display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;
    padding:12px 14px;border-bottom:1px solid var(--hair);
  }
  table.tbl-cards tr:last-child{border-bottom:0}
  table.tbl-cards tr:hover{background:transparent}
  table.tbl-cards td{padding:0;border:0}
  table.tbl-cards td.c-name{grid-column:1;grid-row:1;min-width:0}
  table.tbl-cards td.c-price{grid-column:2;grid-row:1;text-align:right;font-size:1.05rem}
  table.tbl-cards td.c-stock{grid-column:1;grid-row:2}
  table.tbl-cards td.c-act{grid-column:2;grid-row:2;text-align:right;white-space:nowrap}
  table.tbl-cards td.c-act .btn{min-height:38px;width:38px;padding:0}
  table.tbl-cards td.c-act .btn + .btn{margin-inline-start:6px}
  /* the phone number already sits under the name on a card */
  table.tbl-cards td.c-hide-phone{display:none}
}


/* ------------------------------------------------------- checkbox row */
.checkrow{
  display:flex;align-items:center;gap:10px;min-height:var(--tap);
  padding:0 2px;cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600;
}
.checkrow input{
  width:22px;height:22px;flex:0 0 22px;accent-color:var(--pri);margin:0;cursor:pointer;
}
.checkrow:hover{color:var(--text)}


/* ---------------------------------------------- A4 memo, on screen */
.modal.wide{width:min(900px,100%)}
.invpaper{
  background:#fff;color:#101a17;border-radius:8px;padding:26px 28px;
  box-shadow:inset 0 0 0 1px #e6ecea;
  --ink:var(--pri-d);--stamp:var(--pri-d);
}
html[data-theme="dark"] .invpaper{--ink:#0b5f58}
.invpaper .inv-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.invpaper .inv-brand{display:flex;gap:12px;align-items:flex-start;min-width:0}
.invpaper .inv-mark{width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:grid;
  place-items:center;color:#fff;font-weight:800;font-size:1.35rem;background:var(--ink)}
.invpaper .inv-shop{font-size:1.3rem;font-weight:800;line-height:1.2}
.invpaper .inv-meta{font-size:.78rem;color:#5d6b67;line-height:1.45}
.invpaper .inv-stamp{border:2px solid var(--stamp);border-radius:8px;padding:6px 16px;
  text-align:center;flex:0 0 auto}
.invpaper .inv-stamp.ok{--stamp:#12795f}
.invpaper .inv-stamp.warn{--stamp:#b06a00}
.invpaper .inv-stamp.bad{--stamp:#b3261e}
.invpaper .inv-stamp-t{color:var(--stamp);font-weight:800;font-size:1.02rem}
.invpaper .inv-stamp-s{color:var(--stamp);font-size:.7rem;margin-top:2px}
.invpaper .inv-rule{height:3px;background:var(--ink);margin-top:12px;border-radius:2px}
.invpaper .inv-title{text-align:center;color:var(--ink);font-size:1.1rem;
  margin:16px 0 18px;font-weight:800}
.invpaper .inv-parties{display:flex;gap:20px;justify-content:space-between;margin-bottom:18px}
.invpaper .inv-lbl{font-size:.72rem;font-weight:800;color:var(--ink);
  margin-bottom:4px}
.invpaper .inv-cust,.invpaper .inv-no{font-size:1rem;font-weight:800}
.invpaper .inv-tbl{width:100%;border-collapse:collapse}
.invpaper .inv-tbl th{font-size:.72rem;font-weight:700;color:#5d6b67;text-align:left;
  padding:8px 10px;border-bottom:1.5px solid #cfd9d6;background:transparent}
.invpaper .inv-tbl th.right,.invpaper .inv-tbl td.right{text-align:right}
.invpaper .inv-tbl td{padding:9px 10px;border-bottom:1px solid #e6ecea;vertical-align:top}
.invpaper .inv-tbl .sl{width:34px;color:#5d6b67}
.invpaper .inv-item{font-weight:700}
.invpaper .strong{font-weight:800}
.invpaper .inv-foot{display:flex;gap:24px;justify-content:space-between;margin-top:14px}
.invpaper .inv-words{flex:1;min-width:0;padding-top:6px}
.invpaper .inv-sum{flex:0 0 58%;max-width:300px}
.invpaper .inv-sum-r{display:flex;justify-content:space-between;gap:16px;padding:5px 0;
  font-size:.92rem}
.invpaper .inv-sum-r .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.invpaper .inv-sum-r.total{border-top:1.5px solid #cfd9d6;margin-top:6px;padding-top:9px;
  font-size:1.2rem;font-weight:800;color:var(--ink)}
.invpaper .inv-sum-r.pay{color:#5d6b67;font-size:.85rem}
.invpaper .inv-sum-r.due{border-top:1px solid #e6ecea;margin-top:4px;padding-top:8px;
  font-weight:800;color:#b3261e}
.invpaper .inv-sign{display:flex;gap:40px;justify-content:space-between;margin-top:46px}
.invpaper .inv-sign-b{flex:0 0 42%}
.invpaper .inv-line{border-top:1px solid #9aa7a3;margin-bottom:5px}
.invpaper .inv-note{margin-top:28px;padding-top:10px;border-top:1px solid #e6ecea;
  text-align:center;font-size:.85rem}
@media (max-width:700px){
  .invpaper{padding:16px 14px;font-size:.88rem}
  .invpaper .inv-parties,.invpaper .inv-foot,.invpaper .inv-sign{
    flex-direction:column;gap:12px}
  .invpaper .inv-sum{flex:1 1 auto;max-width:none}
  .invpaper .inv-sign-b{flex:1 1 auto}
  .invpaper .right{text-align:left}
  .invpaper .inv-tbl th,.invpaper .inv-tbl td{padding:7px 6px}
}

</style>

<style>
/* ===================================================================
   The typeface travels with the app.

   A shop file gets opened on whatever phone or desktop the shopkeeper
   owns, with no network behind it, so the font cannot be fetched — it
   is carried inside the file.  Bengali and Latin are separate subsets
   with their own unicode-range, so a Latin-only page never pays for
   the Bengali glyphs it does not draw.
   =================================================================== */
